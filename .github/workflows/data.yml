# The gate the license data has to pass. Every step is a command you can run yourself,
# and `make check` runs all four in this order.
name: data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: license data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies of the checks
        run: pip install -r requirements.txt

      # Parsing, the field every record needs, the action vocabulary, the review
      # coverage, the ports and variants, the encoding conventions, and the comparison
      # of the per-record files with the combined document triple for triple. The known
      # gaps come out as warnings; docs/DATA.md lists and explains them.
      - name: The data gate
        run: python scripts/validate_data.py

      # The combined document is generated, so it has to be exactly what the per-record
      # files produce. This is the check that catches a hand edit of it.
      - name: The canonical check
        run: python scripts/build_licenselibrary.py --check

      # The rule set behind POST /licenselibrary/consistencycheck, over every record.
      # Two records are expected to conflict and the content review confirmed both
      # against their texts; any third one fails this step.
      - name: The consistency sweep
        run: python scripts/review/consistency_sweep.py

      # Rule 14 (no padding space inside a literal) has 575 open violations, all
      # cosmetic and all in the Creative Commons ports. Fixing them takes 288 records to
      # a new version in one sweep, so it waits for a commit of its own; docs/DATA.md
      # records it under the known data-quality issues.
      - name: The family rules
        run: python scripts/review/family_rules.py --strict --skip-rule 14

      # The command-line check of one record, on a record that passes every check, so a
      # copy of the three service modules that no longer fits together fails here.
      - name: Check one record offline
        run: PYTHONPATH=scripts python -m dalicc_check MIT

      # The README names the release identifier of the data it was published with, and
      # the two have to agree: a data change pushed without the README it belongs to
      # would leave the repository saying it holds data it does not hold.
      - name: The release identifier in the README
        run: |
          release="$(PYTHONPATH=scripts python -m dalicc_check --release | awk '$1 == "release" {print $2}')"
          test -n "$release"
          echo "the data in this commit is $release"
          grep -qF "$release" README.md
