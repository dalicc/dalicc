# The identifiers the license library retired on 2023-04-24, and where each one went.
#
# The old records are kept under deprecated/licenses_pre24042023/ and are never loaded.
# Each entry below was matched to its successor by title, by the legal code URL and by
# the SPDX identifier of the successor record; `successor: null` marks the six test and
# personal records that were dropped without one.
#
# The site answers /license-library/<old id> with a 301 to the successor's page, and
# GET /licenselibrary/license/<old id> with a 301 to the successor's document, whenever
# the old identifier no longer resolves on its own. An identifier with no successor
# answers 410. docs/DATA.md section 8 describes the table.
retired_on: '2023-04-24'
