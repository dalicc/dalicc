  - action: changed
    statement: rule dalicc:promote dalicc:NotGrantedByDefault in dalicc:worldwide
    previous: rule dalicc:promote dalicc:NotGrantedByDefault in dalicc:worldwide
    reason: 'The explanations of the rules were reviewed against the statutes they cite; seven were corrected:
      the Austrian moral-rights rule names what section 19(2) of the Urheberrechtsgesetz voids and what
      section 20 leaves to agreement; the French rule cites the Code de la propriété intellectuelle with
      its accents; decompilation is allowed within the limits of article 6 of the Software Directive,
      and a prohibition is reported by eu-interop-void instead of being read as removing the exception;
      resale follows Tom Kabinet (C-263/18) for works and UsedSoft (C-128/11) for software; the database
      right names the lawful user''s right to insubstantial parts (articles 8(1) and 15 of the Database
      Directive); the mining rule reads a prohibition in the licence as a reservation under article 4(3)
      and recital 18 of the Digital Single Market Directive; and the research mining rule names cultural
      heritage institutions and the purpose of scientific research. The description says that moral rights
      are national law, which EU law does not harmonise. The adopted endorsement rule of the core graph
      cites its basis, says that only a use suggesting endorsement is refused, and names who adopted it.
      Follows core graph version 3.'
    source: build_dependency_graphs
