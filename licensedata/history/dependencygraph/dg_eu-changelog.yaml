id: dg_eu
title: European Union default rules
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: 'The title no longer says proposal, and the graph is complete: it holds the 46 axioms and the
    adopted endorsement rule of the core graph beside its own rules, is generated from the core graph
    and its difference file, and every rule explains itself in plain words, checked against the statute
    it cites. Follows core graph version 2.'
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: dct:title "European Union default rules"
    previous: dct:title "European Union default rules (proposal)"
    reason: 'A title that says proposal reads as if the graph itself were not published, and it is: every
      reader can choose it. What is proposed is each rule, and each rule says so with dalicc:ruleStatus
      dalicc:Proposed, which the pages show next to it. The rules are unchanged.'
    source: dependency-graph-review 2026-09-24
  - action: changed
    statement: 'dct:description: This graph extends the DALICC deontic dependency graph with default rules
      for what a licence does not say, under the law of the European Union: moral rights that cannot be
      waived in Austria, Germany and France, the sui generis database right, the mining exceptions of
      the Digital Single Market Directive, decompilation for interoperability and exhaustion after a first
      sale. Each rule names its legal basis. The rules are proposals until the association''s legal reviewer
      adopts them. Nothing in this graph is legal advice.'
    previous: 'dct:description: The core graph plus the default rules proposed for the European Union:
      moral rights that cannot be waived in Austria, Germany and France, the sui generis database right,
      the mining exceptions of the Digital Single Market Directive, decompilation for interoperability
      and exhaustion after a first sale. Every rule is a proposal for the association''s legal reviewer.
      Nothing in it is legal advice.'
    reason: 'The description says in plain sentences what the graph is: it extends the core graph with
      default rules for what a licence does not say, each rule names its legal basis, the rules are proposals
      until the association''s legal reviewer adopts them, and nothing in the graph is legal advice.'
    source: dependency-graph-review 2026-09-24
