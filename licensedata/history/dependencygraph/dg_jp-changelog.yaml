  - action: changed
    statement: rule dalicc:promote dalicc:NotGrantedByDefault in dalicc:worldwide
    previous: rule dalicc:promote dalicc:NotGrantedByDefault in dalicc:worldwide
    reason: 'The explanations of the rules were reviewed against the statutes they cite; three were corrected:
      the moral-rights rule says that article 59 forbids a transfer and that an agreement not to exercise
      the rights is decided case by case; the resale rule notes that cinematographic works fall under
      article 26 and cites the Supreme Court decision of 25 April 2002 on game software; and the mining
      rule quotes the proviso of article 30-4 on unreasonable prejudice to the copyright owner. The adopted
      endorsement rule of the core graph cites its basis, says that only a use suggesting endorsement
      is refused, and names who adopted it. Follows core graph version 3.'
    source: build_dependency_graphs
