id: Apache-2.0
title: Apache License, Version 2.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 permission, changed 2 permissions, recorded the
    relation to the record this one was adapted from and recorded the review state. Later changes
    brought it in line with its family and its text in the verification of 2026-09-15, recorded which
    sentence of the text each statement rests on and named the license the record itself is published
    under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, dalicc:modificationNotice]
    reason: 'Section 4(a) reads: "You must give any other recipients of the Work or Derivative Works
      a copy of this License". The cc:Notice duty was attached to odrl:distribute only, so a modified
      or derived work looked as if it could be passed on without the license. Added cc:Notice to odrl:modify
      and odrl:derive.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission odrl:grantUse
    reason: Section 2 grants a "perpetual, worldwide, non-exclusive, no-charge, royalty-free, irrevocable
      copyright license to reproduce, prepare Derivative Works of, publicly display, publicly perform,
      sublicense, and distribute the Work". Sublicensing was not modelled. Added odrl:grantUse.
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, dalicc:modificationNotice]
    reason: 'Section 4(a) reads: "You must give any other recipients of the Work or Derivative Works
      a copy of this License". The cc:Notice duty was attached to odrl:distribute only, so a modified
      or derived work looked as if it could be passed on without the license. Added cc:Notice to odrl:modify
      and odrl:derive.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission dalicc:patentGrant
    reason: 'The review''s finding on family consistency: the record made no patent statement although
      section 3 grants a patent license ''to make, have made, use, offer to sell, sell, import, and
      otherwise transfer the Work'' and ends it ''If You institute patent litigation against any entity
      ... alleging that the Work or a Contribution incorporated within the Work constitutes direct
      or contributory patent infringement''.'
    source: manual
  - action: added
    statement: prohibition dalicc:patentRetaliationTermination
    reason: 'The review''s finding on family consistency: the record made no patent statement although
      section 3 grants a patent license ''to make, have made, use, offer to sell, sell, import, and
      otherwise transfer the Work'' and ends it ''If You institute patent litigation against any entity
      ... alleging that the Work or a Contribution incorporated within the Work constitutes direct
      or contributory patent infringement''.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "You must give any other recipients of the Work or Derivative Works a copy of this License;
      and"'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "You must give any other recipients of the Work or Derivative Works a copy of this License;
      and"'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "You must give any other recipients of the Work or Derivative Works a copy of this License;
      and"'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "This License
      does not grant permission to use the trade names, trademarks, service marks, or product names
      of the Licensor, except as required for reasonable and customary use in describing the origin
      of the Work and reproducing the content of the NOTICE file."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
