id: LGPL-2.1-or-later
title: GNU Lesser General Public License v2.1 or later
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 left endorsement to the default rule of the core dependency
    graph, recorded which sentence of the text each statement rests on, named the license the record
    itself is published under and recorded the licenses a work under it may be released under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: duty cc:ShareAlike
    previous: duty cc:ShareAlike
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You must cause
      the whole of the work to be licensed at no charge to all third parties under the terms of this
      License."'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    reason: Its duty dalicc:modificationNotice quotes "You must cause the files modified to carry
      prominent notices stating that you changed the files and the date of any change."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    reason: Its duty dalicc:modificationNotice quotes "You must cause the files modified to carry
      prominent notices stating that you changed the files and the date of any change."
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not copy,
      modify, sublicense, link with, or distribute the Library except as expressly provided under
      this License."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not copy,
      modify, sublicense, link with, or distribute the Library except as expressly provided under
      this License."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:GPL-2.0-only
    reason: 'Section 3 reads: "You may opt to apply the terms of the ordinary GNU General Public License
      instead of this License to a given copy of the Library." and adds "(If a newer version than
      version 2 of the ordinary GNU General Public License has appeared, then you can specify that
      version instead if you wish.)"'
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:GPL-2.0-or-later
    reason: 'Section 3 reads: "You may opt to apply the terms of the ordinary GNU General Public License
      instead of this License to a given copy of the Library." and adds "(If a newer version than
      version 2 of the ordinary GNU General Public License has appeared, then you can specify that
      version instead if you wish.)"'
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:GPL-3.0-only
    reason: 'Section 3 reads: "You may opt to apply the terms of the ordinary GNU General Public License
      instead of this License to a given copy of the Library." and adds "(If a newer version than
      version 2 of the ordinary GNU General Public License has appeared, then you can specify that
      version instead if you wish.)"'
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:GPL-3.0-or-later
    reason: 'Section 3 reads: "You may opt to apply the terms of the ordinary GNU General Public License
      instead of this License to a given copy of the Library." and adds "(If a newer version than
      version 2 of the ordinary GNU General Public License has appeared, then you can specify that
      version instead if you wish.)"'
    source: manual
