id: CC-BY-NC-ND-2.0
title: Creative Commons Attribution-NonCommercial-NoDerivatives 2.0 Generic
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 left endorsement to the default rule of the core dependency
    graph, recorded which sentence of the text each statement rests on and named the license the record
    itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "If you distribute, publicly display, publicly perform,
      or publicly digitally perform the Work, You must keep intact all copyright notices for the Work
      and give the Original Author credit reasonable to the medium or means You are utilizing by conveying
      the name (or pseudonym if applicable) of the Original Author if supplied; the title of the Work
      if supplied; and to the extent reasonably practicable, the Uniform Resource Identifier, if any,
      that Licensor specifies to be associated with the Work, unless such URI does not refer to the
      copyright notice or licensing information for the Work."
    source: manual
  - action: changed
    statement: prohibition cc:CommercialUse
    previous: prohibition cc:CommercialUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not exercise
      any of the rights granted to You in Section 3 above in any manner that is primarily intended
      for or directed toward commercial advantage or private monetary compensation."'
    source: manual
  - action: changed
    statement: prohibition dalicc:royaltyCollectionReserved
    previous: prohibition dalicc:royaltyCollectionReserved
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Licensor reserves
      the exclusive right to collect, whether individually or via a performance rights society (e.g.
      ASCAP, BMI, SESAC), royalties for the public performance or public digital performance (e.g.
      webcast) of the Work if that performance is primarily intended for or directed toward commercial
      advantage or private monetary compensation."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not offer
      or impose any terms on the Work that alter or restrict the terms of this License or the recipients''
      exercise of the rights granted hereunder. You may not sublicense the Work."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
