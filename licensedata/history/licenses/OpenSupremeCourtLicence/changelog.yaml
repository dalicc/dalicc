id: OpenSupremeCourtLicence
title: Open Supreme Court Licence
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 clause text and 1 permission, changed 2 permissions,
    recorded the relation to the record this one was adapted from and recorded the review state. Later
    changes brought it in line with its family and its text in the verification of 2026-09-15, permitted
    relicensing with the notice as a duty, recorded which sentence of the text each statement rests
    on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: 'dalicc:additionalClauses "You must (where you copy, publish, distribute, transmit,
      adapt or exploit the Information): ensure that you do not use the Information in a way that
      suggests any official status or that the Licensor endorses you or your use of the Information;
      ensure that you (i) do not mislead others or misrepresent the Information or its source; (ii)
      do not present the Information in a way that does not have regard to the dignity of the Court
      and to its function as a working body; and (iii) do not use it in any way that jeopardises the
      proper administration of justice; ensure that your use of the Information does not breach the
      Data Protection Act 1998 or the Privacy and Electronic Communications (EC Directive) Regulations
      2003 or is otherwise unlawful."'
    reason: 'The licence carries four conditions that no deontic term can express and the record carried
      none of them: the non-endorsement rule, the duty not to mislead or misrepresent the information
      or its source, the duty to have regard to the dignity of the Court and to its function as a
      working body and not to jeopardise the proper administration of justice, and the duty not to
      breach the Data Protection Act 1998 or the Privacy and Electronic Communications (EC Directive)
      Regulations 2003. Quoted verbatim into dalicc:additionalClauses so that they are at least visible
      in the record.'
    source: review-finding 6/dalicc:additionalClauses
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:UkOpenGovernmentLicenseForPublicSectorInformation
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "edition"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: permission cc:DerivativeWorks with duties [cc:Attribution, cc:Notice]
    previous: permission cc:DerivativeWorks with duties [cc:Attribution]
    reason: 'The licence requires two things when the information is used and the record modelled
      only one. Section "You must (where you do any of the above)": "acknowledge the source of the
      Information by including the following attribution statement and, where possible, provide a
      link to this licence; Contains Supreme Court information licensed under the Open Supreme Court
      Licence v1.0." cc:Attribution was attached to cc:DerivativeWorks and odrl:distribute; cc:Notice
      was missing everywhere, although the attribution statement is itself a licence notice and the
      licence asks for a link to itself. Added next to cc:Attribution in both permissions, which is
      how the sibling record NCGL-UK-2.0 models the same sentence.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission dalicc:ModifiedWorks
    reason: dalicc:ModifiedWorks, distributing a modified version and making it available to the public,
      was missing although the licence permits adapting the Information and publishing, distributing
      and transmitting it in the same list, and the sibling record NCGL-UK-2.0 carries the permission
      on the identical wording. Added.
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution]
    reason: 'The licence requires two things when the information is used and the record modelled
      only one. Section "You must (where you do any of the above)": "acknowledge the source of the
      Information by including the following attribution statement and, where possible, provide a
      link to this licence; Contains Supreme Court information licensed under the Open Supreme Court
      Licence v1.0." cc:Attribution was attached to cc:DerivativeWorks and odrl:distribute; cc:Notice
      was missing everywhere, although the attribution statement is itself a licence notice and the
      licence asks for a link to itself. Added next to cc:Attribution in both permissions, which is
      how the sibling record NCGL-UK-2.0 models the same sentence.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The review''s finding on family consistency, applied to the third record of the Open
      Government Licence family: the unsupported cc:ShareAlike and dalicc:addStatement prohibitions
      are removed and the database right the licence covers is stated.'
    source: manual
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: 'The review''s finding on family consistency, applied to the third record of the Open
      Government Licence family: the unsupported cc:ShareAlike and dalicc:addStatement prohibitions
      are removed and the database right the licence covers is stated.'
    source: manual
  - action: removed
    statement: prohibition dalicc:addStatement
    reason: 'The review''s finding on family consistency, applied to the third record of the Open
      Government Licence family: the unsupported cc:ShareAlike and dalicc:addStatement prohibitions
      are removed and the database right the licence covers is stated.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "The Licensor grants you a worldwide,
      royalty-free, perpetual, non-exclusive licence to use the Information subject to the conditions
      below." The permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because
      the notice has to survive the relicensing.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
