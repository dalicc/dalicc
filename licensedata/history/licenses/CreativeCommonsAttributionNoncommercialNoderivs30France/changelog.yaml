id: CreativeCommonsAttributionNoncommercialNoderivs30France
title: Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 France
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state. Later changes recorded what the text says about the database
    right, recorded when the license ends on a breach and named the license the record itself is published
    under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-nd/3.0/fr/>
    reason: The record carried cc:legalcode but no dct:source. The legal-code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/fr/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-NC-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights expressly.
      Article 3 grants, over and above the copyright acts, the right to "extraire et reutiliser des
      parties substantielles" when the work is a database protected by the database producer right,
      the definition of "Oeuvre" covers "une base de donnees dans la mesure ou elle est protegee par
      le droit d''auteur ou le droit des producteurs de bases de donnees", and the licensor waives
      its own sui generis right where it holds one: "l''Offrant renonce a ce droit". Article 4(e)
      adds that article 3 and articles 4(a) and 4(b) do not apply to the part of the work that is
      covered by the database producer right alone. Because the grant of the database right is explicit
      in the text, dcmitype:Dataset was added rather than proposed.'
    source: review-finding 2/odrl:target
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The port settles the sui generis database right in its own text: Article 3 grants, over
      and above the copyright acts, the right to "extraire et reutiliser des parties substantielles"
      when the work is a database, the definition of Oeuvre covers "une base de donnees dans la mesure
      ou elle est protegee par le droit d''auteur ou le droit des producteurs de bases de donnees",
      and the licensor waives its own sui generis right where it holds one, "l''Offrant renonce a
      ce droit". dalicc:suiGenerisDatabaseRights is now permitted, and it carries no duty because
      Article 4(e) adds that article 3 and articles 4(a) and 4(b) do not apply to the part of the
      work that is covered by the database producer right alone.'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Toute violation par l''Acceptant des clauses
      de cette Licence entraînera sa résiliation automatique et la fin des droits qui en découlent."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
