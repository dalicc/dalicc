    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Weak-copyleft family alignment of 2026-09-15: the record said nothing about four clauses
    its text-modelled sibling CDDL-1.1 quotes from the same sentences. Section 2.1(a) grants the right
    to ''use, reproduce, modify, display, perform, sublicense and distribute the Original Software'',
    which is the sublicensing permission, and grants it ''under intellectual property rights (other
    than patent or trademark)'', which is the promotion prohibition; section 6.2 ends every right
    granted ''upon 60 days notice'' after a patent infringement claim, which is the patent-retaliation
    prohibition; and section 3.3 requires the distributor to keep ''any notices of licensing or any
    descriptive text giving attribution to any Contributor'', which is the attribution duty on distribution.'
  changes:
  - action: added
    statement: permission dalicc:sublicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Notice, cc:ShareAlike, cc:SourceCode]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: prohibition dalicc:patentRetaliationTermination
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: prohibition dalicc:promote
    reason: Edited by hand; see the summary of this entry.
    source: manual
