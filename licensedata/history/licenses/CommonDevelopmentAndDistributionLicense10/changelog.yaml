- version: 3
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Batch 3 finding 5 and consolidation decision 4: the share-alike duty hung off odrl:distribute
    and odrl:modify but not off odrl:derive, the record made no patent statement although section
    2.1(b) grants one, relicensing was prohibited although section 3.6 lets an Executable go out ''under
    the terms of a license of Your choice'', and dct:publisher was the placeholder ''N.N.''.'
  changes:
  - action: removed
    statement: dct:publisher "N.N."
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:patentGrant
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
