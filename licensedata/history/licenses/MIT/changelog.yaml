- version: 3
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Batch 1 finding 7.1 and 7.2: the record carried neither the relicensing prohibition its
    siblings carry nor a separate liability clause. The MIT text says ''The above copyright notice
    and this permission notice shall be included in all copies or substantial portions of the Software'',
    which is the same clause IscLicense and BSD-3-Clause model as a dalicc:ChangeLicense prohibition,
    and its disclaimer paragraph holds two sentences, the second beginning ''IN NO EVENT SHALL THE
    AUTHORS OR COPYRIGHT HOLDERS BE LIABLE''.'
  changes:
  - action: added
    statement: dalicc:LiabilityLimitation "IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE
      FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE,
      ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE."
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF
      ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT."
    previous: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY
      KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS
      FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS
      BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT
      OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS
      IN THE SOFTWARE."
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: prohibition dalicc:ChangeLicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Family
    rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no source
    code asks only that the notice travels with the copy, which is a duty on the acts it governs and
    not a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission
    here, and the prohibition the earlier pass wrote is removed. The text reads: "Permission is hereby
    granted, free of charge, to any person obtaining a copy of this software and associated documentation
    files (the "Software"), to deal in the Software without restriction, including without limitation
    the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of
    the Software ... subject to the following conditions: The above copyright notice and this permission
    notice shall be included in all copies or substantial portions of the Software." The permission
    carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive
    the relicensing.'
  changes:
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: prohibition dalicc:ChangeLicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
