id: MIT
title: The MIT License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 2 permissions, changed
    2 permissions and recorded the review state. Later changes brought it in line with its family
    and its text in the verification of 2026-09-15, permitted relicensing with the notice as a duty,
    recorded which sentence of the text each statement rests on and named the license the record itself
    is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: 'The grant reads: "to deal in the Software without restriction, including without limitation
      the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies
      of the Software". Sublicensing (odrl:grantUse) and charging for a copy (dalicc:chargeDistributionFee)
      were not modelled. Added both.'
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 8: the MIT license states one condition and it is not a change log, so
      the modification notice duty was removed.'
    source: consolidation-decision 8
  - action: added
    statement: permission odrl:grantUse
    reason: 'The grant reads: "to deal in the Software without restriction, including without limitation
      the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies
      of the Software". Sublicensing (odrl:grantUse) and charging for a copy (dalicc:chargeDistributionFee)
      were not modelled. Added both.'
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 8: the MIT license states one condition and it is not a change log, so
      the modification notice duty was removed.'
    source: consolidation-decision 8
  - action: added
    statement: spdx:licenseId "MIT"
    reason: The record id is the SPDX list id but the field was absent. Added.
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: dalicc:LiabilityLimitation "IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE
      FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE,
      ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE."
    reason: 'The review''s finding on family consistency: the record carried neither the relicensing
      prohibition its siblings carry nor a separate liability clause. The MIT text says ''The above
      copyright notice and this permission notice shall be included in all copies or substantial portions
      of the Software'', which is the same clause IscLicense and BSD-3-Clause model as a dalicc:ChangeLicense
      prohibition, and its disclaimer paragraph holds two sentences, the second beginning ''IN NO
      EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE''.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF
      ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT."
    previous: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY
      KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS
      FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS
      BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT
      OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS
      IN THE SOFTWARE."
    reason: 'The review''s finding on family consistency: the record carried neither the relicensing
      prohibition its siblings carry nor a separate liability clause. The MIT text says ''The above
      copyright notice and this permission notice shall be included in all copies or substantial portions
      of the Software'', which is the same clause IscLicense and BSD-3-Clause model as a dalicc:ChangeLicense
      prohibition, and its disclaimer paragraph holds two sentences, the second beginning ''IN NO
      EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE''.'
    source: manual
  - action: added
    statement: prohibition dalicc:ChangeLicense
    reason: 'The review''s finding on family consistency: the record carried neither the relicensing
      prohibition its siblings carry nor a separate liability clause. The MIT text says ''The above
      copyright notice and this permission notice shall be included in all copies or substantial portions
      of the Software'', which is the same clause IscLicense and BSD-3-Clause model as a dalicc:ChangeLicense
      prohibition, and its disclaimer paragraph holds two sentences, the second beginning ''IN NO
      EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE''.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "Permission is hereby granted, free of
      charge, to any person obtaining a copy of this software and associated documentation files (the
      "Software"), to deal in the Software without restriction, including without limitation the rights
      to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software
      ... subject to the following conditions: The above copyright notice and this permission notice
      shall be included in all copies or substantial portions of the Software." The permission carries
      the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
      relicensing.'
    source: manual
  - action: removed
    statement: prohibition dalicc:ChangeLicense
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "Permission is hereby granted, free of
      charge, to any person obtaining a copy of this software and associated documentation files (the
      "Software"), to deal in the Software without restriction, including without limitation the rights
      to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software
      ... subject to the following conditions: The above copyright notice and this permission notice
      shall be included in all copies or substantial portions of the Software." The permission carries
      the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
      relicensing.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission dalicc:chargeDistributionFee
    previous: permission dalicc:chargeDistributionFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Permission is
      hereby granted, free of charge, to any person obtaining a copy of this software and associated
      documentation files (the "Software"), to deal in the Software without restriction, including
      without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense,
      and/or sell copies of the Software, and to permit persons to whom the Software is furnished
      to do so, subject to the following conditions:"'
    source: manual
  - action: changed
    statement: permission odrl:grantUse
    previous: permission odrl:grantUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Permission is
      hereby granted, free of charge, to any person obtaining a copy of this software and associated
      documentation files (the "Software"), to deal in the Software without restriction, including
      without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense,
      and/or sell copies of the Software, and to permit persons to whom the Software is furnished
      to do so, subject to the following conditions:"'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
