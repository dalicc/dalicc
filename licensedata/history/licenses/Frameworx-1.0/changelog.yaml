id: Frameworx-1.0
title: Frameworx Open License 1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on,
    named the license the record itself is published under and removed the quotes that do not name
    the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: changed
    statement: permission dalicc:chargeDistributionFee
    previous: permission dalicc:chargeDistributionFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions hereof, The Frameworx Company hereby grants You a non-exclusive license
      (the License), subject to third party intellectual property claims, and for no fee other than
      a nominal charge reflecting the costs of physical distribution, to:"'
    source: manual
  - action: changed
    statement: permission dalicc:sublicense
    previous: permission dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The Frameworx
      Company hereby grants to you all rights to sub-license your rights hereunder as necessary to
      fully effect the intent and purpose of this Section 4 above, provided, however, that your rights
      and obligations hereunder shall be unaffected by any such sublicensing."'
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Complete Source
      Code for any Downstream Distribution directly or indirectly made by You that contains, or depends
      for its intended functionality on, the Frameworx Code Base, or any portion or element thereof,
      shall be made freely available to all users thereof on terms and conditions no more restrictive,
      and no less favorable for any user (including, without limitation, with regard to Source Code
      availability and royalty-free use) than those terms and conditions provided in this License
      Agreement."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'Removed the quoted evidence of prohibition dalicc:ChangeLicense: the quoted sentence
      does not name the act. The statements stay, read from the text without a linked quote.'
    source: manual
