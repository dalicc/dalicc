id: AttributionNoncommercial30Portugal
title: Creative Commons Attribution-NonCommercial 3.0 Portugal
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc/3.0/pt/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc/3.0/pt/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles database rights expressly:
      the last sentence of Section 3 waives the sui generis right, so that where the Licensor holds
      the exclusive rights of Chapter III of Decreto-Lei 122/2000, which implements Directive 96/9/EC
      in Portuguese law, the Licensor "declara expressamente renunciar a esses direitos", and Section
      4(e) adds that the restrictions do not apply to the parts of the Work protected only by that
      database maker''s right. Beyond that, the definition of "Trabalho" in Section 1 names "uma base
      de dados que, pela selecao ou disposicao do respetivo conteudo, constitua uma criacao intelectual"
      and "um programa de computador" among the licensed subject matter. Because the legal text names
      databases as licensed subject matter and disposes of the database maker''s right in the grant
      itself, dcmitype:Dataset was added here rather than left as a proposal. The ports in this batch
      whose text has no database clause at all keep the proposal.'
    source: review-finding 2/odrl:target
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: the last sentence of
    Section 3 waives the sui generis right of Chapter III of Decreto-Lei 122/2000, which implements
    Directive 96/9/EC in Portuguese law, where the Licensor "declara expressamente renunciar a esses
    direitos", and the definition of Trabalho in Section 1 names "uma base de dados que, pela selecao
    ou disposicao do respetivo conteudo, constitua uma criacao intelectual" among the licensed subject
    matter. dalicc:suiGenerisDatabaseRights is now permitted, and it carries no duty because Section
    4(e) adds that the restrictions do not apply to the parts of the Work protected only by that database
    maker''s right.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
