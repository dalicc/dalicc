title: Computer Associates Trusted Open Source License 1.1
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 removed 1 prohibition and recorded the review state.
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: The license states that the Program and every Contribution are "governed by the terms
      of this License" and requires source availability for any distribution. Prohibiting cc:ShareAlike
      asserts the opposite. Removed.
    source: review-finding 5/odrl:prohibition
