id: CreativeCommonsAttributionSharealike30Austria
title: Creative Commons Attribution-ShareAlike 3.0 Austria
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 identification details and 1 prohibition, changed
    4 alternative titles and 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 AT"
    previous: dct:alternative "CC BY SA 3.0 at"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 AT"
    previous: dct:alternative "CC BY-SA 3.0 at"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 AT"
    previous: dct:alternative "CC-BY-SA 3.0 at"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 AT"
    previous: dct:alternative "Creative Commons BY-SA 3.0 at"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/at/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of the port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/at/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port names a database as licensed subject
      matter in its own text: Ziffer 3: "Soweit Datenbanken oder Zusammenstellungen von Daten Schutzgegenstand
      dieser Lizenz oder Teil dessen sind und einen immaterialgueterrechtlichen Schutz eigener Art
      geniessen, verzichtet der Lizenzgeber auf die Geltendmachung saemtlicher daraus resultierender
      Rechte." Ziffer 4 adds that the restrictions do not apply to parts of the Schutzgegenstand that
      fall under the definition only because they enjoy sui generis database protection. Since the
      text is explicit, dcmitype:Dataset was added here rather than left to the library wide decision
      that covers the ports whose text says nothing about databases.'
    source: review-finding 2/odrl:target
  - action: added
    statement: spdx:licenseId "CC-BY-SA-3.0-AT"
    reason: The record carried cc:legalcode but no dct:source. The legal code page of the port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/at/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
