id: AttributionNoncommercial30Germany
title: Creative Commons Attribution-NonCommercial 3.0 Germany
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 identification details and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc/3.0/de/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc/3.0/de/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database
      right expressly. Section 1 defines the subject matter so that "Soweit Datenbanken oder Zusammenstellungen
      von Daten einen immaterialgueterrechtlichen Schutz eigener Art geniessen, unterfallen auch sie
      dem Begriff Schutzgegenstand im Sinne dieser Lizenz" (databases and compilations of data that
      enjoy sui generis protection are themselves subject matter of this licence), and Section 3 closes
      with the waiver "verzichtet der Lizenzgeber auf saemtliche aus diesem Schutz resultierenden
      Rechte". Section 4 adds that the restrictions do not bite on the parts that are subject matter
      only because of that sui generis protection. Because the legal text names databases as licensed
      subject matter and disposes of the database maker's right in the grant itself, dcmitype:Dataset
      was added here rather than left as a proposal, which is how the same question was decided for
      the Portuguese, Czech and Azerbaijani ports. The ports in this batch whose text has no database
      clause at all, Ecuador and Brazil, keep the proposal.
    source: review-finding 2/odrl:target
  - action: added
    statement: spdx:licenseId "CC-BY-NC-3.0-DE"
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc/3.0/de/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: Section 1 counts a protected
    database as licensed subject matter, "Soweit Datenbanken oder Zusammenstellungen von Daten einen
    immaterialgueterrechtlichen Schutz eigener Art geniessen, unterfallen auch sie dem Begriff Schutzgegenstand
    im Sinne dieser Lizenz", and Section 3 closes with the waiver "verzichtet der Lizenzgeber auf
    saemtliche aus diesem Schutz resultierenden Rechte". dalicc:suiGenerisDatabaseRights is now permitted,
    and it carries no duty because Section 4 adds that the restrictions do not bite on the parts that
    are subject matter only because of that sui generis protection.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
