id: CC-BY-4.0
title: Creative Commons Attribution 4.0 International
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 identification detail and recorded the review state.
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: changed
    statement: foaf:logo <https://licensebuttons.net/l/by/4.0/88x31.png>
    previous: foaf:logo <http://i.creativecommons.org/l/by/4.0/88x31.png>
    reason: The record was the only one of the 343 in the library still pointing at the retired host
      i.creativecommons.org for its licence button, while 291 records use licensebuttons.net. The
      old host redirects to the new one and the image is the same. Updated for family consistency.
    source: review-finding 1/foaf:logo
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: added
    statement: spdx:licenseId "CC-BY-4.0"
    reason: The record carried no SPDX identifier although its own DALICC identifier is the SPDX list
      identifier CC-BY-4.0, whose SPDX seeAlso URL is the cc:legalcode of this record. Added.
    source: review-finding 1/spdx:licenseId
