id: AFL-3.0
title: Academic Free License 3.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 permission and recorded the review state. Later
    changes brought it in line with its family and its text in the verification of 2026-09-15, recorded
    which sentence of the text each statement rests on and named the license the record itself is
    published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Clause 1(c) grants the right "to distribute or communicate copies of the Original Work
      and Derivative Works to the public, under any license of your choice that does not contradict
      the terms and conditions ... in this Academic Free License". That is exactly dalicc:ChangeLicense
      with a dalicc:compliantLicense duty, the pattern Apache-2.0 and the Common Development and Distribution
      License use. Added.
    source: review-finding 3/odrl:permission
  - action: removed
    statement: cc:attributionName "- not specified - "
    reason: 'The review''s finding on family consistency and consolidation decision 4: the record
      prohibited cc:ShareAlike and dalicc:addStatement without support, permitted dalicc:noWarrantyNotice
      although no clause of the AFL grants such a right, kept the limitation of liability inside dalicc:WarrantyDisclaimer
      while section 7, the disclaimer of warranty, was absent, made no patent statement although section
      2 grants one and section 10 ends it on patent litigation, and carried the placeholder ''- not
      specified - ''.'
    source: manual
