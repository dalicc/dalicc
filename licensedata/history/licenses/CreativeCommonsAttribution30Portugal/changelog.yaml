id: CreativeCommonsAttribution30Portugal
title: Creative Commons Attribution 3.0 Portugal
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state. Later changes recorded what the text says about the database right, recorded which
    sentence of the text each statement rests on, recorded when the license ends on a breach, named
    the license the record itself is published under and removed the quotes that do not name the act
    they support.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by/3.0/pt/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by/3.0/pt/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles database rights expressly:
      the last sentence of Section 3 waives the sui generis right, so that where the Licensor holds
      the exclusive rights of Chapter III of Decreto-Lei 122/2000, which implements Directive 96/9/EC
      in Portuguese law, the Licensor "declara expressamente renunciar a esses direitos", and Section
      4(e) adds that the restrictions do not apply to the parts of the Work protected only by that
      database maker''s right. Beyond that, the definition of "Trabalho" in Section 1 names "uma base
      de dados que, pela seleção ou disposição do respetivo conteúdo, constitua uma criação intelectual"
      and "um programa de computador" among the licensed subject matter. Because the legal text names
      databases as licensed subject matter and disposes of the database maker''s right in the grant
      itself, dcmitype:Dataset was added here rather than left as a proposal. The ports in this review
      group whose text has no database clause at all keep the proposal.'
    source: review-finding 2/odrl:target
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The port settles the sui generis database right in its own text: the last sentence of
      Section 3 waives the sui generis right of Chapter III of Decreto-Lei 122/2000, which implements
      Directive 96/9/EC in Portuguese law, where the Licensor "declara expressamente renunciar a esses
      direitos", and the definition of Trabalho in Section 1 names "uma base de dados que, pela seleção
      ou disposição do respetivo conteúdo, constitua uma criação intelectual" among the licensed subject
      matter. dalicc:suiGenerisDatabaseRights is now permitted, and it carries no duty because Section
      4(e) adds that the restrictions do not apply to the parts of the Work protected only by that
      database maker''s right.'
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede ao Utilizador uma licença de âmbito mundial, gratuita, não exclusiva, pelo período de
      duração do direito de autor ou direito conexo aplicável, sujeita aos termos e condições da presente
      LPCC, para o exercício dos seguintes direitos de exploração:"'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede ao Utilizador uma licença de âmbito mundial, gratuita, não exclusiva, pelo período de
      duração do direito de autor ou direito conexo aplicável, sujeita aos termos e condições da presente
      LPCC, para o exercício dos seguintes direitos de exploração:"'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede ao Utilizador uma licença de âmbito mundial, gratuita, não exclusiva, pelo período de
      duração do direito de autor ou direito conexo aplicável, sujeita aos termos e condições da presente
      LPCC, para o exercício dos seguintes direitos de exploração:"'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Utilizador
      não pode sub-licenciar o Trabalho."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "A presente Licença e os direitos concedidos
      pela mesma cessarão automaticamente em caso de qualquer violação dos termos desta Licença pelo
      Utilizador."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
