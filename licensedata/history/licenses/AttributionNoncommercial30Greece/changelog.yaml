id: AttributionNoncommercial30Greece
title: Creative Commons Attribution-NonCommercial 3.0 Greece
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state. Later changes left endorsement to the default rule of the core dependency graph,
    recorded what the text says about the database right, recorded when the license ends on a breach
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc/3.0/gr/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of the port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc/3.0/gr/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-NC-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port names a database as licensed subject
      matter in its own text: clause 3(e), in English rendering, grants the right "to make any use
      of a substantial part of the contents of a database, in the case where the licensed subject
      matter is a database", and clause 3 adds that where the Licensor holds the sui generis right
      of the database maker under Greek copyright law implementing Directive 96/9/EC, the Licensor
      waives that right. Clause 4(e) exempts the parts covered only by the sui generis right from
      the restrictions. Since the text is explicit, dcmitype:Dataset was added here rather than left
      to the library wide decision that covers the ports whose text says nothing about databases.'
    source: review-finding 2/odrl:target
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The port settles the sui generis database right in its own text: clause 3(e), in the
      English rendering the review quotes, grants the right "to make any use of a substantial part
      of the contents of a database, in the case where the licensed subject matter is a database",
      and clause 3 adds that the Licensor waives the sui generis right of the database maker under
      Greek copyright law implementing Directive 96/9/EC. dalicc:suiGenerisDatabaseRights is now permitted,
      and it carries no duty because clause 4(e) exempts the parts covered only by the sui generis
      right from the restrictions.'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Αυτή η Άδεια και τα παρεχόμενα μ’ αυτήν δικαιώματα
      καταγγέλλονται αυτόματα με την παράβαση εκ μέρους Σας των όρων της Άδειας αυτής."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
