id: CreativeCommonsAttributionNoderivs30Luxembourg
title: Creative Commons Attribution-NoDerivatives 3.0 Luxembourg
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state. Later changes recorded what the text says about the database
    right, recorded which sentence of the text each statement rests on, recorded when the license
    ends on a breach, named the license the record itself is published under and removed the quotes
    that do not name the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nd/3.0/lu/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nd/3.0/lu/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database
      right expressly. Section 3 grants "Lorsque l'Oeuvre est une base de donnees, extraire et reutiliser
      des parties substantielles de l'Oeuvre" and closes with "Si le Donneur de Licence est le titulaire
      de droits de base de donnees sui generis suivant la transposition en droit national de la Directive
      Europeenne sur les Bases de Donnees, le Donneur de Licence renonce a ces droits". Section 4(f)
      adds that the restrictions of 4(a) and 4(b) do not apply to the parts of an Oeuvre that fall
      inside the definition only because they are governed by that sui generis right. Because the
      legal text names databases as licensed subject matter and disposes of the database maker's right
      in the grant itself, dcmitype:Dataset was added here rather than left as a proposal, which is
      how the same question was decided for the Portuguese, Czech and Azerbaijani ports. The ports
      in this review group whose text has no database clause at all, Ecuador and Brazil, keep the
      proposal.
    source: review-finding 2/odrl:target
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The port settles the sui generis database right in its own text: Section 3 grants "Lorsque
      l''Oeuvre est une base de donnees, extraire et reutiliser des parties substantielles de l''Oeuvre"
      and closes with "Si le Donneur de Licence est le titulaire de droits de base de donnees sui
      generis suivant la transposition en droit national de la Directive Europeenne sur les Bases
      de Donnees, le Donneur de Licence renonce a ces droits". dalicc:suiGenerisDatabaseRights is
      now permitted, and it carries no duty because Section 4(f) adds that the restrictions of 4(a)
      and 4(b) do not apply to the parts of an Oeuvre that fall inside the definition only because
      they are governed by that sui generis right.'
    source: manual
  - action: changed
    statement: permission dalicc:suiGenerisDatabaseRights
    previous: permission dalicc:suiGenerisDatabaseRights
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Lorsque l''Œuvre
      est une base de données, extraire et réutiliser des parties substantielles de l''Œuvre."'
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Sous réserve
      des conditions de la présente Licence, le Donneur de Licence Vous accorde par les présentes
      une licence mondiale, gratuite, non exclusive et perpétuelle (pour la durée du droit d’auteur
      applicable) aux fins d’exercer les droits suivants sur l’Œuvre :"'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Sous réserve
      des conditions de la présente Licence, le Donneur de Licence Vous accorde par les présentes
      une licence mondiale, gratuite, non exclusive et perpétuelle (pour la durée du droit d’auteur
      applicable) aux fins d’exercer les droits suivants sur l’Œuvre :"'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Sous réserve
      des conditions de la présente Licence, le Donneur de Licence Vous accorde par les présentes
      une licence mondiale, gratuite, non exclusive et perpétuelle (pour la durée du droit d’auteur
      applicable) aux fins d’exercer les droits suivants sur l’Œuvre :"'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "La présente Licence ainsi que les droits
      concédés en vertu des présentes seront automatiquement résiliés en cas de violation de Votre
      part des conditions de la présente Licence."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce: the quoted sentence does not name the act. The statements stay, read from the
      text without a linked quote.'
    source: manual
