id: PhpLicense30
title: PHP License 3.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 clause texts and 1 identification detail and recorded
    the review state. Later changes brought it in line with its family and its text in the verification
    of 2026-09-15, permitted relicensing with the notice as a duty, recorded which sentence of the
    text each statement rests on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: 'dalicc:PromotionSpecification "6. Redistributions of any form whatsoever must retain
      the following acknowledgment: \"This product includes PHP, freely available from <http://www.php.net/>\"."'
    reason: Clause 4, the naming restriction, was not recorded. Added, quoted.
    source: review-finding 6/dalicc:additionalClauses
  - action: added
    statement: dalicc:additionalClauses "4. Products derived from this software may not be called
      \"PHP\", nor may \"PHP\" appear in their name, without prior written permission from group@php.net.
      You may indicate that your software works in conjunction with PHP by saying \"Foo for PHP\"
      instead of calling it \"PHP Foo\" or \"phpfoo\""
    reason: Clause 4, the naming restriction, was not recorded. Added, quoted.
    source: review-finding 6/dalicc:additionalClauses
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: spdx:licenseId "PHP-3.0"
    reason: 'Added PHP-3.0. Verified rather than assumed: cc:legalcode already points at the Open
      Source Initiative page that the SPDX entry lists under seeAlso, dct:alternative is "PHP-3.0",
      and the fetched text is version 3.0.'
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: dalicc:LiabilityLimitation "IN NO EVENT SHALL THE PHP DEVELOPMENT TEAM OR ITS CONTRIBUTORS
      BE LIABLE FOR ANY DIRECT,  INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES  (INCLUDING,
      BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR  SERVICES; LOSS OF USE, DATA, OR PROFITS;
      OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT,
      STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE
      USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE."
    reason: 'The review''s finding on family consistency and consolidation decision 7: the record
      prohibited dalicc:addStatement although clause 6 requires a statement to be retained, and prohibited
      cc:ShareAlike without support. Clause 6 reads ''Redistributions of any form whatsoever must
      retain the following acknowledgment: \"This product includes PHP software, freely available
      from <http://www.php.net/software/>\"'', which is the dalicc:advertisingAcknowledgement duty,
      and clause 5 lets the licensee move to any later version the PHP Group publishes.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "THIS SOFTWARE IS PROVIDED BY THE PHP DEVELOPMENT TEAM ``AS
      IS'' AND  ANY EXPRESSED OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES
      OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED."
    previous: dalicc:WarrantyDisclaimer "THIS SOFTWARE IS PROVIDED BY THE PHP DEVELOPMENT TEAM ``AS
      IS'' AND  ANY EXPRESSED OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES
      OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED.  IN NO EVENT SHALL THE
      PHP DEVELOPMENT TEAM OR ITS CONTRIBUTORS BE LIABLE FOR ANY DIRECT,  INDIRECT, INCIDENTAL, SPECIAL,
      EXEMPLARY, OR CONSEQUENTIAL DAMAGES  (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE
      GOODS OR  SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED
      AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE
      OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY
      OF SUCH DAMAGE."
    reason: 'The review''s finding on family consistency and consolidation decision 7: the record
      prohibited dalicc:addStatement although clause 6 requires a statement to be retained, and prohibited
      cc:ShareAlike without support. Clause 6 reads ''Redistributions of any form whatsoever must
      retain the following acknowledgment: \"This product includes PHP software, freely available
      from <http://www.php.net/software/>\"'', which is the dalicc:advertisingAcknowledgement duty,
      and clause 5 lets the licensee move to any later version the PHP Group publishes.'
    source: manual
  - action: added
    statement: dalicc:orLaterVersionOption "true"^^xsd:boolean
    reason: 'The review''s finding on family consistency and consolidation decision 7: the record
      prohibited dalicc:addStatement although clause 6 requires a statement to be retained, and prohibited
      cc:ShareAlike without support. Clause 6 reads ''Redistributions of any form whatsoever must
      retain the following acknowledgment: \"This product includes PHP software, freely available
      from <http://www.php.net/software/>\"'', which is the dalicc:advertisingAcknowledgement duty,
      and clause 5 lets the licensee move to any later version the PHP Group publishes.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, dalicc:advertisingAcknowledgement]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'The review''s finding on family consistency and consolidation decision 7: the record
      prohibited dalicc:addStatement although clause 6 requires a statement to be retained, and prohibited
      cc:ShareAlike without support. Clause 6 reads ''Redistributions of any form whatsoever must
