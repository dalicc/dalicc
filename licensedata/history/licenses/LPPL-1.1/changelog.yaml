id: LPPL-1.1
title: LaTeX Project Public License, Version 1.1
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 left endorsement to the default rule of the core dependency
    graph, recorded which sentence of the text each statement rests on and named the license the record
    itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, dalicc:modificationNotice, dalicc:originalVersionOffer,
      dalicc:rename]
    previous: permission odrl:derive with duties [cc:Attribution, dalicc:modificationNotice, dalicc:originalVersionOffer,
      dalicc:rename]
    reason: Its duty cc:Attribution quotes "In the modified file, you must acknowledge the authorship
      and name of the original file, and the name (if any) of the program which contains it." Its
      duty dalicc:modificationNotice quotes "You must change any identification string in the file
      to indicate clearly that the modified file is not part of The Program." Its duty dalicc:originalVersionOffer
      quotes "(A) distribute a copy of The Program (that is, a complete, unmodified copy of The Program)
      together with the modified file; if your distribution of the modified file is made by offering
      access to copy the modified file from a designated place, then offering equivalent access to
      copy The Program from the same place meets this condition, even though third parties are not
      compelled to copy The Program along with the modified file;" Its duty dalicc:rename quotes "You
      must not distribute the modified file with the filename of the original file."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice]
    previous: permission odrl:distribute with duties [cc:Notice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may distribute
      a complete, unmodified copy of The Program. Distribution of only part of The Program is not
      allowed."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, dalicc:modificationNotice, dalicc:originalVersionOffer,
      dalicc:rename]
    previous: permission odrl:modify with duties [cc:Attribution, dalicc:modificationNotice, dalicc:originalVersionOffer,
      dalicc:rename]
    reason: Its duty cc:Attribution quotes "In the modified file, you must acknowledge the authorship
      and name of the original file, and the name (if any) of the program which contains it." Its
      duty dalicc:modificationNotice quotes "You must change any identification string in the file
      to indicate clearly that the modified file is not part of The Program." Its duty dalicc:originalVersionOffer
      quotes "(A) distribute a copy of The Program (that is, a complete, unmodified copy of The Program)
      together with the modified file; if your distribution of the modified file is made by offering
      access to copy the modified file from a designated place, then offering equivalent access to
      copy The Program from the same place meets this condition, even though third parties are not
      compelled to copy The Program along with the modified file;" Its duty dalicc:rename quotes "You
      must not distribute the modified file with the filename of the original file."
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may distribute
      a complete, unmodified copy of The Program. Distribution of only part of The Program is not
      allowed."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
