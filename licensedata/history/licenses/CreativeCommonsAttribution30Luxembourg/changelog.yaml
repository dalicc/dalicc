id: CreativeCommonsAttribution30Luxembourg
title: Creative Commons Attribution 3.0 Luxembourg
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by/3.0/lu/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by/3.0/lu/, and the six
      4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database
      right expressly. Section 3 grants "Lorsque l'Oeuvre est une base de donnees, extraire et reutiliser
      des parties substantielles de l'Oeuvre" and closes with "Si le Donneur de Licence est le titulaire
      de droits de base de donnees sui generis suivant la transposition en droit national de la Directive
      Europeenne sur les Bases de Donnees, le Donneur de Licence renonce a ces droits". Section 4(f)
      adds that the restrictions of 4(a) and 4(b) do not apply to the parts of an Oeuvre that fall
      inside the definition only because they are governed by that sui generis right. Because the
      legal text names databases as licensed subject matter and disposes of the database maker's right
      in the grant itself, dcmitype:Dataset was added here rather than left as a proposal, which is
      how the same question was decided for the Portuguese, Czech and Azerbaijani ports. The ports
      in this batch whose text has no database clause at all, Ecuador and Brazil, keep the proposal.
    source: review-finding 2/odrl:target
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: Section 3 grants "Lorsque
    l''Oeuvre est une base de donnees, extraire et reutiliser des parties substantielles de l''Oeuvre"
    and closes with "Si le Donneur de Licence est le titulaire de droits de base de donnees sui generis
    suivant la transposition en droit national de la Directive Europeenne sur les Bases de Donnees,
    le Donneur de Licence renonce a ces droits". dalicc:suiGenerisDatabaseRights is now permitted,
    and it carries no duty because Section 4(f) adds that the restrictions of 4(a) and 4(b) do not
    apply to the parts of an Oeuvre that fall inside the definition only because they are governed
    by that sui generis right.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
