id: EUPL-1.1
title: European Union Public License 1.1
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on,
    named the license the record itself is published under and recorded the licenses a work under
    it may be released under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Its duty dalicc:compliantLicense is marked as a library convention, family rule 13: Reciprocity
      has one shape per kind.'
    source: manual
  - action: changed
    statement: permission dalicc:moralRightsNonAssertion
    previous: permission dalicc:moralRightsNonAssertion
    reason: 'The statement now quotes the sentence of the licence text it rests on: "In the countries
      where moral rights apply, the Licensor waives his right to exercise his moral right to the extent
      allowed by law in order to make effective the licence of the economic rights here above listed."'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: Its duty dalicc:modificationNotice quotes "The Licensee must cause any Derivative Work
      to carry prominent notices stating that the Work has been modified and the date of modification."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: Its duty dalicc:modificationNotice quotes "The Licensee must cause any Derivative Work
      to carry prominent notices stating that the Work has been modified and the date of modification."
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Legal Protection:
      This Licence does not grant permission to use the trade names, trademarks, service marks, or
      names of the Licensor, except as required for reasonable and customary use in describing the
      origin of the Work and reproducing the content of the copyright notice."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:CPL-1.0
    reason: 'Article 5 reads: "If the Licensee Distributes and/or Communicates Derivative Works or
      copies thereof based upon both the Original Work and another work licensed under a Compatible
      Licence, this Distribution and/or Communication can be done under the terms of this Compatible
      Licence." The appendix lists GNU GPL v. 2, OSL v. 2.1 and v. 3.0, Common Public License v. 1.0,
      Eclipse Public License v. 1.0 and CeCILL v. 2.0; the library holds no record of CeCILL 2.0,
      so that one is not linked.'
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:EclipsePublicLicense10
    reason: 'Article 5 reads: "If the Licensee Distributes and/or Communicates Derivative Works or
      copies thereof based upon both the Original Work and another work licensed under a Compatible
      Licence, this Distribution and/or Communication can be done under the terms of this Compatible
      Licence." The appendix lists GNU GPL v. 2, OSL v. 2.1 and v. 3.0, Common Public License v. 1.0,
      Eclipse Public License v. 1.0 and CeCILL v. 2.0; the library holds no record of CeCILL 2.0,
      so that one is not linked.'
    source: manual
