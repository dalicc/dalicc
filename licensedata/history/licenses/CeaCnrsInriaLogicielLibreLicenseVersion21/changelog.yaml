id: CeaCnrsInriaLogicielLibreLicenseVersion21
title: Cea Cnrs Inria Logiciel Libre License, version 2.1
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail, removed 1 prohibition and
    recorded the review state. Later changes brought it in line with its family and its text in the
    verification of 2026-09-15 and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: 'Article 5.3.2 states: "les conditions de distribution du Logiciel Modifie en resultant
      sont alors soumises a l''integralite des dispositions du Contrat" (the modified software must
      be distributed under the whole of this agreement). The record prohibited cc:ShareAlike. Removed.'
    source: review-finding 5/odrl:prohibition
  - action: added
    statement: spdx:licenseId "CECILL-2.1"
    reason: Added CECILL-2.1. The record already carried "CECILL-2.1" as dct:alternative and the Open
      Source Initiative page for that id as dct:source.
    source: review-finding 1/spdx:licenseId
  - action: changed
    statement: cc:attributionName "CEA, CNRS, INRIA"
    previous: cc:attributionName " CEA, CNRS, INRIA"
    reason: 'The review''s finding on family consistency: dalicc:WarrantyDisclaimer held Article 8,
      the liability article, and Article 9, the warranty article, was absent; the record prohibited
      dalicc:promote although CeCILL 2.1 has no trademark clause and prohibited dalicc:addStatement
      although Article 5.3.4 requires a statement; and cc:attributionName and dct:publisher both began
      with a space. Article 9.3 is quoted from the French legal code the record cites, which is the
      version that was retrieved.'
    source: manual
