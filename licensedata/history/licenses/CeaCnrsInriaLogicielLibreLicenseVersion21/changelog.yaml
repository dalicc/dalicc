    statement: 'dalicc:LiabilityLimitation "8.1 Subject to the provisions of Article 8.2, the Licensee
      shall be entitled to claim compensation for any direct loss it may have suffered from the Software
      as a result of a fault on the part of the relevant Licensor, subject to providing evidence thereof.


