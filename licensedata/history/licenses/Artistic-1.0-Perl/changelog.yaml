id: Artistic-1.0-Perl
title: Artistic License 1.0 (Perl)
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice,
      dalicc:rename]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice,
      dalicc:rename]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may otherwise
      modify your copy of this Package in any way, provided that you insert a prominent notice in
      each changed file stating how and when you changed that file, and provided that you do at least
      ONE of the following:"'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice,
      dalicc:rename]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice,
      dalicc:rename]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may otherwise
      modify your copy of this Package in any way, provided that you insert a prominent notice in
      each changed file stating how and when you changed that file, and provided that you do at least
      ONE of the following:"'
    source: manual
  - action: changed
    statement: prohibition dalicc:chargeLicenseFee
    previous: prohibition dalicc:chargeLicenseFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not charge
      a fee for this Package itself."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The name of the
      Copyright Holder may not be used to endorse or promote products derived from this software without
      specific prior written permission."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
