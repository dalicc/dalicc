id: Apple-Sample-Code-License
title: Apple Sample Code License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [dalicc:modificationNotice, dalicc:rename]
    previous: permission odrl:derive with duties [dalicc:modificationNotice, dalicc:rename]
    reason: Its duty dalicc:modificationNotice quotes "If you're going to re-distribute the source,
      we require that you make it clear in the source that the code was descended from Apple sample
      source code, but that you've made changes."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, dalicc:modificationNotice,
      dalicc:rename]
    previous: permission odrl:distribute with duties [cc:Attribution, dalicc:modificationNotice, dalicc:rename]
    reason: Its duty dalicc:modificationNotice quotes "If you're going to re-distribute the source,
      we require that you make it clear in the source that the code was descended from Apple sample
      source code, but that you've made changes."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [dalicc:modificationNotice, dalicc:rename]
    previous: permission odrl:modify with duties [dalicc:modificationNotice, dalicc:rename]
    reason: Its duty dalicc:modificationNotice quotes "If you're going to re-distribute the source,
      we require that you make it clear in the source that the code was descended from Apple sample
      source code, but that you've made changes."
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
