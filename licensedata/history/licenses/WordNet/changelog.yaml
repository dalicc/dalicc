id: WordNet
title: WordNet License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on,
    named the license the record itself is published under and removed the quotes that do not name
    the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "Permission to use, copy, modify and distribute this software
      and database and its documentation for any purpose and without fee or royalty is hereby granted,
      provided that you agree to comply with the following copyright notice and statements, including
      the disclaimer, and that the same appear on ALL copies of the software, database and documentation,
      including modifications that you make for internal use or for distribution."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "Permission to use, copy, modify and distribute this software
      and database and its documentation for any purpose and without fee or royalty is hereby granted,
      provided that you agree to comply with the following copyright notice and statements, including
      the disclaimer, and that the same appear on ALL copies of the software, database and documentation,
      including modifications that you make for internal use or for distribution."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "Permission to use, copy, modify and distribute this software
      and database and its documentation for any purpose and without fee or royalty is hereby granted,
      provided that you agree to comply with the following copyright notice and statements, including
      the disclaimer, and that the same appear on ALL copies of the software, database and documentation,
      including modifications that you make for internal use or for distribution."
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The name of Princeton
      University or Princeton may not be used in advertising or publicity pertaining to distribution
      of the software and/or database."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
