- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Weak-copyleft family alignment of 2026-09-15: sections 2.1 and 2.2 require the Source
    Code of every Modification and of every Covered Code that is deployed to be made available, so
    the source duty belongs on odrl:modify and odrl:derive as well as on odrl:distribute, which is
    where APSL-1.0, APSL-1.1 and APSL-1.2 carry it.'
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:ShareAlike, cc:SourceCode]
    previous: permission odrl:derive with duties [cc:ShareAlike]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:ShareAlike, cc:SourceCode, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:ShareAlike, dalicc:modificationNotice]
    reason: Edited by hand; see the summary of this entry.
    source: manual
