      permitted as it is on the other permissive records.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "Permission to use, copy, modify, and
      distribute this software and its documentation for any purpose and without fee is hereby granted,
      provided that the above copyright notice appear in all copies and that both that copyright notice
      and this permission notice appear in supporting documentation, and that the name of Stichting
      Mathematisch Centrum or CWI not be used in advertising or publicity pertaining to distribution
      of the software without specific, written prior permission." The permission carries the dalicc:compliantLicense
      duty, as Apache-2.0 does, because the notice has to survive the relicensing.'
    source: manual
  - action: changed
    statement: permission cc:DerivativeWorks
    previous: permission cc:DerivativeWorks
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this License Agreement, PSF hereby grants Licensee a nonexclusive, royalty-free,
      world-wide license to reproduce, analyze, test, perform and/or display publicly, prepare derivative
      works, distribute, and otherwise use Python alone or in any derivative version, provided, however,
      that PSF''s License Agreement and PSF''s notice of copyright, i.e., "Copyright (c) 2001, 2002,
      2003, 2004, 2005, 2006 Python Software Foundation; All Rights Reserved" are retained in Python
      alone or in any derivative version prepared by Licensee."'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this License Agreement, PSF hereby grants Licensee a nonexclusive, royalty-free,
      world-wide license to reproduce, analyze, test, perform and/or display publicly, prepare derivative
      works, distribute, and otherwise use Python alone or in any derivative version, provided, however,
      that PSF''s License Agreement and PSF''s notice of copyright, i.e., "Copyright (c) 2001, 2002,
      2003, 2004, 2005, 2006 Python Software Foundation; All Rights Reserved" are retained in Python
      alone or in any derivative version prepared by Licensee."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "This License
      Agreement does not grant permission to use PSF trademarks or trade name in a trademark sense
      to endorse or promote products or services of Licensee, or any third party."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
