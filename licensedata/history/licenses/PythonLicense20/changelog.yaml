- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Family
    rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no source
    code asks only that the notice travels with the copy, which is a duty on the acts it governs and
    not a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission
    here, and the prohibition the earlier pass wrote is removed. The text reads: "Permission to use,
    copy, modify, and distribute this software and its documentation for any purpose and without fee
    is hereby granted, provided that the above copyright notice appear in all copies and that both
    that copyright notice and this permission notice appear in supporting documentation, and that
    the name of Stichting Mathematisch Centrum or CWI not be used in advertising or publicity pertaining
    to distribution of the software without specific, written prior permission." The permission carries
    the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the relicensing.'
  changes:
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Edited by hand; see the summary of this entry.
    source: manual
