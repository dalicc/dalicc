      Removed both and added the permissions with the duties of clauses 2 and 3.
    source: review-finding 3/odrl:prohibition
  - action: added
    statement: spdx:licenseId "Python-2.0"
    reason: Added Python-2.0 and the missing dct:source.
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: 'The review''s finding on family consistency: the record prohibited odrl:grantUse, cc:ShareAlike,
      dalicc:addLimitation, dalicc:addStatement and dalicc:chargeDistributionFee, none of which the
      PSF License Agreement version 2 states. Clause 2 grants the right ''to reproduce, analyze, test,
      perform and/or display publicly, prepare derivative works, distribute, and otherwise use Python
      alone or in any derivative version'' and says nothing about fees, so the distribution fee is
      permitted as it is on the other permissive records.'
    source: manual
