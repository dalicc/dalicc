- version: 3
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Batch 3 finding 5: the record prohibited odrl:grantUse, cc:ShareAlike, dalicc:addLimitation,
    dalicc:addStatement and dalicc:chargeDistributionFee, none of which the PSF License Agreement
    version 2 states. Clause 2 grants the right ''to reproduce, analyze, test, perform and/or display
    publicly, prepare derivative works, distribute, and otherwise use Python alone or in any derivative
    version'' and says nothing about fees, so the distribution fee is permitted as it is on the other
    permissive records.'
  changes:
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: prohibition cc:ShareAlike
