      Removed both and added the permissions with the duties of clauses 2 and 3.
    source: review-finding 3/odrl:prohibition
  - action: removed
    statement: prohibition odrl:derive
    reason: Clause 2 grants "a nonexclusive, royalty-free, world-wide license to reproduce, analyze,
