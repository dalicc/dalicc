id: BSL-1.0
title: Boost Software License 1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 permission, removed 1 permission and 1 prohibition
    and recorded the review state. Later changes brought it in line with its family and its text in
    the verification of 2026-09-15, permitted relicensing with the notice as a duty, left endorsement
    to the default rule of the core dependency graph, recorded which sentence of the text each statement
    rests on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: removed
    statement: permission cc:ShareAlike with duties [cc:Notice]
    reason: 'cc:ShareAlike was modelled as a permission carrying a cc:Notice duty. cc:ShareAlike is
      a duty term: as a permission it means nothing the general grant does not already say, and the
      dependency graph treats an asserted share-alike as contradicting odrl:grantUse, which is why
      the record had to prohibit sublicensing to stay consistent. The Boost license imposes no share-alike.
      Removed. Flagged by the family conventions checked before the review.'
    source: review-finding 5/odrl:permission
  - action: added
    statement: permission odrl:grantUse
    reason: 'cc:ShareAlike was modelled as a permission carrying a cc:Notice duty. cc:ShareAlike is
      a duty term: as a permission it means nothing the general grant does not already say, and the
      dependency graph treats an asserted share-alike as contradicting odrl:grantUse, which is why
      the record had to prohibit sublicensing to stay consistent. The Boost license imposes no share-alike.
      Removed. Flagged by the family conventions checked before the review.'
    source: review-finding 5/odrl:permission
  - action: removed
    statement: prohibition odrl:grantUse
    reason: The grant runs "to use, reproduce, display, distribute, execute, and transmit the Software,
      and to prepare derivative works of the Software, and to permit third-parties to whom the Software
      is furnished to do so". The record prohibited odrl:grantUse, the exact opposite. Removed the
      prohibition and added the permission.
    source: review-finding 3/odrl:prohibition
  - action: removed
    statement: cc:attributionName "- not specified - "
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE COPYRIGHT HOLDERS OR ANYONE DISTRIBUTING THE SOFTWARE BE
      LIABLE'', and dct:publisher and cc:attributionName were the placeholder ''- not specified -
      ''.'
    source: manual
  - action: added
    statement: dalicc:LiabilityLimitation "IN NO EVENT SHALL THE COPYRIGHT HOLDERS OR ANYONE DISTRIBUTING
      THE SOFTWARE BE LIABLE FOR ANY DAMAGES OR OTHER LIABILITY, WHETHER IN CONTRACT, TORT OR OTHERWISE,
      ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE."
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE COPYRIGHT HOLDERS OR ANYONE DISTRIBUTING THE SOFTWARE BE
      LIABLE'', and dct:publisher and cc:attributionName were the placeholder ''- not specified -
      ''.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF
      ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE, TITLE AND NON-INFRINGEMENT."
    previous: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY
      KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS
      FOR A PARTICULAR PURPOSE, TITLE AND NON-INFRINGEMENT. IN NO EVENT SHALL THE COPYRIGHT HOLDERS
      OR ANYONE DISTRIBUTING THE SOFTWARE BE LIABLE FOR ANY DAMAGES OR OTHER LIABILITY, WHETHER IN
      CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE
      USE OR OTHER DEALINGS IN THE SOFTWARE."
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE COPYRIGHT HOLDERS OR ANYONE DISTRIBUTING THE SOFTWARE BE
      LIABLE'', and dct:publisher and cc:attributionName were the placeholder ''- not specified -
      ''.'
    source: manual
  - action: removed
    statement: dct:publisher "- not specified - "
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE COPYRIGHT HOLDERS OR ANYONE DISTRIBUTING THE SOFTWARE BE
      LIABLE'', and dct:publisher and cc:attributionName were the placeholder ''- not specified -
      ''.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "Permission is hereby granted, free of
      charge, to any person or organization obtaining a copy of the software ... to use, reproduce,
      display, distribute, execute, and transmit the Software, and to prepare derivative works of
      the Software, and to permit third-parties to whom the Software is furnished to do so, all subject
      to the following: The copyright notices in the Software and this entire statement ... must be
      included in all copies of the Software." The permission carries the dalicc:compliantLicense
      duty, as Apache-2.0 does, because the notice has to survive the relicensing.'
    source: manual
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
