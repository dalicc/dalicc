id: CreativeCommonsAttributionSharealike30Italy
title: Creative Commons Attribution-ShareAlike 3.0 Italy
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 clause text, 4 alternative titles and 1 asset target, recorded the relation to the record this
    one was adapted from and recorded the review state.
  changes:
  - action: changed
    statement: 'dalicc:WarrantyDisclaimer "SALVO CHE SIA ESPRESSAMENTE CONVENUTO ALTRIMENTI PER ISCRITTO
      FRA LE PARTI, IL LICENZIANTE OFFRE L''OPERA IN LICENZA \"COSÌ COM''È\" E NON FORNISCE ALCUNA
      DICHIARAZIONE O GARANZIA DI QUALSIASI TIPO CON RIGUARDO ALL''OPERA, SIA ESSA ESPRESSA O IMPLICITA,
      DI FONTE LEGALE O DI ALTRO TIPO, ESSENDO QUINDI ESCLUSE, FRA LE ALTRE, LE GARANZIE RELATIVE
      AL TITOLO, ALLA COMMERCIABILITÀ, ALL''IDONEITÀ PER UN FINE SPECIFICO E ALLA NON VIOLAZIONE DI
      DIRITTI DI TERZI O ALLA MANCANZA DI DIFETTI LATENTI O DI ALTRO TIPO, ALL''ESATTEZZA O ALLA PRESENZA
      DI ERRORI, SIANO ESSI ACCERTABILI O MENO. ALCUNE GIURISDIZIONI NON CONSENTONO L''ESCLUSIONE
      DI GARANZIE IMPLICITE E QUINDI TALE ESCLUSIONE PUÒ NON APPLICARSI A TE.

      "'
    previous: 'dalicc:WarrantyDisclaimer "SALVO CHE SIA ESPRESSAMENTE CONVENUTO ALTRIMENTI PER ISCRITTO
      FRA LE PARTI, IL LICENZIANTE OFFRE L''OPERA IN LICENZA \"COSÌ COMÈ\" E NON FORNISCE ALCUNA DICHIARAZIONE
      O GARANZIA DI QUALSIASI TIPO CON RIGUARDO ALL''OPERA, SIA ESSA ESPRESSA O IMPLICITA, DI FONTE
      LEGALE O DI ALTRO TIPO, ESSENDO QUINDI ESCLUSE, FRA LE ALTRE, LE GARANZIE RELATIVE AL TITOLO,
      ALLA COMMERCIABILITÀ, ALL''IDONEITÀ PER UN FINE SPECIFICO E ALLA NON VIOLAZIONE DI DIRITTI DI
      TERZI O ALLA MANCANZA DI DIFETTI LATENTI O DI ALTRO TIPO, ALL''ESATTEZZA O ALLA PRESENZA DI
      ERRORI, SIANO ESSI ACCERTABILI O MENO. ALCUNE GIURISDIZIONI NON CONSENTONO L''ESCLUSIONE DI
      GARANZIE IMPLICITE E QUINDI TALE ESCLUSIONE PUÒ NON APPLICARSI A TE.

      "'
    reason: 'dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation are quoted from the Italian
      text of this port and not from the English unported version, and each field holds its own clause
      rather than a copy of the other. Article 5, Dichiarazioni, Garanzie ed Esonero da responsabilita,
      is the warranty disclaimer and article 6, Limitazione di Responsabilita, the limitation, both
      in capitals. The Italian limitation ends with a sentence the unported text does not have: "NESSUNA
      CLAUSOLA DI QUESTA LICENZA ESCLUDE O LIMITA LA RESPONSABILITA NEL CASO IN CUI QUESTA DIPENDA
      DA DOLO O COLPA GRAVE." Each field holds its own article. One transcription defect was corrected:
      the disclaimer field read "COSI COME" where the legal code reads "COSI COM''E", a dropped apostrophe
      inside the quoted text. All six Italian records carried it.'
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 IT"
    previous: dct:alternative "CC BY SA 3.0 it"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 IT"
    previous: dct:alternative "CC BY-SA 3.0 it"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 IT"
    previous: dct:alternative "CC-BY-SA 3.0 it"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 IT"
    previous: dct:alternative "Creative Commons BY-SA 3.0 it"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/it/>
    reason: The record carried cc:legalcode but no dct:source. The legal-code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/it/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in terms.
      The definition of Opera in article 1 is explicit: "l''opera dell''ingegno o, comunque, qualsiasi
      bene o prestazione suscettibile di protezione in forza delle leggi sul diritto d''autore (diritto
      d''autore, diritti connessi, diritto sui generis sulle banche dati, ecc.)". Article 3 adds that
      where the licensed Opera includes databases over which the licensor holds a sui generis right
      under the national law implementing Directive 96/9/CE, the licensor waives it, and article 4(e)
      carves the restrictions out of the parts that qualify only under that right. Since the text
      is explicit, dcmitype:Dataset was added, which also brings the record into line with its parent.'
    source: review-finding 2/odrl:target
