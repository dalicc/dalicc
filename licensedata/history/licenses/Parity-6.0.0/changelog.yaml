id: Parity-6.0.0
title: The Parity Public License 6.0.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: prohibition dalicc:patentRetaliationTermination
    previous: prohibition dalicc:patentRetaliationTermination
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Do not make any
      legal claim against anyone accusing this software, with or without changes, alone or with other
      software, of infringing any patent claim."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
