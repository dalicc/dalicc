id: BlueOak-1.0.0
title: Blue Oak Model License 1.0.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission dalicc:patentGrant
    previous: permission dalicc:patentGrant
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Each contributor
      licenses you to do everything with this software that would otherwise infringe any patent claims
      they can license or become able to license."'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Notice]
    previous: permission odrl:derive with duties [cc:Notice]
    reason: Its duty cc:Notice quotes "You must ensure that everyone who gets a copy of any part of
      this software from you, with or without changes, also gets the text of this license or a link
      to <https://blueoakcouncil.org/license/1.0.0>."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice]
    previous: permission odrl:distribute with duties [cc:Notice]
    reason: Its duty cc:Notice quotes "You must ensure that everyone who gets a copy of any part of
      this software from you, with or without changes, also gets the text of this license or a link
      to <https://blueoakcouncil.org/license/1.0.0>."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Notice]
    previous: permission odrl:modify with duties [cc:Notice]
    reason: Its duty cc:Notice quotes "You must ensure that everyone who gets a copy of any part of
      this software from you, with or without changes, also gets the text of this license or a link
      to <https://blueoakcouncil.org/license/1.0.0>."
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
