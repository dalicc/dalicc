id: EPL-2.0
title: Eclipse Public License 2.0
current_version: 4
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 clause texts, 1 identification detail and 2 permissions,
    changed 3 permissions, recorded the relation to the record this one was adapted from and recorded
    the review state.
  changes:
  - action: added
    statement: dalicc:LiabilityLimitation "EXCEPT AS EXPRESSLY SET FORTH IN THIS AGREEMENT, AND TO
      THE EXTENT PERMITTED BY APPLICABLE LAW, NEITHER RECIPIENT NOR ANY CONTRIBUTORS SHALL HAVE ANY
      LIABILITY FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES
      (INCLUDING WITHOUT LIMITATION LOST PROFITS), HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY,
      WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN
      ANY WAY OUT OF THE USE OR DISTRIBUTION OF THE PROGRAM OR THE EXERCISE OF ANY RIGHTS GRANTED
      HEREUNDER, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGES."
    reason: Sections 5 and 6 were not recorded. Added both, quoted.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:WarrantyDisclaimer "EXCEPT AS EXPRESSLY SET FORTH IN THIS AGREEMENT, AND TO
      THE EXTENT PERMITTED BY APPLICABLE LAW, THE PROGRAM IS PROVIDED ON AN “AS IS” BASIS, WITHOUT
      WARRANTIES OR CONDITIONS OF ANY KIND, EITHER EXPRESS OR IMPLIED INCLUDING, WITHOUT LIMITATION,
      ANY WARRANTIES OR CONDITIONS OF TITLE, NON-INFRINGEMENT, MERCHANTABILITY OR FITNESS FOR A PARTICULAR
      PURPOSE. Each Recipient is solely responsible for determining the appropriateness of using and
      distributing the Program and assumes all risks associated with its exercise of rights under
      this Agreement, including but not limited to the risks and costs of program errors, compliance
      with applicable laws, damage to or loss of data, programs or equipment, and unavailability or
      interruption of operations."
    reason: Sections 5 and 6 were not recorded. Added both, quoted.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: permission cc:CommercialUse
    reason: Section 4 is headed COMMERCIAL DISTRIBUTION and opens "Commercial distributors of software
      may accept certain responsibilities with respect to end users, business partners and the like",
      and the section 2 grant is royalty-free with no field-of-use limit. The record did not permit
      cc:CommercialUse, so the license read as non-commercial. Added.
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Section 3.1(a) states: "the Program must also be made available as Source Code, in accordance
      with section 3.2, and the Contributor must accompany the Program with a statement that the Source
      Code for the Program is available under this Agreement". No cc:SourceCode duty was recorded.
      Added to distribute, modify and derive.'
    source: review-finding 5/odrl:duty
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Section 3.1(a) states: "the Program must also be made available as Source Code, in accordance
      with section 3.2, and the Contributor must accompany the Program with a statement that the Source
      Code for the Program is available under this Agreement". No cc:SourceCode duty was recorded.
      Added to distribute, modify and derive.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission odrl:grantUse
    reason: Section 2(a) grants the right to "reproduce, prepare Derivative Works of, publicly display,
      publicly perform, Distribute and sublicense the Contribution". Added odrl:grantUse.
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Section 3.1(a) states: "the Program must also be made available as Source Code, in accordance
      with section 3.2, and the Contributor must accompany the Program with a statement that the Source
      Code for the Program is available under this Agreement". No cc:SourceCode duty was recorded.
      Added to distribute, modify and derive.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: spdx:licenseId "EPL-2.0"
    reason: The record id is the SPDX list id but the field was absent.
    source: review-finding 1/spdx:licenseId
- version: 3
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Batch 4 finding 6.2 and consolidation decision 4: the record carried no prohibition although
    section 7 says ''If Recipient institutes patent litigation against any entity ... alleging that
    the Program itself ... infringes such Recipient''s patent(s), then such Recipient''s rights granted
    under Section 2(b) shall terminate'', it modelled no reciprocity although section 3.1 requires
    the Program in source form to be ''made available under this Agreement'', its dalicc:additionalClauses
    began with the paraphrase ''Compliant License according to 1. DEFINITIONS:'' instead of the quotation,
    and dct:publisher was ''N.N.''.'
  changes:
  - action: changed
    statement: dalicc:additionalClauses "“Secondary License” means either the GNU General Public License,
      Version 2.0, or any later versions of that license, including any exceptions or additional permissions
      as identified by the initial Contributor."
    previous: 'dalicc:additionalClauses "Compliant License according to 1. DEFINITIONS: “Secondary
      License” means either the GNU General Public License, Version 2.0, or any later versions of
      that license, including any exceptions or additional permissions as identified by the initial
      Contributor."'
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: dct:publisher "Eclipse Foundation"
    previous: dct:publisher "N.N."
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:patentGrant
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode,
      dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode,
      dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode, dalicc:modificationNotice]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: prohibition dalicc:patentRetaliationTermination
    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Weak-copyleft family alignment of 2026-09-15: section 2(a) grants the right to ''reproduce,
    prepare Derivative Works of, publicly display, publicly perform, Distribute and sublicense the
    Contribution'', which the family''s text-modelled records (CPL-1.0, IPL-1.0) write as dalicc:sublicense;
    the record used the older spelling odrl:grantUse, which the dependency graph relates to it with
    owl:sameAs, so the family now states the act once and in the same way. Section 3.2 lets a distributor
    ''Distribute the Program under a license different than this Agreement'', under which a fee may
    be charged, which is the licence-fee permission its three siblings carry.'
  changes:
  - action: added
    statement: permission dalicc:chargeLicenseFee
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:sublicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: permission odrl:grantUse
    reason: Edited by hand; see the summary of this entry.
    source: manual
