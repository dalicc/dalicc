  - action: added
    statement: permission cc:CommercialUse
    reason: 'Clause 1 states: "You are permitted to use the Standard Version and create and use Modified
      Versions for any purpose without restriction", and clause 2 allows distribution "either gratis
      or for a Distributor Fee". The record prohibited cc:CommercialUse. Removed it, added the permission,
      and added the prohibition the text actually states, clause 7: "provided that you do not charge
      a licensing fee for the Package".'
    source: review-finding 4/odrl:prohibition
  - action: removed
    statement: prohibition cc:CommercialUse
    reason: 'Clause 1 states: "You are permitted to use the Standard Version and create and use Modified
      Versions for any purpose without restriction", and clause 2 allows distribution "either gratis
      or for a Distributor Fee". The record prohibited cc:CommercialUse. Removed it, added the permission,
      and added the prohibition the text actually states, clause 7: "provided that you do not charge
      a licensing fee for the Package".'
    source: review-finding 4/odrl:prohibition
