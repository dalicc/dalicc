id: CreativeCommonsAttributionNoncommercialNoderivs30Poland
title: Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 Poland
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-nd/3.0/pl/>
    reason: The record carried cc:legalcode but no dct:source. The legal-code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/pl/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-NC-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights expressly.
      Paragraph 3 lists "Pobieranie danych z Utworu oraz ich wtorne wykorzystanie" (extraction of
      data from the work and its re-utilisation) as one of the fields of exploitation granted, and
      the paragraph closes with the licensor waiving the sui generis right under the law implementing
      Directive 96/9/EC of 11 March 1996: "Licencjodawca zrzeka sie tego prawa", with an undertaking
      not to exercise it where the waiver is ineffective. Paragraph 4(e) adds that the restrictions
      in 4(a) to 4(d) do not apply to a work, or a part of one, that is a work under this licence
      only because it is a database that is not itself an authored work. Because the grant of the
      database right is explicit in the text, dcmitype:Dataset was added rather than proposed.'
    source: review-finding 2/odrl:target
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: Paragraph 3 lists "Pobieranie
    danych z Utworu oraz ich wtorne wykorzystanie" among the fields of exploitation granted and closes
    with the licensor waiving the sui generis right under the law implementing Directive 96/9/EC,
    "Licencjodawca zrzeka sie tego prawa". dalicc:suiGenerisDatabaseRights is now permitted, and it
    carries no duty because Paragraph 4(e) adds that the restrictions in 4(a) to 4(d) do not apply
    to a work, or a part of one, that is a work under this licence only because it is a database that
    is not itself an authored work.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
