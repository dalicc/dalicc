id: CreativeCommonsAttributionNoncommercialSharealike20Chile
title: Creative Commons Attribution-NonCommercial-ShareAlike 2.0 Chile
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, recorded
    the relation to the record this one was adapted from and recorded the review state. Later changes
    left endorsement to the default rule of the core dependency graph, recorded which sentence of
    the text each statement rests on, recorded when the license ends on a breach and named the license
    the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "2.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-sa/2.0/cl/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc-sa/2.0/cl/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: duty cc:ShareAlike
    previous: duty cc:ShareAlike
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Usted puede distribuir,
      exhibir públicamente, ejecutar públicamente, o poner a disposición pública una Obra Derivada
      sólo de acuerdo con las condiciones de esta Licencia, una versión posterior de la licencia o
      una Licencia iCommons de Creative Commons que contenga los mismos Elementos de la Licencia."'
    source: manual
  - action: changed
    statement: permission dalicc:ModifiedWorks
    previous: permission dalicc:ModifiedWorks
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Los derechos
      antes mencionados incluyen el derecho a realizar dichas modificaciones en la medida que sean
      técnicamente necesarias para ejercer los derechos en otro medio o formatos."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Los derechos
      antes mencionados incluyen el derecho a realizar dichas modificaciones en la medida que sean
      técnicamente necesarias para ejercer los derechos en otro medio o formatos."'
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "No es posible
      ofrecer o imponer ninguna condición sobre la Obra que altere o limite las condiciones de esta
      Licencia o el ejercicio de los derechos de los destinatarios otorgados en este documento."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "No es posible
      sublicenciar la Obra."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Esta Licencia y los derechos otorgados en
      virtud de ella terminarán automáticamente si Usted infringe alguna condición establecida en
      ella."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
