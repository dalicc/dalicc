id: Unicode-3.0
title: Unicode License v3
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on,
    named the license the record itself is published under and removed the quotes that do not name
    the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "Permission is hereby granted, free of charge, to any person
      obtaining a copy of data files and any associated documentation (the "Data Files") or software
      and any associated documentation (the "Software") to deal in the Data Files or Software without
      restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute,
      and/or sell copies of the Data Files or Software, and to permit persons to whom the Data Files
      or Software are furnished to do so, provided that either (a) this copyright and permission notice
      appear with all copies of the Data Files or Software, or (b) this copyright and permission notice
      appear in associated Documentation." Its duty cc:Notice quotes "Permission is hereby granted,
      free of charge, to any person obtaining a copy of data files and any associated documentation
      (the "Data Files") or software and any associated documentation (the "Software") to deal in
      the Data Files or Software without restriction, including without limitation the rights to use,
      copy, modify, merge, publish, distribute, and/or sell copies of the Data Files or Software,
      and to permit persons to whom the Data Files or Software are furnished to do so, provided that
      either (a) this copyright and permission notice appear with all copies of the Data Files or
      Software, or (b) this copyright and permission notice appear in associated Documentation."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Permission is
      hereby granted, free of charge, to any person obtaining a copy of data files and any associated
      documentation (the "Data Files") or software and any associated documentation (the "Software")
      to deal in the Data Files or Software without restriction, including without limitation the
      rights to use, copy, modify, merge, publish, distribute, and/or sell copies of the Data Files
      or Software, and to permit persons to whom the Data Files or Software are furnished to do so,
      provided that either (a) this copyright and permission notice appear with all copies of the
      Data Files or Software, or (b) this copyright and permission notice appear in associated Documentation."
      Its duty cc:Attribution quotes "Permission is hereby granted, free of charge, to any person
      obtaining a copy of data files and any associated documentation (the "Data Files") or software
      and any associated documentation (the "Software") to deal in the Data Files or Software without
      restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute,
      and/or sell copies of the Data Files or Software, and to permit persons to whom the Data Files
      or Software are furnished to do so, provided that either (a) this copyright and permission notice
      appear with all copies of the Data Files or Software, or (b) this copyright and permission notice
      appear in associated Documentation." Its duty cc:Notice quotes "Permission is hereby granted,
      free of charge, to any person obtaining a copy of data files and any associated documentation
      (the "Data Files") or software and any associated documentation (the "Software") to deal in
      the Data Files or Software without restriction, including without limitation the rights to use,
      copy, modify, merge, publish, distribute, and/or sell copies of the Data Files or Software,
      and to permit persons to whom the Data Files or Software are furnished to do so, provided that
      either (a) this copyright and permission notice appear with all copies of the Data Files or
      Software, or (b) this copyright and permission notice appear in associated Documentation."'
    source: manual
  - action: changed
    statement: permission odrl:grantUse
    previous: permission odrl:grantUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Permission is
      hereby granted, free of charge, to any person obtaining a copy of data files ... to deal in
      the Data Files or Software without restriction, including without limitation the rights to use,
      copy, modify, merge, publish, distribute, and/or sell copies of the Data Files or Software,
      and to permit persons to whom the Data Files or Software are furnished to do so"'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Attribution quotes "Permission is hereby granted, free of charge, to any person
      obtaining a copy of data files and any associated documentation (the "Data Files") or software
      and any associated documentation (the "Software") to deal in the Data Files or Software without
      restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute,
      and/or sell copies of the Data Files or Software, and to permit persons to whom the Data Files
      or Software are furnished to do so, provided that either (a) this copyright and permission notice
      appear with all copies of the Data Files or Software, or (b) this copyright and permission notice
      appear in associated Documentation." Its duty cc:Notice quotes "Permission is hereby granted,
      free of charge, to any person obtaining a copy of data files and any associated documentation
      (the "Data Files") or software and any associated documentation (the "Software") to deal in
      the Data Files or Software without restriction, including without limitation the rights to use,
      copy, modify, merge, publish, distribute, and/or sell copies of the Data Files or Software,
      and to permit persons to whom the Data Files or Software are furnished to do so, provided that
      either (a) this copyright and permission notice appear with all copies of the Data Files or
      Software, or (b) this copyright and permission notice appear in associated Documentation."
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Except as contained
      in this notice, the name of a copyright holder shall not be used in advertising or otherwise
      to promote the sale, use or other dealings in these Data Files or Software without prior written
      authorization of the copyright holder."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of duty cc:Attribution on odrl:derive, duty cc:Attribution
      on odrl:distribute, duty cc:Attribution on odrl:modify: the quoted sentence does not name the
      act. The statements stay, read from the text without a linked quote.'
    source: manual
