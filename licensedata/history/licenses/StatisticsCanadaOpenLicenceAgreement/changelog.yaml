  - action: added
    statement: permission cc:DerivativeWorks
    reason: 'odrl:derive and odrl:modify were modelled as prohibitions, which contradicts the grant.
      The Licence Grant section reads: "Statistics Canada grants you a worldwide, royalty-free, non-exclusive
      licence to: use, reproduce, publish, freely distribute, or sell the Information; use, reproduce,
      publish, freely distribute, or sell Value-added Products; and, sublicence any or all such rights,
      under terms consistent with this licence", and Value-added Products are defined as "any products
      you have produced by adapting or incorporating the Information, in whole or in part, in accordance
      with this licence". The two prohibitions were removed and the corresponding permissions added,
      together with cc:DerivativeWorks and dalicc:ModifiedWorks, since publishing, distributing and
      selling Value-added Products is expressly granted.'
    source: review-finding 3/odrl:permission
