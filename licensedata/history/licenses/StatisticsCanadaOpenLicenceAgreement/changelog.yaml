id: StatisticsCanadaOpenLicenceAgreement
title: Statistics Canada Open Licence Agreement
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 clause texts and 4 permissions, removed 2 prohibitions,
    changed 2 identification details and recorded the review state. Later changes permitted relicensing
    with the notice as a duty, recorded which sentence of the text each statement rests on and named
    the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: changed
    statement: cc:legalcode <https://www.statcan.gc.ca/en/terms-conditions/open-licence>
    previous: cc:legalcode <https://www.statcan.gc.ca/eng/reference/licence>
    reason: cc:legalcode and dct:source pointed at https://www.statcan.gc.ca/eng/reference/licence,
      which still redirects but is no longer the published address. Both now point at https://www.statcan.gc.ca/en/terms-conditions/open-licence,
      the page the redirect ends at and the one this review was read from.
    source: review-finding 1/cc:legalcode
  - action: added
    statement: dalicc:LiabilityLimitation "Statistics Canada or any of its Ministers, officials, servants,
      employees, agents, successors and assigns shall not be liable for any errors or omissions in
      the Information and shall not, under any circumstances, be liable for any direct, indirect,
      special, incidental, consequential, or other loss, injury or damage, however caused, that you
      may suffer at any time by reason of your possession, access to or use of the Information or
      arising out of the exercise of your rights or the fulfilment of your obligations under this
      licence."
    reason: The record carried no clause text at all, although the licence has a section headed No
      Warranty and no Liability with one paragraph of each. Both were added, quoted verbatim.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:WarrantyDisclaimer "The Information is licensed 'as is', and Statistics Canada
      makes no representations or warranties whatsoever with respect to the Information, whether express
      or implied, in relation to the Information and expressly disclaims any implied warranty of merchantability
      or fitness for a particular purpose of the Information."
    reason: The record carried no clause text at all, although the licence has a section headed No
      Warranty and no Liability with one paragraph of each. Both were added, quoted verbatim.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: changed
    statement: dct:source <https://www.statcan.gc.ca/en/terms-conditions/open-licence>
    previous: dct:source <https://www.statcan.gc.ca/eng/reference/licence>
    reason: cc:legalcode and dct:source pointed at https://www.statcan.gc.ca/eng/reference/licence,
      which still redirects but is no longer the published address. Both now point at https://www.statcan.gc.ca/en/terms-conditions/open-licence,
      the page the redirect ends at and the one this review was read from.
    source: review-finding 1/cc:legalcode
  - action: added
    statement: permission cc:DerivativeWorks
    reason: 'odrl:derive and odrl:modify were modelled as prohibitions, which contradicts the grant.
      The Licence Grant section reads: "Statistics Canada grants you a worldwide, royalty-free, non-exclusive
      licence to: use, reproduce, publish, freely distribute, or sell the Information; use, reproduce,
      publish, freely distribute, or sell Value-added Products; and, sublicence any or all such rights,
      under terms consistent with this licence", and Value-added Products are defined as "any products
      you have produced by adapting or incorporating the Information, in whole or in part, in accordance
      with this licence". The two prohibitions were removed and the corresponding permissions added,
      together with cc:DerivativeWorks and dalicc:ModifiedWorks, since publishing, distributing and
      selling Value-added Products is expressly granted.'
    source: review-finding 3/odrl:permission
  - action: added
    statement: permission dalicc:ModifiedWorks
    reason: 'odrl:derive and odrl:modify were modelled as prohibitions, which contradicts the grant.
