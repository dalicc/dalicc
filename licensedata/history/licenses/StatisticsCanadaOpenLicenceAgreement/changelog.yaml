  summary: The content review of 2026-09-15 added 2 clause texts and 4 permissions, removed 2 prohibitions,
    changed 2 identification details and recorded the review state.
  changes:
  - action: changed
    statement: cc:legalcode <https://www.statcan.gc.ca/en/terms-conditions/open-licence>
    previous: cc:legalcode <https://www.statcan.gc.ca/eng/reference/licence>
    reason: cc:legalcode and dct:source pointed at https://www.statcan.gc.ca/eng/reference/licence,
      which still redirects but is no longer the published address. Both now point at https://www.statcan.gc.ca/en/terms-conditions/open-licence,
      the page the redirect ends at and the one this review was read from.
    source: review-finding 1/cc:legalcode
  - action: added
    statement: dalicc:LiabilityLimitation "Statistics Canada or any of its Ministers, officials, servants,
      employees, agents, successors and assigns shall not be liable for any errors or omissions in
      the Information and shall not, under any circumstances, be liable for any direct, indirect,
      special, incidental, consequential, or other loss, injury or damage, however caused, that you
      may suffer at any time by reason of your possession, access to or use of the Information or
      arising out of the exercise of your rights or the fulfilment of your obligations under this
      licence."
    reason: The record carried no clause text at all, although the licence has a section headed No
      Warranty and no Liability with one paragraph of each. Both were added, quoted verbatim.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:WarrantyDisclaimer "The Information is licensed 'as is', and Statistics Canada
      makes no representations or warranties whatsoever with respect to the Information, whether express
      or implied, in relation to the Information and expressly disclaims any implied warranty of merchantability
      or fitness for a particular purpose of the Information."
    reason: The record carried no clause text at all, although the licence has a section headed No
