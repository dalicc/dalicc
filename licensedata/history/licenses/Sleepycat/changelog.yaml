id: Sleepycat
title: Sleepycat License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    reason: Its duty cc:SourceCode quotes "- Redistributions in any form must be accompanied by information
      on how to obtain complete source code for the DB software and any accompanying software that
      uses the DB software."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    reason: Its duty cc:SourceCode quotes "- Redistributions in any form must be accompanied by information
      on how to obtain complete source code for the DB software and any accompanying software that
      uses the DB software."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:SourceCode]
    reason: Its duty cc:SourceCode quotes "- Redistributions in any form must be accompanied by information
      on how to obtain complete source code for the DB software and any accompanying software that
      uses the DB software."
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "- Neither the
      name of the University nor the names of its contributors may be used to endorse or promote products
      derived from this software without specific prior written permission."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
