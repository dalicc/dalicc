id: TheUniversalPermissiveLicenseUplVersion10
title: The Universal Permissive License (UPL), Version 1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail, removed 1 prohibition and
    recorded the review state. Later changes brought it in line with its family and its text in the
    verification of 2026-09-15, permitted relicensing with the notice as a duty, left endorsement
    to the default rule of the core dependency graph, recorded which sentence of the text each statement
    rests on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: The grant ends "and to sublicense the foregoing rights on either these or other terms",
      so relicensing under this same license is expressly allowed. Prohibiting cc:ShareAlike asserted
      the opposite. cc:ShareAlike is a duty term and a permissive license that is silent about reciprocity
      must carry no share-alike statement at all. Removed. Flagged by the family conventions checked
      before the review.
    source: review-finding 5/odrl:prohibition
  - action: added
    statement: spdx:licenseId "UPL-1.0"
    reason: Added UPL-1.0. The record title, dct:alternative and dct:source (the Open Source Initiative
      page for UPL) all agree with the SPDX entry.
    source: review-finding 1/spdx:licenseId
  - action: removed
    statement: cc:attributionName "- not specified -"
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE'', and dct:publisher
      and cc:attributionName were the placeholder ''- not specified -''.'
    source: manual
  - action: added
    statement: dalicc:LiabilityLimitation "IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE
      FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE,
      ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE."
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE'', and dct:publisher
      and cc:attributionName were the placeholder ''- not specified -''.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF
      ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT."
    previous: dalicc:WarrantyDisclaimer "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY
      KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS
      FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS
      BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT
      OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS
      IN THE SOFTWARE."
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE'', and dct:publisher
      and cc:attributionName were the placeholder ''- not specified -''.'
    source: manual
  - action: removed
    statement: dct:publisher "- not specified -"
    reason: 'Library conventions 10 and 14: the disclaimer paragraph held the liability sentence,
      which begins ''IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE'', and dct:publisher
      and cc:attributionName were the placeholder ''- not specified -''.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "This license is subject to the following
      condition: The above copyright notice and either this complete permission notice or at a minimum
      a reference to the UPL must be included in all copies or substantial portions of the Software."
      The permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice
      has to survive the relicensing.'
    source: manual
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
