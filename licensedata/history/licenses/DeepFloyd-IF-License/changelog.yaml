id: DeepFloyd-IF-License
title: DeepFloyd IF License Agreement
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice, dalicc:addStatement,
      dalicc:exportControlNotice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice, dalicc:addStatement,
      dalicc:exportControlNotice]
    reason: 'Its duty cc:Notice quotes "Together with any copies of the Software Products (as well
      as derivative works thereof or works incorporating the Software Products) that you distribute,
      you must provide (i) a copy of this License, and (ii) the following attribution notice: “DeepFloyd
      is licensed under the DeepFloyd License, Copyright (c) Stability AI Ltd." Its duty dalicc:addStatement
      quotes "Together with any copies of the Software Products (as well as derivative works thereof
      or works incorporating the Software Products) that you distribute, you must provide (i) a copy
      of this License, and (ii) the following attribution notice: “DeepFloyd is licensed under the
      DeepFloyd License, Copyright (c) Stability AI Ltd."'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to your
      compliance with the Documentation and Sections 2, 3, and 5, Stability AI grants you a non-exclusive,
      worldwide, non-transferable, non-sublicensable, revocable, royalty free and limited license
      under Stability AI’s copyright interests to reproduce, distribute, and create derivative works
      of the Software solely for your non-commercial research purposes."'
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "offer or impose
      any terms on the Software Products that alter, restrict, or are inconsistent with the terms
      of this License."'
    source: manual
  - action: changed
    statement: prohibition dalicc:addLimitation
    previous: prohibition dalicc:addLimitation
    reason: 'The statement now quotes the sentence of the licence text it rests on: "offer or impose
      any terms on the Software Products that alter, restrict, or are inconsistent with the terms
      of this License."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Licensee has
      not been granted any trademark license as part of this License and may not use any name or mark
      associated with Stability AI without the prior written permission of Stability AI, except to
      the extent necessary to make the reference required by the “ATTRIBUTION” section of this Agreement."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The foregoing
      license is personal to you, and you may not assign or sublicense this License or any other rights
      or obligations under this License without Stability AI’s prior written consent; any such assignment
      or sublicense will be void and will automatically and immediately terminate this License."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
