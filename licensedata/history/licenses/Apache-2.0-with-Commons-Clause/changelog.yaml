id: Apache-2.0-with-Commons-Clause
title: Apache License 2.0 with the Commons Clause
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "Any license notice or attribution required by the License must also include this Commons Clause
      License Condition notice."'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "Any license notice or attribution required by the License must also include this Commons Clause
      License Condition notice."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Its duty cc:Attribution quotes "If the Work includes a "NOTICE" text file as part of
      its distribution, then any Derivative Works that You distribute must include a readable copy
      of the attribution notices contained within such NOTICE file, excluding those notices that do
      not pertain to any part of the Derivative Works, in at least one of the following places: within
      a NOTICE text file distributed as part of the Derivative Works; within the Source form or documentation,
      if provided along with the Derivative Works; or, within a display generated by the Derivative
      Works, if and wherever such third-party notices normally appear." Its duty cc:Notice quotes
      "Any license notice or attribution required by the License must also include this Commons Clause
      License Condition notice."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "This License
      does not grant permission to use the trade names, trademarks, service marks, or product names
      of the Licensor, except as required for reasonable and customary use in describing the origin
      of the Work and reproducing the content of the NOTICE file."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sellCopy
    previous: prohibition dalicc:sellCopy
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Without limiting
      other conditions in the License, the grant of rights under the License will not include, and
      the License does not grant to you, the right to Sell the Software."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
