id: CreativeCommonsAttributionNoncommercialSharealike30Romania
title: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Romania
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 clause text, 1 identification detail and 1 asset target, recorded the relation to the record
    this one was adapted from and recorded the review state.
  changes:
  - action: changed
    statement: "dalicc:WarrantyDisclaimer \"Prin punerea Operei la dispoziţia publicului în conformitate\
      \ cu dispoziţiile prezentei licenţe, Licenţiatorul declară de bună credinţă că, în conformitate\
      \ cu ceea ce cunoaşte şi în limite rezonabile:\n \n \n \n Licenţiatorul a obţinut toate drepturile\
      \ necesare asupra Operei pentru a putea autoriza exerciţiul drepturilor acordate prin prezenta\
      \ licenţă şi a permite utilizarea netulburată şi exerciţiul licit al acestor drepturi, aceasta\
      \ fără ca Licenţiatul să aibă o obligaţie de a plăti vreo remuneraţie, cu excepţia celor prevăzute\
      \ de mecanismele de gestiune colectivă obligatorie descrise la articolul 4 litera (f);\n Opera\
      \ nu dă naştere vreunei încălcări a drepturilor unor terţe persoane, în special drepturi de\
      \ autor sau drepturi conexe, drepturi privind mărcile, drepturi privind informaţia, drepturi\
      \ patrimoniale sau oricare alte drepturi, şi nici vreunei defăimări, violări a dreptului la\
      \ viaţa privată sau vreunui alt fapt ilicit cu privire la oricare altă terţă parte. \n \n \n\
      \ Cu excepţia cazurilor prevăzute expres în prezenta licenţă sau într-un alt acord scris, sau\
      \ cerute de legea aplicabilă, Opera este pusă la dispoziţie fără vreo garanţie de orice fel,\
      \ expresă sau tacită, inclusiv în ceea ce priveşte conţinutul Operei sau exactitatea acesteia.\
      \ \n \n\""
    previous: "dalicc:WarrantyDisclaimer \"Prin punerea Operei la dispoziţia publicului în conformitate\
      \ cu dispoziţiile prezentei licenţe, Licenţiatorul declară de bună credinţă că, în conformitate\
      \ cu ceea ce cunoaşte şi în limite rezonabile:\n \n \n \n Licenţiatorul a obţinut toate drepturile\
      \ necesare asupra Operei pentru a putea autoriza exerciţiul drepturilor acordate prin prezenta\
      \ licenţă şi a permite utilizarea netulburată şi exerciţiul licit al acestor drepturi, aceasta\
      \ fără ca Licenţiatul să aibă o obligaţie de a plăti vreo remuneraţie, cu excepţia celor prevăzute\
      \ de mecanismele de gestiune colectivă obligatorie descrise la articolul 3 litera (f);\n Opera\
      \ nu dă naştere vreunei încălcări a drepturilor unor terţe persoane, în special drepturi de\
      \ autor sau drepturi conexe, drepturi privind mărcile, drepturi privind informaţia, drepturi\
      \ patrimoniale sau oricare alte drepturi, şi nici vreunei defăimări, violări a dreptului la\
      \ viaţa privată sau vreunui alt fapt ilicit cu privire la oricare altă terţă parte. \n \n \n\
      \ Cu excepţia cazurilor prevăzute expres în prezenta licenţă sau într-un alt acord scris, sau\
      \ cerute de legea aplicabilă, Opera este pusă la dispoziţie fără vreo garanţie de orice fel,\
      \ expresă sau tacită, inclusiv în ceea ce priveşte conţinutul Operei sau exactitatea acesteia.\
      \ \n \n\""
    reason: 'The clause was quoted from the wrong element set. The warranty clause of the Romanian
      port carries an internal cross reference to the royalty paragraph, and the letter and article
      of that reference differ per element set: the Attribution and Attribution-ShareAlike legal codes
      say "articolul 3 litera (f)", this one says "articolul 4 litera (f)". The record carried the
      Attribution wording. Requoted from this legal code, so that the field is now verbatim. Section
      5 is headed "Garantie si exonerarea de raspundere" and carries two things at once: an affirmative
      good faith representation by the Licensor that it has obtained the rights needed and that the
      Work infringes nobody, and then the disclaimer sentence "Cu exceptia cazurilor prevazute expres
      in prezenta licenta sau intr-un alt acord scris, sau cerute de legea aplicabila, Opera este
      pusa la dispozitie fara vreo garantie de orice fel, expresa sau tacita". The record holds the
      whole section, which is the accurate reading of the field, since the section does contain a
      disclaimer. Section 6 (Limitarea raspunderii) sits in dalicc:LiabilityLimitation on its own.'
    source: review-finding 6/dalicc:WarrantyDisclaimer
