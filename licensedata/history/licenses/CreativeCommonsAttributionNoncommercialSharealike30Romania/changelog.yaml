    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-sa/3.0/ro/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-sa/3.0/ro/, and
      the six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: changed
    statement: dct:title "Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Romania"@en
    previous: dct:title "Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Romania "@en
    reason: The dct:title literal ended in a space, "Creative Commons Attribution-NonCommercial-ShareAlike
      3.0 Romania ", which the library list and the search index carry through. Removed. The same
      defect sits in the NonCommercial-ShareAlike record of every Creative Commons port in the library.
    source: review-finding 1/dct:title
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database
      right expressly. Section 1 defines "Opera" to include "o baza de date in conformitate cu definitiile
      din legislatia in vigoare privind drepturile de autor si drepturile conexe" (a database as defined
      by the copyright and neighbouring rights legislation in force), Section 3 grants "in cazul in
      care opera este o baza de date, dreptul de a extrage si/sau a reutiliza parti substantiale din
      Opera" (where the work is a database, the right to extract and reuse substantial parts of it)
      and closes with "Daca Licentiatorul este titularul drepturilor sui-generis asupra unei baze
      de date, in conformitate cu legea nationala care implementeaza Directiva Europeana privind Bazele
      de Date, Licentiatorul va renunta la aceste drepturi" (if the Licensor holds sui generis database
      rights under the national law implementing the European Database Directive, the Licensor waives
      them). Section 4 adds that the restrictions do not apply to the parts of the Work that qualify
      only under the Romanian sui generis database right. Because the legal text names databases as
      licensed subject matter and disposes of the database maker's right in the grant itself, dcmitype:Dataset
      was added here rather than left as a proposal, which is how the same question was decided for
      the Portuguese, Czech and Azerbaijani ports. The ports in this batch whose text has no database
      clause at all, Ecuador and Brazil, keep the proposal.
    source: review-finding 2/odrl:target
