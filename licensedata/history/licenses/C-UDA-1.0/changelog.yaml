id: C-UDA-1.0
title: Computational Use of Data Agreement v1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:ShareAlike]
    previous: permission odrl:derive with duties [cc:Attribution, cc:ShareAlike]
    reason: Its duty cc:Attribution quotes "You include with any Data you redistribute all credit
      or attribution information that you received with the Data, and your terms require any Downstream
      Recipient to do the same; and"
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:ShareAlike]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:ShareAlike]
    reason: Its duty cc:Attribution quotes "You include with any Data you redistribute all credit
      or attribution information that you received with the Data, and your terms require any Downstream
      Recipient to do the same; and"
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:ShareAlike]
    previous: permission odrl:modify with duties [cc:Attribution, cc:ShareAlike]
    reason: Its duty cc:Attribution quotes "You include with any Data you redistribute all credit
      or attribution information that you received with the Data, and your terms require any Downstream
      Recipient to do the same; and"
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
