id: CUA-OPL-1.0
title: CUA Office Public License v1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense
    previous: permission dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The Source Code
      version of Covered Code may be distributed only under the terms of this License or a future
      version of this License released under Section 6.1, and You must include a copy of this License
      with every copy of the Source Code You distribute."'
    source: manual
  - action: changed
    statement: permission dalicc:sublicense
    previous: permission dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "under intellectual
      property rights (other than patent or trademark) Licensable by Initial Developer to use, reproduce,
      modify, display, perform, sublicense and distribute the Original Code (or portions thereof)
      with or without Modifications, and/or as part of a Larger Work; and"'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
