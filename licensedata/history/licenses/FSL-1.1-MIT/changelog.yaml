id: FSL-1.1-MIT
title: Functional Source License, Version 1.1, MIT Future License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:derive with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "If you redistribute any copies, modifications or derivatives
      of the Software, you must include a copy of or a link to these Terms and Conditions and not
      remove any copyright notices provided in or with the Software." Its duty cc:ShareAlike quotes
      "The Terms and Conditions apply to all copies, modifications and derivatives of the Software."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:distribute with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "If you redistribute any copies, modifications or derivatives
      of the Software, you must include a copy of or a link to these Terms and Conditions and not
      remove any copyright notices provided in or with the Software." Its duty cc:ShareAlike quotes
      "The Terms and Conditions apply to all copies, modifications and derivatives of the Software."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:modify with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "If you redistribute any copies, modifications or derivatives
      of the Software, you must include a copy of or a link to these Terms and Conditions and not
      remove any copyright notices provided in or with the Software." Its duty cc:ShareAlike quotes
      "The Terms and Conditions apply to all copies, modifications and derivatives of the Software."
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Except for displaying
      the License Details and identifying us as the origin of the Software, you have no right under
      these Terms and Conditions to use our trademarks, trade names, service marks or product names."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
