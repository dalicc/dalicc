id: CreativeCommonsAttributionSharealike30Uganda
title: Creative Commons Attribution-ShareAlike 3.0 Uganda
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    4 alternative titles, recorded the relation to the record this one was adapted from and recorded
    the review state. Later changes recorded which sentence of the text each statement rests on, recorded
    when the license ends on a breach, named the license the record itself is published under and
    removed the quotes that do not name the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 UG"
    previous: dct:alternative "CC BY SA 3.0 ug"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 UG"
    previous: dct:alternative "CC BY-SA 3.0 ug"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 UG"
    previous: dct:alternative "CC-BY-SA 3.0 ug"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 UG"
    previous: dct:alternative "Creative Commons BY-SA 3.0 ug"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/ug/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/ug/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this Licence, Licensor hereby grants the User a worldwide, royalty-free,
      non-exclusive, perpetual (for the duration of the applicable copyright) license to exercise
      the rights in the Work as stated below:"'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this Licence, Licensor hereby grants the User a worldwide, royalty-free,
      non-exclusive, perpetual (for the duration of the applicable copyright) license to exercise
      the rights in the Work as stated below:"'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The User may
      not sublicense the Work."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "This Licence and the rights granted hereunder
      will terminate automatically upon any breach by the User of the terms of this Licence."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:reproduce: the
      quoted sentence does not name the act. The statements stay, read from the text without a linked
      quote.'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:reproduce: the
      quoted sentence does not name the act. The statements stay, read from the text without a linked
      quote.'
    source: manual
