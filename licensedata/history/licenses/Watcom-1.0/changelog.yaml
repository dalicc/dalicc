id: Watcom-1.0
title: Sybase Open Watcom Public License 1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense
    previous: permission dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You must make
      Source Code of all Your Deployed Modifications publicly available under the terms of this License,
      including the license grants set forth in Section 3 below, for as long as you Deploy the Covered
      Code or twelve (12) months from the date of initial Deployment, whichever is longer."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "No Sybase Marks
      or Contributor Marks may be used to endorse or promote products derived from the Original Code
      or Covered Code other than with the prior written consent of Sybase or the Contributor, as applicable."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
