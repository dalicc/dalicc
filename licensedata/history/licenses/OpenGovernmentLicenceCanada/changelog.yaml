id: OpenGovernmentLicenceCanada
title: Open Government Licence - Canada
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 permission, changed
    2 permissions and recorded the review state. Later changes brought it in line with its family
    and its text in the verification of 2026-09-15, permitted relicensing with the notice as a duty,
    recorded which sentence of the text each statement rests on and named the license the record itself
    is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: changed
    statement: permission cc:DerivativeWorks with duties [cc:Attribution, cc:Notice]
    previous: permission cc:DerivativeWorks with duties [cc:Attribution]
    reason: 'The licence requires two things and the record modelled one: "Acknowledge the source
      of the Information by including any attribution statement specified by the Information Provider(s)
      and, where possible, provide a link to this licence." cc:Notice was missing. Added next to cc:Attribution
      on the cc:DerivativeWorks and odrl:distribute permissions.'
    source: review-finding 5/odrl:duty
  - action: added
    statement: permission dalicc:ModifiedWorks
    reason: dalicc:ModifiedWorks was missing although the freedoms list names modify, adapt and distribute
      in one sentence, so distributing a modified version is plainly granted. Added, which also aligns
      the record with OpenDataLicenceAgreement, the record of the same text issued by the Office of
      the Commissioner of Lobbying.
    source: review-finding 3/odrl:permission
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution]
    reason: dalicc:ModifiedWorks was missing although the freedoms list names modify, adapt and distribute
      in one sentence, so distributing a modified version is plainly granted. Added, which also aligns
      the record with OpenDataLicenceAgreement, the record of the same text issued by the Office of
      the Commissioner of Lobbying.
    source: review-finding 3/odrl:permission
  - action: added
    statement: spdx:licenseId "OGL-Canada-2.0"
    reason: 'The record carried no SPDX identifier although its title is word for word the SPDX name
      of OGL-Canada-2.0 and its cc:legalcode is the SPDX seeAlso URL. The text confirms the version:
      "This is version 2.0 of the Open Government Licence - Canada." Added.'
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: dct:alternative "OGL-Canada-2.0"
    reason: 'The review''s finding on family consistency: the record prohibited cc:ShareAlike and
      dalicc:addStatement without support from the text, which prescribes the attribution wording,
      and it carried no dct:alternative at all, so it could not be found by searching for its SPDX
      identifier OGL-Canada-2.0.'
    source: manual
  - action: added
    statement: dct:alternative "Open Government Licence - Canada 2.0"
    reason: 'The review''s finding on family consistency: the record prohibited cc:ShareAlike and
      dalicc:addStatement without support from the text, which prescribes the attribution wording,
      and it carried no dct:alternative at all, so it could not be found by searching for its SPDX
      identifier OGL-Canada-2.0.'
    source: manual
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: 'The review''s finding on family consistency: the record prohibited cc:ShareAlike and
      dalicc:addStatement without support from the text, which prescribes the attribution wording,
      and it carried no dct:alternative at all, so it could not be found by searching for its SPDX
      identifier OGL-Canada-2.0.'
    source: manual
  - action: removed
    statement: prohibition dalicc:addStatement
    reason: 'The review''s finding on family consistency: the record prohibited cc:ShareAlike and
      dalicc:addStatement without support from the text, which prescribes the attribution wording,
      and it carried no dct:alternative at all, so it could not be found by searching for its SPDX
      identifier OGL-Canada-2.0.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "The Information Provider grants you a
      worldwide, royalty-free, perpetual, non-exclusive licence to use the Information, including
      for commercial purposes, subject to the terms below." The permission carries the dalicc:compliantLicense
      duty, as Apache-2.0 does, because the notice has to survive the relicensing.'
    source: manual
  - action: changed
    statement: permission cc:CommercialUse
    previous: permission cc:CommercialUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Using Information
      under this licence * Use of any Information indicates your acceptance of the terms below. *
      The Information Provider grants you a worldwide, royalty-free, perpetual, non-exclusive licence
      to use the Information, including for commercial purposes, subject to the terms below."'
    source: manual
  - action: changed
    statement: permission cc:DerivativeWorks with duties [cc:Attribution, cc:Notice]
    previous: permission cc:DerivativeWorks with duties [cc:Attribution, cc:Notice]
    reason: 'Its duty cc:Notice quotes "You must, where you do any of the above: * Acknowledge the
      source of the Information by including any attribution statement specified by the Information
      Provider(s) and, where possible, provide a link to this licence. * If the Information Provider
      does not provide a specific attribution statement, or if you are using Information from several
      information providers and multiple attributions are not practical for your product or application,
      you must use the following attribution statement: Contains information licensed under the Open
      Government Licence - Canada."'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Its duty cc:Notice quotes "You must, where you do any of the above: * Acknowledge the
      source of the Information by including any attribution statement specified by the Information
      Provider(s) and, where possible, provide a link to this licence. * If the Information Provider
      does not provide a specific attribution statement, or if you are using Information from several
      information providers and multiple attributions are not practical for your product or application,
      you must use the following attribution statement: Contains information licensed under the Open
      Government Licence - Canada."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Exemptions This
      licence does not grant you any right to use: * Personal Information; * third party rights the
      Information Provider is not authorized to license; * the names, crests, logos, or other official
      symbols of the Information Provider; and * Information subject to other intellectual property
      rights, including patents, trade-marks and official marks."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
