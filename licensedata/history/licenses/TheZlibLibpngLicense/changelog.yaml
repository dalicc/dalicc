- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Family
    rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no source
    code asks only that the notice travels with the copy, which is a duty on the acts it governs and
    not a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission
    here, and the prohibition the earlier pass wrote is removed. The text reads: "Permission is granted
    to anyone to use this software for any purpose, including commercial applications, and to alter
    it and redistribute it freely, subject to the following restrictions: 1. The origin of this software
    must not be misrepresented; you must not claim that you wrote the original software." The permission
    carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive
    the relicensing.'
  changes:
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 5
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: The alternative name "Libpng" is dropped. The SPDX license list gives that identifier to
    a different text, the libpng notice, which the library now holds as the record Libpng, so a lookup
    for the name reached the wrong licence.
  changes:
  - action: removed
    statement: dct:alternative "Libpng"
    reason: Edited by hand; see the summary of this entry.
    source: manual
