id: TheZlibLibpngLicense
title: The zlib libpng License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 clause text and 1 identification detail and recorded
    the review state. Later changes brought it in line with its family and its text in the verification
    of 2026-09-15, permitted relicensing with the notice as a duty, corrected it against its text
    on 2026-09-23, recorded which sentence of the text each statement rests on and named the license
    the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:WarrantyDisclaimer "This software is provided ‘as-is’, without any express or
      implied warranty. In no event will the authors be held liable for any damages arising from the
      use of this software."
    reason: The opening paragraph is a warranty disclaimer and was not recorded. Added, quoted from
      the text.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: spdx:licenseId "Zlib"
    reason: 'Added Zlib. Verified rather than taken on trust: cc:legalcode already points at the Open
      Source Initiative page that the SPDX entry lists under seeAlso, and the fetched text is the
      same three-restriction license.'
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: dalicc:LiabilityLimitation "In no event will the authors be held liable for any damages
      arising from the use of this software."
    reason: 'Library conventions 10 and 14: the disclaimer held both sentences of the zlib notice,
      the second beginning ''In no event will the authors be held liable for any damages arising from
      the use of this software'', and dct:publisher was the placeholder ''N.N.''.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "This software is provided ‘as-is’, without any express or
      implied warranty."
    previous: dalicc:WarrantyDisclaimer "This software is provided ‘as-is’, without any express or
      implied warranty. In no event will the authors be held liable for any damages arising from the
      use of this software."
    reason: 'Library conventions 10 and 14: the disclaimer held both sentences of the zlib notice,
      the second beginning ''In no event will the authors be held liable for any damages arising from
      the use of this software'', and dct:publisher was the placeholder ''N.N.''.'
    source: manual
  - action: removed
    statement: dct:publisher "N.N."
    reason: 'Library conventions 10 and 14: the disclaimer held both sentences of the zlib notice,
      the second beginning ''In no event will the authors be held liable for any damages arising from
      the use of this software'', and dct:publisher was the placeholder ''N.N.''.'
    source: manual
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Library
      convention 15: a licence that asks for no reciprocity and no source code asks only that the
      notice travels with the copy, which is a duty on the acts it governs and not a bar on putting
      the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
      the record carried before is removed. The text reads: "Permission is granted to anyone to use
      this software for any purpose, including commercial applications, and to alter it and redistribute
      it freely, subject to the following restrictions: 1. The origin of this software must not be
      misrepresented; you must not claim that you wrote the original software." The permission carries
      the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
      relicensing.'
    source: manual
  - action: removed
    statement: dct:alternative "Libpng"
    reason: The alternative name "Libpng" is dropped. The SPDX license list gives that identifier
      to a different text, the libpng notice, which the library now holds as the record Libpng, so
      a lookup for the name reached the wrong licence.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Notice, dalicc:modificationNotice, dalicc:rename]
    previous: permission odrl:derive with duties [cc:Notice, dalicc:modificationNotice, dalicc:rename]
    reason: Its duty dalicc:modificationNotice quotes "Altered source versions must be plainly marked
      as such, and must not be misrepresented as being the original software."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Notice, dalicc:modificationNotice, dalicc:rename]
    previous: permission odrl:modify with duties [cc:Notice, dalicc:modificationNotice, dalicc:rename]
    reason: Its duty dalicc:modificationNotice quotes "Altered source versions must be plainly marked
      as such, and must not be misrepresented as being the original software."
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
