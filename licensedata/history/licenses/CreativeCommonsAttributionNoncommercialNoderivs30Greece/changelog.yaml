id: CreativeCommonsAttributionNoncommercialNoderivs30Greece
title: Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 Greece
current_version: 4
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-nd/3.0/gr/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of the port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/gr/, and
      the six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-NC-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port names a database as licensed subject
      matter in its own text: clause 3(e), in English rendering, grants the right "to make any use
      of a substantial part of the contents of a database, in the case where the licensed subject
      matter is a database", and clause 3 adds that where the Licensor holds the sui generis right
      of the database maker under Greek copyright law implementing Directive 96/9/EC, the Licensor
      waives that right. Clause 4(e) exempts the parts covered only by the sui generis right from
      the restrictions. Since the text is explicit, dcmitype:Dataset was added here rather than left
      to the library wide decision that covers the ports whose text says nothing about databases.'
    source: review-finding 2/odrl:target
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
    now supplies it.
  changes:
  - action: removed
    statement: prohibition dalicc:promote
    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 4
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: clause 3(e), in the English
    rendering the review quotes, grants the right "to make any use of a substantial part of the contents
    of a database, in the case where the licensed subject matter is a database", and clause 3 adds
    that the Licensor waives the sui generis right of the database maker under Greek copyright law
    implementing Directive 96/9/EC. dalicc:suiGenerisDatabaseRights is now permitted, and it carries
    no duty because clause 4(e) exempts the parts covered only by the sui generis right from the restrictions.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
