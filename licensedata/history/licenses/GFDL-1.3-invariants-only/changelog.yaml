id: GFDL-1.3-invariants-only
title: GNU Free Documentation License v1.3 only - invariants
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: duty cc:ShareAlike
    previous: duty cc:ShareAlike
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may copy
      and distribute a Modified Version of the Document under the conditions of sections 2 and 3 above,
      provided that you release the Modified Version under precisely this License, with the Modified
      Version filling the role of the Document, thus licensing distribution and modification of the
      Modified Version to whoever possesses a copy of it."'
    source: manual
  - action: changed
    statement: permission dalicc:chargeDistributionFee
    previous: permission dalicc:chargeDistributionFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "However, you
      may accept compensation in exchange for copies."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
