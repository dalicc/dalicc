id: CreativeCommonsAttributionNoncommercialNoderivs30Germany
title: Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 Germany
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 identification details and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state. Later changes recorded what the text says about the database
    right, recorded which sentence of the text each statement rests on, recorded when the license
    ends on a breach, named the license the record itself is published under and removed the quotes
    that do not name the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-nd/3.0/de/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/de/, and
      the six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database
      right expressly. Section 1 defines the subject matter so that "Soweit Datenbanken oder Zusammenstellungen
      von Daten einen immaterialgueterrechtlichen Schutz eigener Art geniessen, unterfallen auch sie
      dem Begriff Schutzgegenstand im Sinne dieser Lizenz" (databases and compilations of data that
      enjoy sui generis protection are themselves subject matter of this licence), and Section 3 closes
      with the waiver "verzichtet der Lizenzgeber auf sämtliche aus diesem Schutz resultierenden Rechte".
      Section 4 adds that the restrictions do not bite on the parts that are subject matter only because
      of that sui generis protection. Because the legal text names databases as licensed subject matter
      and disposes of the database maker's right in the grant itself, dcmitype:Dataset was added here
      rather than left as a proposal, which is how the same question was decided for the Portuguese,
      Czech and Azerbaijani ports. The ports in this review group whose text has no database clause
      at all, Ecuador and Brazil, keep the proposal.
    source: review-finding 2/odrl:target
  - action: added
    statement: spdx:licenseId "CC-BY-NC-ND-3.0-DE"
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/de/, and
      the six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: 'The port settles the sui generis database right in its own text: Section 1 counts a protected
      database as licensed subject matter, "Soweit Datenbanken oder Zusammenstellungen von Daten einen
      immaterialgueterrechtlichen Schutz eigener Art geniessen, unterfallen auch sie dem Begriff Schutzgegenstand
      im Sinne dieser Lizenz", and Section 3 closes with the waiver "verzichtet der Lizenzgeber auf
      sämtliche aus diesem Schutz resultierenden Rechte". dalicc:suiGenerisDatabaseRights is now permitted,
      and it carries no duty because Section 4 adds that the restrictions do not bite on the parts
      that are subject matter only because of that sui generis protection.'
    source: manual
  - action: changed
    statement: prohibition cc:CommercialUse
    previous: prohibition cc:CommercialUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Durch die Ausübung
      Ihrer Rechte aus dieser Lizenz dürfen Sie ohne eine vorherige, separat und schriftlich vorliegende
      Zustimmung des Lizenzgebers und / oder des Zuschreibungsempfängers weder explizit noch implizit
      irgendeine Verbindung zum Lizenzgeber oder Zuschreibungsempfänger und ebenso wenig eine Unterstützung
      oder Billigung durch ihn andeuten."'
    source: manual
  - action: changed
    statement: prohibition odrl:derive
    previous: prohibition odrl:derive
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Die Rechteeinräumung
      gemäß Abschnitt 3 gilt nur für Handlungen, die nicht vorrangig auf einen geschäftlichen Vorteil
      oder eine geldwerte Vergütung gerichtet sind ("nicht-kommerzielle Nutzung", "Non-commercial-Option")."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Diese Lizenz und die durch sie eingeräumten
      Nutzungsrechte erlöschen mit Wirkung für die Zukunft im Falle eines Verstoßes gegen die Lizenzbedingungen
      durch Sie, ohne dass es dazu der Kenntnis des Lizenzgebers vom Verstoß oder einer weiteren Handlung
      einer der Vertragsparteien bedarf."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: prohibition cc:CommercialUse
    previous: prohibition cc:CommercialUse
    reason: 'Removed the quoted evidence of prohibition cc:CommercialUse, prohibition odrl:derive:
      the quoted sentence does not name the act. The statements stay, read from the text without a
      linked quote.'
    source: manual
  - action: changed
    statement: prohibition odrl:derive
    previous: prohibition odrl:derive
    reason: 'Removed the quoted evidence of prohibition cc:CommercialUse, prohibition odrl:derive:
      the quoted sentence does not name the act. The statements stay, read from the text without a
      linked quote.'
    source: manual
