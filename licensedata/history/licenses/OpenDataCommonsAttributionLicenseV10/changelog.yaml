entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 clause text, 1 identification detail and 1 prohibition,
    removed 1 license-wide duty, changed 1 clause text and recorded the review state.
  changes:
  - action: added
    statement: 'dalicc:LiabilityLimitation "Subject to any liability that may not be excluded or limited
      by law, the Licensor is not liable for, and expressly excludes, all liability for loss or damage
      however and whenever caused to anyone by any use under this License, whether by You or by anyone
      else, and whether caused by any fault on the part of the Licensor or not. This exclusion of
      liability includes, but is not limited to, any special, incidental, consequential, punitive,
      or exemplary damages such as loss of revenue, data, anticipated profits, and lost business.
      This exclusion applies even if the Licensor has been advised of the possibility of such damages.

      If liability may not be excluded by law, it is limited to actual and direct financial loss to
      the extent it is caused by proved negligence on the part of the Licensor."'
    reason: 'dalicc:WarrantyDisclaimer did not hold a clause of the licence at all: it held the standard
      website disclaimer of opendatacommons.org, "Open Data Commons is not a law firm and does not
      provide legal services of any kind ...", which is the boilerplate printed above every licence
      on that site. Replaced with Section 7.1 of the licence, quoted verbatim, and Section 8.1 with
      8.2 added as dalicc:LiabilityLimitation, which the record did not have.'
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: changed
    statement: dalicc:WarrantyDisclaimer "The Database is licensed by the Licensor \"as is\" and without
      any warranty of any kind, either express, implied, or arising by statute, custom, course of
      dealing, or trade usage. Licensor specifically disclaims any and all implied warranties or conditions
      of title, non-infringement, accuracy or completeness, the presence or absence of errors, fitness
      for a particular purpose, merchantability, or otherwise. Some jurisdictions do not allow the
      exclusion of implied warranties, so this exclusion may not apply to You."
    previous: 'dalicc:WarrantyDisclaimer " Open Data Commons is not a law firm and does not provide
      legal services of any kind.


      Open Data Commons has no formal relationship with you. Your receipt of this document does not
      create any kind of agent-client relationship. Please seek the advice of a suitably qualified
      legal professional licensed to practice in your jurisdiction before using this document.


      No warranties and disclaimer of any damages. This information is provided ‘as is‘, and this
      site makes no warranties on the information provided. Any damages resulting from its use are
      disclaimed."'
    reason: 'dalicc:WarrantyDisclaimer did not hold a clause of the licence at all: it held the standard
      website disclaimer of opendatacommons.org, "Open Data Commons is not a law firm and does not
      provide legal services of any kind ...", which is the boilerplate printed above every licence
      on that site. Replaced with Section 7.1 of the licence, quoted verbatim, and Section 8.1 with
      8.2 added as dalicc:LiabilityLimitation, which the record did not have.'
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: removed
    statement: duty cc:ShareAlike
    reason: 'Review decision 9: the Open Data Commons Attribution License is attribution only and
      imposes no share-alike condition.'
    source: consolidation-decision 9
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: added
    statement: spdx:licenseId "ODC-By-1.0"
    reason: The record carried no SPDX identifier although its title is word for word the SPDX name
      of ODC-By-1.0 and its cc:legalcode is the SPDX seeAlso URL. Added.
    source: review-finding 1/spdx:licenseId
- version: 3
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Permit relicensing on permissive licences; the notice clause is a duty, not a bar. Family
    rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no source
    code asks only that the notice travels with the copy, which is a duty on the acts it governs and
    not a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission
    here, and the prohibition the earlier pass wrote is removed. The text reads: "Subject to the terms
    and conditions of this License, the Licensor grants to You a worldwide, royalty-free, non-exclusive,
    terminable (but only under Section 9) license to Use the Database for the duration of any applicable
    copyright and Database Rights." The permission carries the dalicc:compliantLicense duty, as Apache-2.0
    does, because the notice has to survive the relicensing.'
  changes:
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: prohibition dalicc:ChangeLicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
