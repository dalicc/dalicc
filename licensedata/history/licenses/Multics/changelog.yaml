id: Multics
title: Multics License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:addStatement]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:addStatement]
    reason: Its duty cc:Attribution quotes "Permission to use, copy, modify, and distribute these
      programs and their documentation for any purpose and without fee is hereby granted,provided
      that the below copyright notice and historical background appear in all copies and that both
      the copyright notice and historical background and this permission notice appear in supporting
      documentation, and that the names of MIT, HIS, BULL or BULL HN not be used in advertising or
      publicity pertaining to distribution of the programs without specific prior written permission."
      Its duty cc:Notice quotes "Permission to use, copy, modify, and distribute these programs and
      their documentation for any purpose and without fee is hereby granted,provided that the below
      copyright notice and historical background appear in all copies and that both the copyright
      notice and historical background and this permission notice appear in supporting documentation,
      and that the names of MIT, HIS, BULL or BULL HN not be used in advertising or publicity pertaining
      to distribution of the programs without specific prior written permission." Its duty dalicc:addStatement
      quotes "Permission to use, copy, modify, and distribute these programs and their documentation
      for any purpose and without fee is hereby granted,provided that the below copyright notice and
      historical background appear in all copies and that both the copyright notice and historical
      background and this permission notice appear in supporting documentation, and that the names
      of MIT, HIS, BULL or BULL HN not be used in advertising or publicity pertaining to distribution
      of the programs without specific prior written permission."
    source: manual
