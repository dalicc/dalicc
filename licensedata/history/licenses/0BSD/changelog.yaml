id: 0BSD
title: Free Public License 1.0.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 removed 1 prohibition, recorded the relation to the record
    this one was adapted from and recorded the review state. Later changes brought it in line with
    its family and its text in the verification of 2026-09-15, permitted relicensing with the notice
    as a duty, left endorsement to the default rule of the core dependency graph, recorded which sentence
    of the text each statement rests on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: removed
    statement: prohibition cc:ShareAlike
    reason: 'The text reads in full: "Permission to use, copy, modify, and/or distribute this software
      for any purpose with or without fee is hereby granted." A prohibition of cc:ShareAlike asserts
      that a licensee may not put the work out under these same terms, which the unconditional grant
      contradicts. cc:ShareAlike is a duty term; a license that is silent about relicensing must carry
      no share-alike statement at all. Removed. Flagged by the family conventions checked before the
      review.'
    source: review-finding 5/odrl:prohibition
  - action: removed
    statement: cc:attributionName "- not specified - "
    reason: 'The review''s finding on family consistency: the record permitted dalicc:noWarrantyNotice
      and prohibited dalicc:addStatement, neither of which the Zero Clause BSD text states, and carried
      the placeholder ''- not specified - '' as its publisher and attribution name. The whole operative
      text is ''Permission to use, copy, modify, and/or distribute this software for any purpose with
      or without fee is hereby granted.'' The disclaimer paragraph is split at ''IN NO EVENT SHALL
      THE AUTHOR BE LIABLE''.'
    source: manual
