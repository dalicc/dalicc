id: CreativeCommonsAttributionSharealike30NewZealand
title: Creative Commons Attribution-ShareAlike 3.0 New Zealand
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 clause text and 4 alternative titles, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: changed
    statement: 'dalicc:WarrantyDisclaimer "Except as required by law or as otherwise agreed in writing
      between the parties, the Work is licensed by the Licensor on an \"as is\" and \"as available\"
      basis and without any warranty of any kind, either express or implied.

      "'
    previous: "dalicc:WarrantyDisclaimer \"Except as required by law or as otherwise agreed in writing\
      \ between the parties, the Work or any Adaptation is licensed by the Licensor on an “as is”\
      \ and “as available” basis and without any warranty of any kind, either express or implied.\
      \ \n\""
    reason: The record quoted the warranty clause of the Attribution element set of this port, which
      reads "the Work or any Adaptation is licensed by the Licensor". Clause 3 of this element set
      reads "the Work is licensed by the Licensor on an 'as is' and 'as available' basis and without
      any warranty of any kind, either express or implied". The clause was requoted from this legal
      code, and the trailing space of the literal was dropped.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 NZ"
    previous: dct:alternative "CC BY SA 3.0 nz"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 NZ"
    previous: dct:alternative "CC BY-SA 3.0 nz"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 NZ"
    previous: dct:alternative "CC-BY-SA 3.0 nz"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 NZ"
    previous: dct:alternative "Creative Commons BY-SA 3.0 nz"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/nz/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/nz/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
