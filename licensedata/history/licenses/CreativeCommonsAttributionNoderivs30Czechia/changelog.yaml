id: CreativeCommonsAttributionNoderivs30Czechia
title: Creative Commons Attribution-NoDerivatives 3.0 Czechia
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nd/3.0/cz/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nd/3.0/cz/, and the six 4.0 International
      parents carry exactly that pair (legal code plus deed). Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port settles database rights expressly:
      the last paragraph of Article 3 waives the special right of the maker of a database in full,
      "poskytovatel se takoveho prava k Dilu v celem rozsahu vzdava", and Article 4(e) adds that the
      restrictions of 4(a) to 4(d) do not apply to the parts of the Work that fall under the definition
      only because of that right. Beyond that, the definition of "dilo" in Article 1 ends with "Za
      dila jsou povazovany tez databaze" (databases are also considered works) and names computer
      programs among the licensed subject matter. Because the legal text names databases as licensed
      subject matter and disposes of the database maker''s right in the grant itself, dcmitype:Dataset
      was added here rather than left as a proposal. The ports in this batch whose text has no database
      clause at all keep the proposal.'
    source: review-finding 2/odrl:target
