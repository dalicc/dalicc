id: AttributionNoncommercial20Netherlands
title: Creative Commons Attribution-NonCommercial 2.0 Netherlands
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state. Later changes left endorsement to the default rule of the core dependency graph,
    recorded which sentence of the text each statement rests on, recorded when the license ends on
    a breach and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "2.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc/2.0/nl/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc/2.0/nl/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in its
      own words, so the asset type is text supported rather than merely plausible. Article 1 brings
      a database inside the licensed work: "Voor de toepassing van deze Licentie wordt onder het Werk
      mede verstaan de geluidsopname in de zin van de Wet op de naburige rechten en de databank in
      de zin van de Databankenwet", the Dutch statute that implements the sui generis database right
      of directive 96/9/EC. The grant in article 3 then carries "het opvragen en hergebruiken van
      het Werk", the extraction and re-utilisation right itself, and the preamble names "het databankenrecht"
      among the rights protecting the work. Added dcmitype:Dataset.'
    source: review-finding 2/odrl:target
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:ModifiedWorks
    previous: permission dalicc:ModifiedWorks
    reason: 'The statement now quotes the sentence of the licence text it rests on: "De Gebruiker
      is tevens gerechtigd om technische wijzigingen aan te brengen die noodzakelijk zijn om de rechten
      met behulp van andere media, dragers en formats uit te oefenen."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "De Gebruiker
      is tevens gerechtigd om technische wijzigingen aan te brengen die noodzakelijk zijn om de rechten
      met behulp van andere media, dragers en formats uit te oefenen."'
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Het is de Gebruiker
      niet toegestaan om het Werk onder enige afwijkende voorwaarden aan te bieden waardoor de voorwaarden
      van deze Licentie dan wel de uitoefening van de rechten van de ontvangers krachtens deze Licentie
      worden gewijzigd of beperkt."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Het is de Gebruiker
      niet toegestaan om het Werk in sublicentie te geven."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Deze Licentie en de daarin verleende rechten
      vervallen automatisch op het moment dat de Gebruiker in strijd handelt met de voorwaarden van
      deze Licentie."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
