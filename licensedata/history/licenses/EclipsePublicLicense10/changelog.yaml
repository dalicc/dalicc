- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Weak-copyleft family alignment of 2026-09-15: the record is brought onto the shape of
    CPL-1.0 and IPL-1.0, which model the same text. Section 2(a) grants the right to ''reproduce,
    prepare derivative works of, publicly display, publicly perform, distribute and sublicense the
    Contribution'', so dalicc:sublicense replaces the older spelling odrl:grantUse and dalicc:ModifiedWorks
    is stated; the attribution, notice and source duties that sat on the derivative-works permission
    move onto odrl:modify and odrl:derive, where the rest of the family carries them; the unsupported
    dalicc:noWarrantyNotice permission and dalicc:addStatement prohibition go, because section 3 lets
    a distributor add its own notices rather than forbidding it; and the dalicc:promote prohibition
    goes, because this text has no trademark or endorsement clause at all.'
  changes:
  - action: changed
    statement: permission cc:DerivativeWorks
    previous: permission cc:DerivativeWorks with duties [cc:Attribution, cc:Notice, cc:SourceCode,
      dalicc:modificationNotice]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:ModifiedWorks
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: permission dalicc:noWarrantyNotice
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:sublicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode,
      dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:ShareAlike]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: permission odrl:grantUse
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, cc:ShareAlike, cc:SourceCode,
      dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:ShareAlike, dalicc:modificationNotice]
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: prohibition dalicc:addStatement
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: removed
    statement: prohibition dalicc:promote
    reason: Edited by hand; see the summary of this entry.
    source: manual
