id: LatexProjectPublicLicenseVersion13c
title: LaTeX Project Public License, Version 1.3c
current_version: 5
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 identification details and 4 permissions, removed
    2 prohibitions and recorded the review state.
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dct:source osl:LPPL-1.3c
    reason: 'Added LPPL-1.3c and the missing dct:source. Verified rather than assumed: cc:legalcode
      already points at the Open Source Initiative page that the SPDX entry lists under seeAlso, and
      the fetched text is version 1.3c.'
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: permission cc:DerivativeWorks
    reason: 'Clause 5 states: "If you are not the Current Maintainer of the Work, you may modify your
      copy of the Work, thus creating a Derived Work", and clause 6 then sets out how a Derived Work
      may be distributed. The record prohibited odrl:derive and cc:DerivativeWorks, so a compatibility
      check treated every LaTeX package fork as forbidden. Removed both and added the permissions
      with the duties of clause 6.'
    source: review-finding 3/odrl:prohibition
  - action: added
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'Clause 10(a) states: "A Derived Work may be distributed under a different license provided
      that license itself honors the conditions listed in Clause 6 above". That is dalicc:ChangeLicense
      with a dalicc:compliantLicense duty. Added.'
    source: review-finding 3/odrl:permission
