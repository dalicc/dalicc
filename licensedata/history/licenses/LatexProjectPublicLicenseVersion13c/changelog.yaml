      \ six months, and there are no other significant signs of active maintenance.\n\nYou can become\
      \ the Current Maintainer of the Work by agreement with any existing Current Maintainer to take\
      \ over this role.\n\nIf the Work is unmaintained, you can become the Current Maintainer of the\
      \ Work through the following steps:\n\n    Make a reasonable attempt to trace the Current Maintainer\
      \ (and the Copyright Holder, if the two differ) through the means of an Internet or similar\
      \ search.\n    If this search is successful, then enquire whether the Work is still maintained.\n\
      \        If it is being maintained, then ask the Current Maintainer to update their communication\
      \ data within one month.\n        If the search is unsuccessful or no action to resume active\
      \ maintenance is taken by the Current Maintainer, then announce within the pertinent community\
      \ your intention to take over maintenance. (If the Work is a LaTeX work, this could be done,\
      \ for example, by posting to comp.text.tex.)\n        If the Current Maintainer is reachable\
      \ and agrees to pass maintenance of the Work to you, then this takes effect immediately upon\
      \ announcement.\n        If the Current Maintainer is not reachable and the Copyright Holder\
      \ agrees that maintenance of the Work be passed to you, then this takes effect immediately upon\
      \ announcement.\n    If you make an `intention announcement' as described in 2b. above and after\
      \ three months your intention is challenged neither by the Current Maintainer nor by the Copyright\
      \ Holder nor by other people, then you may arrange for the Work to be changed so as to name\
      \ you as the (new) Current Maintainer.\n    If the previously unreachable Current Maintainer\
      \ becomes reachable once more within three months of a change completed under the terms of 3b)\
