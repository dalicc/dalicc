      to in writing will The Copyright Holder, or any author named in the components of the Work,
      or any other party who may distribute and/or modify the Work as permitted above, be liable to
      you for damages, including any general, special, incidental or consequential damages arising
      out of any use of the Work or out of inability to use the Work (including, but not limited to,
      loss of data, data being rendered inaccurate, or losses sustained by anyone as a result of any
      failure of the Work to operate with any other programs), even if the Copyright Holder or said
      author or said other party has been advised of the possibility of such damages."
    reason: Edited by hand; see the summary of this entry.
