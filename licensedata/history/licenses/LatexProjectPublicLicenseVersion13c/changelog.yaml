- version: 4
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'Four corrections the text supports. The cc:ShareAlike prohibition goes, because no sentence
    of the licence forbids a share-alike condition and clause 10(a) lets a Derived Work go under another
    licence that honours clause 6. Clause 6(d) is the dalicc:originalVersionOffer duty on modify and
    derive: "You distribute at least one of the following with the Derived Work: 1. A complete, unmodified
    copy of the Work ... 2. Information that is sufficient to obtain a complete, unmodified copy of
    the Work." The target gains dalicc:CreativeWork, because the licence governs "Any work being distributed
    under this License" and not only a program. The padding spaces inside dalicc:WarrantyOrLiabilityAcceptance
    are stripped and dct:title carries its language tag.'
  changes:
  - action: changed
    statement: "dalicc:WarrantyOrLiabilityAcceptance \"The Work has the status `author-maintained'\
      \ if the Copyright Holder explicitly and prominently states near the primary copyright notice\
      \ in the Work that the Work can only be maintained by the Copyright Holder or simply that it\
      \ is `author-maintained'.\n\nThe Work has the status `maintained' if there is a Current Maintainer\
      \ who has indicated in the Work that they are willing to receive error reports for the Work\
      \ (for example, by supplying a valid e-mail address). It is not required for the Current Maintainer\
      \ to acknowledge or act upon these error reports.\n\nThe Work changes from status `maintained'\
      \ to `unmaintained' if there is no Current Maintainer, or the person stated to be Current Maintainer\
      \ of the work cannot be reached through the indicated means of communication for a period of\
      \ six months, and there are no other significant signs of active maintenance.\n\nYou can become\
      \ the Current Maintainer of the Work by agreement with any existing Current Maintainer to take\
      \ over this role.\n\nIf the Work is unmaintained, you can become the Current Maintainer of the\
      \ Work through the following steps:\n\n    Make a reasonable attempt to trace the Current Maintainer\
      \ (and the Copyright Holder, if the two differ) through the means of an Internet or similar\
      \ search.\n    If this search is successful, then enquire whether the Work is still maintained.\n\
      \        If it is being maintained, then ask the Current Maintainer to update their communication\
      \ data within one month.\n        If the search is unsuccessful or no action to resume active\
      \ maintenance is taken by the Current Maintainer, then announce within the pertinent community\
      \ your intention to take over maintenance. (If the Work is a LaTeX work, this could be done,\
      \ for example, by posting to comp.text.tex.)\n        If the Current Maintainer is reachable\
      \ and agrees to pass maintenance of the Work to you, then this takes effect immediately upon\
      \ announcement.\n        If the Current Maintainer is not reachable and the Copyright Holder\
      \ agrees that maintenance of the Work be passed to you, then this takes effect immediately upon\
      \ announcement.\n    If you make an `intention announcement' as described in 2b. above and after\
      \ three months your intention is challenged neither by the Current Maintainer nor by the Copyright\
      \ Holder nor by other people, then you may arrange for the Work to be changed so as to name\
      \ you as the (new) Current Maintainer.\n    If the previously unreachable Current Maintainer\
      \ becomes reachable once more within three months of a change completed under the terms of 3b)\
      \ or 4), then that Current Maintainer must become or remain the Current Maintainer upon request\
      \ provided they then update their communication data within one month.\n\nA change in the Current\
      \ Maintainer does not, of itself, alter the fact that the Work is distributed under the LPPL\
      \ license.\n\nIf you become the Current Maintainer of the Work, you should immediately provide,\
      \ within the Work, a prominent and unambiguous statement of your status as Current Maintainer.\
      \ You should also announce your new status to the same pertinent community as in 2b) above.\""
    previous: "dalicc:WarrantyOrLiabilityAcceptance \" The Work has the status `author-maintained'\
      \ if the Copyright Holder explicitly and prominently states near the primary copyright notice\
      \ in the Work that the Work can only be maintained by the Copyright Holder or simply that it\
      \ is `author-maintained'.\n\nThe Work has the status `maintained' if there is a Current Maintainer\
