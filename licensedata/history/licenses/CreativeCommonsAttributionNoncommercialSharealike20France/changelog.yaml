id: CreativeCommonsAttributionNoncommercialSharealike20France
title: Creative Commons Attribution-NonCommercial-ShareAlike 2.0 France
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 2 identification details and 1 prohibition, changed
    1 asset target, recorded the relation to the record this one was adapted from and recorded the
    review state. Later changes left endorsement to the default rule of the core dependency graph,
    recorded which sentence of the text each statement rests on, recorded when the license ends on
    a breach and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "2.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc-sa/2.0/fr/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc-sa/2.0/fr/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in its
      own words, so the asset type is text supported rather than merely plausible. Article 3(e) grants
      a database right outright: "lorsque l''Oeuvre est une base de donnees, extraire et reutiliser
      des parties substantielles de l''Oeuvre". The preamble also names the "droits des producteurs
      de bases de donnees" among the rights protecting the work. Added dcmitype:Dataset.'
    source: review-finding 2/odrl:target
  - action: added
    statement: spdx:licenseId "CC-BY-NC-SA-2.0-FR"
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nc-sa/2.0/fr/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: duty cc:ShareAlike
    previous: duty cc:ShareAlike
    reason: 'The statement now quotes the sentence of the licence text it rests on: "L''Acceptant
      peut reproduire, distribuer, représenter ou communiquer au public une Oeuvre dite Dérivée y
      compris par voie numérique uniquement sous les termes de ce Contrat, ou d''une version ultérieure
      de ce Contrat comprenant les mêmes Options du Contrat que le présent Contrat, ou un Contrat
      Creative Commons iCommons comprenant les mêmes Options du Contrat que le présent Contrat (par
      exemple Paternité - Pas d''Utilisation Commerciale - Partage Des Conditions Initiales A l''Identique
      2.0 Japon)."'
    source: manual
  - action: changed
    statement: permission dalicc:ModifiedWorks
    previous: permission dalicc:ModifiedWorks
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Les droits ci-dessus
      incluent le droit d''effectuer les modifications nécessaires techniquement à l''exercice des
      droits dans d''autres formats et procédés techniques."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Les droits ci-dessus
      incluent le droit d''effectuer les modifications nécessaires techniquement à l''exercice des
      droits dans d''autres formats et procédés techniques."'
    source: manual
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "L''Acceptant
      ne peut pas offrir ou imposer de conditions d''utilisation de l''Oeuvre qui altèrent ou restreignent
      les termes du présent Contrat ou l''exercice des droits qui y sont accordés au bénéficiaire."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Tout manquement aux termes du contrat par
      l''Acceptant entraîne la résiliation automatique du Contrat et la fin des droits qui en découlent."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
