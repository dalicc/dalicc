id: Motosoto
title: Motosoto License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense
    previous: permission dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Any Modifications
      that you create or to which you contribute may be distributed only under the terms of this License
      or a future version of this License released under Section 7."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "No right is granted
      to the trademarks of Licensor or any Contributor even if such marks are included in the Licensed
      Product."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
