    reason: Edited by hand; see the summary of this entry.
    source: manual
- version: 4
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: 'Weak-copyleft family alignment of 2026-09-15: the record said nothing about three clauses
    its text-modelled sibling MPL-2.0-no-copyleft-exception quotes. Section 2.1 grants the right to
    ''use, reproduce, make available, modify, display, perform, distribute, and otherwise exploit
    its Contributions'', which is the derivative-works permission; section 3.2(a) lets the distributor
    pass on the source ''at a charge no more than the cost of distribution to the recipient'', which
    is the distribution fee; and section 3.2(b) lets the distributor ''distribute such Executable
    Form under the terms of this License, or sublicense it under different terms'', which is the sublicensing
    permission.'
  changes:
  - action: added
    statement: permission cc:DerivativeWorks
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: Edited by hand; see the summary of this entry.
    source: manual
  - action: added
    statement: permission dalicc:sublicense
    reason: Edited by hand; see the summary of this entry.
    source: manual
