  - action: added
    statement: dalicc:curePeriod "30 days"
    reason: 'The licence incorporates the terms of the GNU General Public License version 3, and the
      record now states what those sections say. Section 8: "Any attempt otherwise to propagate or
      modify it is void, and will automatically terminate your rights under this License", with reinstatement
      if "you cure the violation prior to 30 days after your receipt of the notice". Section 11: "Each
      contributor grants you a non-exclusive, worldwide, royalty-free patent license under the contributor''s
      essential patent claims".'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The licence incorporates the terms of the GNU General Public License version 3, and the
      record now states what those sections say. Section 8: "Any attempt otherwise to propagate or
      modify it is void, and will automatically terminate your rights under this License", with reinstatement
      if "you cure the violation prior to 30 days after your receipt of the notice". Section 11: "Each
      contributor grants you a non-exclusive, worldwide, royalty-free patent license under the contributor''s
      essential patent claims".'
    source: manual
  - action: added
    statement: permission dalicc:patentGrant
    reason: 'The licence incorporates the terms of the GNU General Public License version 3, and the
