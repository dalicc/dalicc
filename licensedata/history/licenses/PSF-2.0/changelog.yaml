id: PSF-2.0
title: Python Software Foundation License 2.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this License Agreement, PSF hereby grants Licensee a nonexclusive, royalty-free,
      world-wide license to reproduce, analyze, test, perform and/or display publicly, prepare derivative
      works, distribute, and otherwise use Python alone or in any derivative version, provided, however,
      that PSF''s License Agreement and PSF''s notice of copyright, i.e., "Copyright (c) 2001, 2002,
      2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018,
      2019 Python Software Foundation; All Rights Reserved" are retained in Python alone or in any
      derivative version prepared by Licensee."'
    source: manual
  - action: changed
    statement: permission odrl:present
    previous: permission odrl:present
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Subject to the
      terms and conditions of this License Agreement, PSF hereby grants Licensee a nonexclusive, royalty-free,
      world-wide license to reproduce, analyze, test, perform and/or display publicly, prepare derivative
      works, distribute, and otherwise use Python alone or in any derivative version, provided, however,
      that PSF''s License Agreement and PSF''s notice of copyright, i.e., "Copyright (c) 2001, 2002,
      2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018,
      2019 Python Software Foundation; All Rights Reserved" are retained in Python alone or in any
      derivative version prepared by Licensee."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "This License
      Agreement does not grant permission to use PSF trademarks or trade name in a trademark sense
      to endorse or promote products or services of Licensee, or any third party."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
