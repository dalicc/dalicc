id: CreativeCommonsAttributionSharealike30Estonia
title: Creative Commons Attribution-ShareAlike 3.0 Estonia
current_version: 2
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, changed
    4 alternative titles and 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-SA-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 EE"
    previous: dct:alternative "CC BY SA 3.0 ee"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 EE"
    previous: dct:alternative "CC BY-SA 3.0 ee"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 EE"
    previous: dct:alternative "CC-BY-SA 3.0 ee"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 EE"
    previous: dct:alternative "Creative Commons BY-SA 3.0 ee"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/ee/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/ee/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in its
      own words, so the asset type is text supported rather than merely plausible. The Estonian port
      is explicit twice over. Section 1 counts a database inside the licensed work: "Litsentsi tahenduses
      on Teoseks ka Teose esitus, fonogramm, raadio- ja televisioonisaade, filmi esmasalvestus ja
      andmebaas selles ulatuses, millises see on kaitstud Eesti autorioiguse seadusega." Section 3
      then disposes of the sui generis right: "Kui Litsentsiandja omab Eesti autorioiguse seaduse
      kohaselt, millega on Eesti oiguskorda ule voetud Euroopa Parlamendi ja noukogu direktiiv 96/9/EU,
      11. marts 1996, andmebaaside oiguskaitse kohta, sui generis andmebaasi tegija oigusi, loobub
      Litsentsiandja kaesolevaga sellistest oigustest." Section 4(e) adds that the restrictions of
      4(a) to 4(d) do not apply to those database maker rights so far as Estonian law allows them
      to be limited. Added dcmitype:Dataset.'
    source: review-finding 2/odrl:target
