id: Apache-1.1
title: Apache License, Version 1.1
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 changed 2 permissions, recorded the relation to the record
    this one was adapted from and recorded the review state. Later changes brought it in line with
    its family and its text in the verification of 2026-09-15, recorded which sentence of the text
    each statement rests on and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, dalicc:modificationNotice]
    reason: 'Clause 1 reads: "Redistributions of source code must retain the above copyright notice,
      this list of conditions and the following disclaimer", and the whole condition block is introduced
      by "Redistribution and use in source and binary forms, with or without modification, are permitted
      provided that the following conditions are met". The cc:Notice duty was on odrl:distribute only.
      Added it to odrl:modify and odrl:derive.'
    source: review-finding 5/odrl:duty
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice,
      dalicc:rename]
    previous: permission odrl:modify with duties [cc:Attribution, dalicc:modificationNotice, dalicc:rename]
    reason: 'Clause 1 reads: "Redistributions of source code must retain the above copyright notice,
      this list of conditions and the following disclaimer", and the whole condition block is introduced
      by "Redistribution and use in source and binary forms, with or without modification, are permitted
      provided that the following conditions are met". The cc:Notice duty was on odrl:distribute only.
      Added it to odrl:modify and odrl:derive.'
    source: review-finding 5/odrl:duty
  - action: changed
    statement: cc:attributionName "The Apache Software Foundation"
    previous: cc:attributionName " The Apache Software Foundation"
    reason: 'The review''s finding on family consistency: cc:attributionName and dct:publisher both
      began with a space.'
    source: manual
  - action: changed
    statement: dct:publisher "The Apache Software Foundation"
    previous: dct:publisher " The Apache Software Foundation"
    reason: 'The review''s finding on family consistency: cc:attributionName and dct:publisher both
      began with a space.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: Its duty cc:Notice quotes "Redistributions of source code must retain the above copyright
      notice, this list of conditions and the following disclaimer."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: Its duty cc:Notice quotes "Redistributions of source code must retain the above copyright
      notice, this list of conditions and the following disclaimer."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice,
      dalicc:rename]
    previous: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice,
      dalicc:rename]
    reason: Its duty cc:Notice quotes "Redistributions of source code must retain the above copyright
      notice, this list of conditions and the following disclaimer."
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
