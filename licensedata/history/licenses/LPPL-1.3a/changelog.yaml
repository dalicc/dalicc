id: LPPL-1.3a
title: LaTeX Project Public License, Version 1.3a
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 left endorsement to the default rule of the core dependency
    graph, recorded which sentence of the text each statement rests on and named the license the record
    itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "A Derived Work
      may be distributed under a different license provided that license itself honors the conditions
      listed in Clause 6 above, in regard to the Work, though it does not have to honor the rest of
      the conditions in this license."'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Notice, cc:SourceCode]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may distribute
      a complete, unmodified copy of the Work as you received it."'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may distribute
      a complete, unmodified copy of the Work as you received it."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
