id: CC-BY-ND-3.0
title: Creative Commons Attribution-NoDerivatives 3.0 Unported
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: prohibition dalicc:ChangeLicense
    previous: prohibition dalicc:ChangeLicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may Distribute
      or Publicly Perform the Work only under the terms of this License."'
    source: manual
  - action: changed
    statement: prohibition dalicc:moralRightsRestriction
    previous: prohibition dalicc:moralRightsRestriction
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Except as otherwise
      agreed in writing by the Licensor or as may be otherwise permitted by applicable law, if You
      Reproduce, Distribute or Publicly Perform the Work either by itself or as part of any Collections,
      You must not distort, mutilate, modify or take other derogatory action in relation to the Work
      which would be prejudicial to the Original Author''s honor or reputation."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "For the avoidance
      of doubt, You may only use the credit required by this Section for the purpose of attribution
      in the manner set out above and, by exercising Your rights under this License, You may not implicitly
      or explicitly assert or imply any connection with, sponsorship or endorsement by the Original
      Author, Licensor and/or Attribution Parties, as appropriate, of You or Your use of the Work,
      without the separate, express prior written permission of the Original Author, Licensor and/or
      Attribution Parties."'
    source: manual
  - action: changed
    statement: prohibition dalicc:sublicense
    previous: prohibition dalicc:sublicense
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may not sublicense
      the Work."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
