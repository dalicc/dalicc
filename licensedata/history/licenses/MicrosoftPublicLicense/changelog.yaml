id: MicrosoftPublicLicense
title: Microsoft Public License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 clause text and 1 identification detail and recorded
    the review state. Later changes brought it in line with its family and its text in the verification
    of 2026-09-15, recorded which sentence of the text each statement rests on and named the license
    the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:WarrantyDisclaimer "(E) The software is licensed \"as-is.\" You bear the risk
      of using it. The contributors give no express warranties, guarantees, or conditions. You may
      have additional consumer rights under your local laws which this license cannot change. To the
      extent permitted under your local laws, the contributors exclude the implied warranties of merchantability,
      fitness for a particular purpose and non-infringement."
    reason: Condition 3(E) is a warranty disclaimer and was not recorded. Added, quoted.
    source: review-finding 6/dalicc:WarrantyDisclaimer
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: spdx:licenseId "MS-PL"
    reason: Added MS-PL; the title matches the SPDX name exactly.
    source: review-finding 1/spdx:licenseId
  - action: changed
    statement: dct:publisher "Microsoft"
    previous: dct:publisher "N.N."
    reason: 'The review''s finding on family consistency: dct:publisher was the placeholder ''N.N.''
      and the record made no patent statement although section 2(B) grants ''a non-exclusive, worldwide,
      royalty-free license under its licensed patents'' and section 3(B) ends that grant on a patent
      claim, exactly as the new MS-RL record models them.'
    source: manual
  - action: added
    statement: permission dalicc:patentGrant
    reason: 'The review''s finding on family consistency: dct:publisher was the placeholder ''N.N.''
      and the record made no patent statement although section 2(B) grants ''a non-exclusive, worldwide,
      royalty-free license under its licensed patents'' and section 3(B) ends that grant on a patent
      claim, exactly as the new MS-RL record models them.'
    source: manual
  - action: added
    statement: prohibition dalicc:patentRetaliationTermination
    reason: 'The review''s finding on family consistency: dct:publisher was the placeholder ''N.N.''
      and the record made no patent statement although section 2(B) grants ''a non-exclusive, worldwide,
      royalty-free license under its licensed patents'' and section 3(B) ends that grant on a patent
      claim, exactly as the new MS-RL record models them.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    previous: permission dalicc:ChangeLicense with duties [dalicc:compliantLicense]
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words. Its duty dalicc:compliantLicense is
      marked as a library convention, family rule 15: Permissive records permit relicensing.'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Conditions and
      Limitations (A) No Trademark License- This license does not grant you rights to use any contributors''
      name, logo, or trademarks."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
