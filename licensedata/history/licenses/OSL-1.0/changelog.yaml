id: OSL-1.0
title: Open Software License 1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission dalicc:patentGrant
    previous: permission dalicc:patentGrant
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Licensor hereby
      grants You a world-wide, royalty-free, non-exclusive, perpetual, non-sublicenseable license,
      under patent claims owned or controlled by the Licensor that are embodied in the Original Work
      as furnished by the Licensor (“Licensed Claims”) to make, use, sell and offer for sale the Original
      Work."'
    source: manual
  - action: changed
    statement: permission odrl:derive with duties [cc:Notice]
    previous: permission odrl:derive with duties [cc:Notice]
    reason: 'Its duty cc:Notice quotes "Licensor hereby grants You a world-wide, royalty-free, non-exclusive,
      perpetual, non-sublicenseable license to do the following: a) to reproduce the Original Work
      in copies; b) to prepare derivative works (“Derivative Works”) based upon the Original Work;
      c) to distribute copies of the Original Work and Derivative Works to the public, with the proviso
      that copies of Original Work or Derivative Works that You distribute shall be licensed under
      the Open Software License; d) to perform the Original Work publicly; and e) to display the Original
      Work publicly."'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice, cc:SourceCode]
    previous: permission odrl:distribute with duties [cc:Notice, cc:SourceCode]
    reason: 'Its duty cc:Notice quotes "Licensor hereby grants You a world-wide, royalty-free, non-exclusive,
      perpetual, non-sublicenseable license to do the following: a) to reproduce the Original Work
      in copies; b) to prepare derivative works (“Derivative Works”) based upon the Original Work;
      c) to distribute copies of the Original Work and Derivative Works to the public, with the proviso
      that copies of Original Work or Derivative Works that You distribute shall be licensed under
      the Open Software License; d) to perform the Original Work publicly; and e) to display the Original
      Work publicly."'
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Notice]
    previous: permission odrl:modify with duties [cc:Notice]
    reason: 'Its duty cc:Notice quotes "Licensor hereby grants You a world-wide, royalty-free, non-exclusive,
      perpetual, non-sublicenseable license to do the following: a) to reproduce the Original Work
      in copies; b) to prepare derivative works (“Derivative Works”) based upon the Original Work;
      c) to distribute copies of the Original Work and Derivative Works to the public, with the proviso
      that copies of Original Work or Derivative Works that You distribute shall be licensed under
      the Open Software License; d) to perform the Original Work publicly; and e) to display the Original
      Work publicly."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
