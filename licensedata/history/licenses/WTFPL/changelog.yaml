id: WTFPL
title: WTFPL
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 permission and recorded
    the review state. Later changes brought it in line with its family and its text in the verification
    of 2026-09-15, recorded which sentence of the text each statement rests on and named the license
    the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: permission odrl:grantUse
    reason: Added odrl:grantUse. Term 0 grants everything without reservation, and passing the rights
      on to a third party is part of "what the fuck you want to".
    source: review-finding 3/odrl:permission
  - action: added
    statement: spdx:licenseId "WTFPL"
    reason: Added the SPDX list id WTFPL.
    source: review-finding 1/spdx:licenseId
  - action: removed
    statement: dct:publisher "N.N."
    reason: 'Library convention 14: dct:publisher was the placeholder ''N.N.''; the text names Sam
      Hocevar as the author of the licence, not a steward of it, so the predicate is left out.'
    source: manual
  - action: changed
    statement: permission dalicc:ChangeLicense
    previous: permission dalicc:ChangeLicense
    reason: 'The statement is marked as a library convention, family rule 15: Permissive records permit
      relicensing: the text does not state it in as many words.'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
