id: BUSL-1.1
title: Business Source License 1.1
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:derive with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "You must conspicuously display this License on each original
      or modified copy of the Licensed Work." Its duty cc:ShareAlike quotes "All copies of the original
      and modified Licensed Work, and derivative works of the Licensed Work, are subject to this License."
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:distribute with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "You must conspicuously display this License on each original
      or modified copy of the Licensed Work." Its duty cc:ShareAlike quotes "All copies of the original
      and modified Licensed Work, and derivative works of the Licensed Work, are subject to this License."
    source: manual
  - action: changed
    statement: permission odrl:modify with duties [cc:Notice, cc:ShareAlike]
    previous: permission odrl:modify with duties [cc:Notice, cc:ShareAlike]
    reason: Its duty cc:Notice quotes "You must conspicuously display this License on each original
      or modified copy of the Licensed Work." Its duty cc:ShareAlike quotes "All copies of the original
      and modified Licensed Work, and derivative works of the Licensed Work, are subject to this License."
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The Licensor
      hereby grants you the right to copy, modify, create derivative works, redistribute, and make
      non-production use of the Licensed Work."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "This License
      does not grant you any right in any trademark or logo of Licensor or its affiliates (provided
      that you may use a trademark or logo of Licensor as expressly required by this License)."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
