id: GPL-2.0-only
title: GNU General Public License, Version 2
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail, 1 permission and 1 statement,
    recorded the relation to the record this one was adapted from and recorded the review state. Later
    changes brought it in line with its family and its text in the verification of 2026-09-15, corrected
    it against its text on 2026-09-23, left endorsement to the default rule of the core dependency
    graph, recorded which sentence of the text each statement rests on and named the license the record
    itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  changes:
  - action: added
    statement: dalicc:licenseVersion "2.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:orLaterVersionOption "false"^^xsd:boolean
    reason: 'Review decision 6: the four GNU records model the ''-only'' reading, so the or-later
      option is recorded as false rather than left unsaid.'
    source: consolidation-decision 6
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: 'Section 1 states: "You may charge a fee for the physical act of transferring a copy,
      and you may at your option offer warranty protection in exchange for a fee." The record did
      not permit dalicc:chargeDistributionFee, so a compatibility check would treat paid redistribution
      as unlicensed. Added.'
    source: review-finding 3/odrl:permission
  - action: added
    statement: spdx:licenseId "GPL-2.0-only"
    reason: The record carried no SPDX identifier although its own id is the SPDX list id. Added the
      non deprecated id GPL-2.0-only.
    source: review-finding 1/spdx:licenseId
  - action: changed
    statement: dalicc:LiabilityLimitation "IN NO EVENT UNLESS REQUIRED BY APPLICABLE LAW OR AGREED
      TO IN WRITING WILL ANY COPYRIGHT HOLDER, OR ANY OTHER PARTY WHO MAY MODIFY AND/OR REDISTRIBUTE
      THE PROGRAM AS PERMITTED ABOVE, BE LIABLE TO YOU FOR DAMAGES, INCLUDING ANY GENERAL, SPECIAL,
      INCIDENTAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF THE USE OR INABILITY TO USE THE PROGRAM (INCLUDING
      BUT NOT LIMITED TO LOSS OF DATA OR DATA BEING RENDERED INACCURATE OR LOSSES SUSTAINED BY YOU
      OR THIRD PARTIES OR A FAILURE OF THE PROGRAM TO OPERATE WITH ANY OTHER PROGRAMS), EVEN IF SUCH
      HOLDER OR OTHER PARTY HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES."
    previous: dalicc:LiabilityLimitation " IN NO EVENT UNLESS REQUIRED BY APPLICABLE LAW OR AGREED
      TO IN WRITING WILL ANY COPYRIGHT HOLDER, OR ANY OTHER PARTY WHO MAY MODIFY AND/OR REDISTRIBUTE
      THE PROGRAM AS PERMITTED ABOVE, BE LIABLE TO YOU FOR DAMAGES, INCLUDING ANY GENERAL, SPECIAL,
      INCIDENTAL OR CONSEQUENTIAL DAMAGES ARISING OUT OF THE USE OR INABILITY TO USE THE PROGRAM (INCLUDING
      BUT NOT LIMITED TO LOSS OF DATA OR DATA BEING RENDERED INACCURATE OR LOSSES SUSTAINED BY YOU
      OR THIRD PARTIES OR A FAILURE OF THE PROGRAM TO OPERATE WITH ANY OTHER PROGRAMS), EVEN IF SUCH
      HOLDER OR OTHER PARTY HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES. "
    reason: 'The review''s finding on family consistency: both clause literals began and ended with
      a space, and the record did not carry section 1 of the text, ''You may charge a fee for the
      physical act of transferring a copy, and you may at your option offer warranty protection in
      exchange for a fee'', which the two new LGPL 2.x records carry as dalicc:WarrantyOrLiabilityAcceptance.'
    source: manual
  - action: changed
    statement: dalicc:WarrantyDisclaimer "BECAUSE THE PROGRAM IS LICENSED FREE OF CHARGE, THERE IS
      NO WARRANTY FOR THE PROGRAM, TO THE EXTENT PERMITTED BY APPLICABLE LAW. EXCEPT WHEN OTHERWISE
      STATED IN WRITING THE COPYRIGHT HOLDERS AND/OR OTHER PARTIES PROVIDE THE PROGRAM \"AS IS\" WITHOUT
      WARRANTY OF ANY KIND, EITHER EXPRESSED OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED
      WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE. THE ENTIRE RISK AS TO THE
      QUALITY AND PERFORMANCE OF THE PROGRAM IS WITH YOU. SHOULD THE PROGRAM PROVE DEFECTIVE, YOU
      ASSUME THE COST OF ALL NECESSARY SERVICING, REPAIR OR CORRECTION."
    previous: dalicc:WarrantyDisclaimer " BECAUSE THE PROGRAM IS LICENSED FREE OF CHARGE, THERE IS
      NO WARRANTY FOR THE PROGRAM, TO THE EXTENT PERMITTED BY APPLICABLE LAW. EXCEPT WHEN OTHERWISE
      STATED IN WRITING THE COPYRIGHT HOLDERS AND/OR OTHER PARTIES PROVIDE THE PROGRAM \"AS IS\" WITHOUT
      WARRANTY OF ANY KIND, EITHER EXPRESSED OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED
      WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE. THE ENTIRE RISK AS TO THE
      QUALITY AND PERFORMANCE OF THE PROGRAM IS WITH YOU. SHOULD THE PROGRAM PROVE DEFECTIVE, YOU
      ASSUME THE COST OF ALL NECESSARY SERVICING, REPAIR OR CORRECTION. "
    reason: 'The review''s finding on family consistency: both clause literals began and ended with
      a space, and the record did not carry section 1 of the text, ''You may charge a fee for the
      physical act of transferring a copy, and you may at your option offer warranty protection in
      exchange for a fee'', which the two new LGPL 2.x records carry as dalicc:WarrantyOrLiabilityAcceptance.'
    source: manual
  - action: added
    statement: dalicc:WarrantyOrLiabilityAcceptance "You may charge a fee for the physical act of
      transferring a copy, and you may at your option offer warranty protection in exchange for a
      fee."
    reason: 'The review''s finding on family consistency: both clause literals began and ended with
      a space, and the record did not carry section 1 of the text, ''You may charge a fee for the
      physical act of transferring a copy, and you may at your option offer warranty protection in
      exchange for a fee'', which the two new LGPL 2.x records carry as dalicc:WarrantyOrLiabilityAcceptance.'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The licence ends on breach and the record now says so. Section 4: "Any attempt otherwise
      to copy, modify, sublicense or distribute the Program is void, and will automatically terminate
      your rights under this License." LGPL-2.1-only already carried the flag on the same sentence
      of its own section 8.'
    source: manual
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:chargeDistributionFee
    previous: permission dalicc:chargeDistributionFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may charge
      a fee for the physical act of transferring a copy, and you may at your option offer warranty
      protection in exchange for a fee."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
