id: RPSL-1.0
title: RealNetworks Public Source License v1.0
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: duty cc:ShareAlike
    previous: duty cc:ShareAlike
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You must cause
      any Derivative Work that you distribute, publish or Externally Deploy ... to be licensed as
      a whole at no charge to all third parties under the terms of this License and no other license
      except as provided in Section 4.2"'
    source: manual
  - action: changed
    statement: prohibition dalicc:addLimitation
    previous: prohibition dalicc:addLimitation
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You must include
      a copy of this License with every copy of Source Code of Covered Code and documentation You
      distribute, and You may not offer or impose any terms on such Source Code that alter or restrict
      this License or the recipients'' rights hereunder, except as permitted under Section 6;"'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "No Licensor Marks
      may be used to endorse or promote products derived from the Original Code other than as permitted
      by the Licensor Trademark Policy defined in Exhibit C."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
