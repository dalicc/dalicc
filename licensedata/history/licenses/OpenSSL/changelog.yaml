id: OpenSSL
title: OpenSSL License
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The changes since version 1 recorded which sentence of the text each statement rests on
    and named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  changes:
  - action: changed
    statement: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:rename]
    previous: permission odrl:derive with duties [cc:Attribution, cc:Notice, dalicc:rename]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "Products derived
      from this software may not be called "OpenSSL" nor may "OpenSSL" appear in their names without
      prior written permission of the OpenSSL Project."'
    source: manual
  - action: changed
    statement: prohibition dalicc:promote
    previous: prohibition dalicc:promote
    reason: 'The statement now quotes the sentence of the licence text it rests on: "The names "OpenSSL
      Toolkit" and "OpenSSL Project" must not be used to endorse or promote products derived from
      this software without prior written permission."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
