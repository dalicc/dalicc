    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:alternative "CC BY SA 3.0 GE"
    previous: dct:alternative "CC BY SA 3.0 ge"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC BY-SA 3.0 GE"
    previous: dct:alternative "CC BY-SA 3.0 ge"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "CC-BY-SA 3.0 GE"
    previous: dct:alternative "CC-BY-SA 3.0 ge"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: changed
    statement: dct:alternative "Creative Commons BY-SA 3.0 GE"
    previous: dct:alternative "Creative Commons BY-SA 3.0 ge"
    reason: 'Review decision 16: the ISO country code in the alternative title is upper case.'
    source: consolidation-decision 16
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-sa/3.0/ge/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of the port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/ge/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: 'The record targeted dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-SA-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port names a database as licensed subject
      matter in its own text: clause 1 defines the "Object" as a work of literature, science or art
      and/or a performance, phonogram, videogram, broadcast and/or a database as protected by the
      Georgian law on copyright and neighbouring rights, and clause 1 counts the maker of a database
      among the "Authors". Clause 3 adds that where national law recognises sui generis database rights
      of the Licensor, the Licensor waives them, and clause 4 exempts parts that are covered only
      by those rights from the restrictions. Since the text is explicit, dcmitype:Dataset was added
      here rather than left to the library wide decision that covers the ports whose text says nothing
      about databases.'
    source: review-finding 2/odrl:target
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "წინამდებარე ლიცენზია და უფლებები და ვალდებულებები
      შეწყდება ავტომატურად ლიცენზიატის მიერ ლიცენზიის ნებისმიერი პირობების დარღვევის შემთხვევაში."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
