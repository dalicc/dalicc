id: CreativeCommonsAttributionSharealike30Georgia
title: Creative Commons Attribution-ShareAlike 3.0 Georgia
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 clause text, 1 identification detail and 1 prohibition,
    removed 1 clause text, changed 4 alternative titles and 1 asset target, recorded the relation
    to the record this one was adapted from and recorded the review state. Later changes left endorsement
    to the default rule of the core dependency graph, recorded when the license ends on a breach and
    named the license the record itself is published under.
  squashed_from:
  - 2
  - 3
  - 4
  changes:
  - action: removed
    statement: "dalicc:WarrantyDisclaimer \"ლიცენზიარი გარანტიას იძლევა იმაზე, რომ ობიექტი ორიგინალურია,\
      \ შემქმნელს ეკუთვნის სრული საკუთრების უფლება ობიექტზე და არავის არ აქვს პრეტენზია იმაზე, რომ\
      \ ობიექტზე მითითებულ შემქმნელს შეუძლია განაცხადოს თავისი ავტორობა, და წინამდებარე ლიცენზიით\
      \ გათვალისწინებული უფლებები არ არის საზიარო და არავისზე არ არის გადაცემული.\n \n ლიცენზიარი\
      \ ათავისუფლებს ლიცენზიატს პასუხისმგებლობისაგან, რომელიც შეიძლება დადგეს წინამდებარე ლიცენზიით\
      \ გათვალისწინებული პირობებით ობიექტზე უფლებებისა და მათ გამოყენების საგანზე მესამე პირების მხრიდან\
      \ პრეტენზიის წარდგენის შემთხვევაში.\n\""
    reason: 'Review decision 14: section 5 of the Georgian port warrants rather than disclaims, so
      the clause moved to the additional clauses.'
    source: consolidation-decision 14
  - action: added
    statement: "dalicc:additionalClauses \"ლიცენზიარი გარანტიას იძლევა იმაზე, რომ ობიექტი ორიგინალურია,\
      \ შემქმნელს ეკუთვნის სრული საკუთრების უფლება ობიექტზე და არავის არ აქვს პრეტენზია იმაზე, რომ\
      \ ობიექტზე მითითებულ შემქმნელს შეუძლია განაცხადოს თავისი ავტორობა, და წინამდებარე ლიცენზიით\
      \ გათვალისწინებული უფლებები არ არის საზიარო და არავისზე არ არის გადაცემული.\n \n ლიცენზიარი\
      \ ათავისუფლებს ლიცენზიატს პასუხისმგებლობისაგან, რომელიც შეიძლება დადგეს წინამდებარე ლიცენზიით\
      \ გათვალისწინებული პირობებით ობიექტზე უფლებებისა და მათ გამოყენების საგანზე მესამე პირების მხრიდან\
      \ პრეტენზიის წარდგენის შემთხვევაში.\n\""
    reason: 'Review decision 14: section 5 of the Georgian port warrants rather than disclaims, so
      the clause moved to the additional clauses.'
    source: consolidation-decision 14
