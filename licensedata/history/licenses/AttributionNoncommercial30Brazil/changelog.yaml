id: AttributionNoncommercial30Brazil
title: Creative Commons Attribution-NonCommercial 3.0 Brazil
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, recorded
    the relation to the record this one was adapted from and recorded the review state. Later changes
    recorded which sentence of the text each statement rests on, recorded when the license ends on
    a breach, named the license the record itself is published under and removed the quotes that do
    not name the act they support.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-NC-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nc/3.0/br/>
    reason: The record carried cc:legalcode but no dct:source. The legal code page of this port states
      the canonical URL of the licence, https://creativecommons.org/licenses/by-nc/3.0/br/, and the
      six 4.0 International parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede a Você uma licença de abrangência mundial, sem royalties, não-exclusiva, perpétua (pela
      duração do direito autoral aplicável), sujeita aos termos e condições desta Licença, para exercer
      os direitos sobre a Obra definidos abaixo:"'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede a Você uma licença de abrangência mundial, sem royalties, não-exclusiva, perpétua (pela
      duração do direito autoral aplicável), sujeita aos termos e condições desta Licença, para exercer
      os direitos sobre a Obra definidos abaixo:"'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'The statement now quotes the sentence of the licence text it rests on: "O Licenciante
      concede a Você uma licença de abrangência mundial, sem royalties, não-exclusiva, perpétua (pela
      duração do direito autoral aplicável), sujeita aos termos e condições desta Licença, para exercer
      os direitos sobre a Obra definidos abaixo:"'
    source: manual
  - action: changed
    statement: prohibition cc:CommercialUse
    previous: prohibition cc:CommercialUse
    reason: 'The statement now quotes the sentence of the licence text it rests on: "De modo a evitar
      dúvidas, Você apenas poderá fazer uso do crédito exigido por esta Seção para o propósito de
      atribuição na forma estabelecida acima e, ao exercer Seus direitos sob esta Licença, Você não
      poderá implícita ou explicitamente afirmar ou sugerir qualquer vínculo, patrocínio ou apoio
      do Autor Original, Titular de Direitos Conexos, Licenciante e/ou Partes de Atribuição, o que
      for cabível, por Você ou Seu uso da Obra, sem a prévia e expressa autorização do Autor Original,
      Titular de Direitos Conexos, Licenciante e/ou Partes de Atribuição."'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'The termination clause of this port reads: "Esta Licença e os direitos aqui concedidos
      terminarão automaticamente no caso de qualquer violação dos termos desta Licença por Você."'
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: changed
    statement: permission odrl:display
    previous: permission odrl:display
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce, prohibition cc:CommercialUse: the quoted sentence does not name the act. The
      statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    previous: permission odrl:distribute with duties [cc:Attribution, cc:Notice]
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce, prohibition cc:CommercialUse: the quoted sentence does not name the act. The
      statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: permission odrl:reproduce
    previous: permission odrl:reproduce
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce, prohibition cc:CommercialUse: the quoted sentence does not name the act. The
      statements stay, read from the text without a linked quote.'
    source: manual
  - action: changed
    statement: prohibition cc:CommercialUse
    previous: prohibition cc:CommercialUse
    reason: 'Removed the quoted evidence of permission odrl:display, permission odrl:distribute, permission
      odrl:reproduce, prohibition cc:CommercialUse: the quoted sentence does not name the act. The
      statements stay, read from the text without a linked quote.'
    source: manual
