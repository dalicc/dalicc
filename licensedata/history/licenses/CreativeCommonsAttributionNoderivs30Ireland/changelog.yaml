id: CreativeCommonsAttributionNoderivs30Ireland
title: Creative Commons Attribution-NoDerivatives 3.0 Ireland
current_version: 3
entries:
- version: 2
  date: '2026-09-15'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail and 1 prohibition, removed
    2 permissions, changed 1 asset target, recorded the relation to the record this one was adapted
    from and recorded the review state.
  changes:
  - action: added
    statement: dalicc:jurisdictionPortOf dalicclib:CC-BY-ND-4.0
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "jurisdiction-port"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dct:source <https://creativecommons.org/licenses/by-nd/3.0/ie/>
    reason: The record carried cc:legalcode but no dct:source. The legal-code page states the canonical
      URL of the licence, https://creativecommons.org/licenses/by-nd/3.0/ie/, and the six 4.0 International
      parents carry exactly that pair, legal code plus deed. Added.
    source: review-finding 1/dct:source
  - action: removed
    statement: permission dalicc:ModifiedWorks
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: removed
    statement: permission odrl:modify with duties [cc:Attribution, cc:Notice, dalicc:modificationNotice]
    reason: 'Review decision 2: a NoDerivatives license grants no right to modify, so the modification
      permissions and the duties hanging off them were removed and the prohibition on derivatives
      made explicit.'
    source: consolidation-decision 2
  - action: added
    statement: prohibition dalicc:sublicense
    reason: 'Review decision 1: every Creative Commons record except the CC0 dedication, plus the
      Open Database License and the Open Data Commons Attribution License, forbids sublicensing in
      as many words.'
    source: consolidation-decision 1
  - action: changed
    statement: target asset types [dalicc:CreativeWork, dcmitype:Dataset]
    previous: target asset types [dalicc:CreativeWork]
    reason: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-ND-4.0
      targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in terms.
      The licence notice states that the Work is protected by copyright, related rights and sui generis
      database right; the definition of Work says that "a Work shall also be taken to mean a live
      Performance or a database insofar as these are protected under the applicable law within Your
      jurisdiction"; the grant runs for the duration of the sui generis database right; section 3
      waives the licensor own database rights under the national law implementing Directive 96/9/EC;
      and section 4 carves the restrictions out of the parts that qualify only under that right. Since
      the text is explicit, dcmitype:Dataset was added, which also brings the record into line with
      its parent.
    source: review-finding 2/odrl:target
- version: 3
  date: '2026-09-23'
  reviewer: Giray Havur
  summary: 'The port settles the sui generis database right in its own text: the definition of Work
    says that "a Work shall also be taken to mean a live Performance or a database insofar as these
    are protected under the applicable law within Your jurisdiction", the grant runs for the duration
    of the sui generis database right, and section 3 waives the licensor own database rights under
    the national law implementing Directive 96/9/EC. dalicc:suiGenerisDatabaseRights is now permitted,
    and it carries no duty because section 4 carves the restrictions out of the parts that qualify
    only under that right.'
  changes:
  - action: added
    statement: permission dalicc:suiGenerisDatabaseRights
    reason: Edited by hand; see the summary of this entry.
    source: manual
