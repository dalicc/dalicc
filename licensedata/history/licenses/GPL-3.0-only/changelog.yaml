id: GPL-3.0-only
title: GNU General Public License 3
current_version: 2
entries:
- version: 2
  date: '2026-09-24'
  reviewer: Giray Havur
  summary: The content review of 2026-09-15 added 1 identification detail, 1 permission and 1 statement,
    changed 2 identification details, recorded the relation to the record this one was adapted from
    and recorded the review state. Later changes brought it in line with its family and its text in
    the verification of 2026-09-15, corrected it against its text on 2026-09-23 and 2026-09-24, left
    endorsement to the default rule of the core dependency graph, recorded which sentence of the text
    each statement rests on, named the license the record itself is published under and recorded the
    licenses a work under it may be released under.
  squashed_from:
  - 2
  - 3
  - 4
  - 5
  - 6
  changes:
  - action: changed
    statement: cc:legalcode <https://www.gnu.org/licenses/gpl-3.0.html>
    previous: cc:legalcode <https://www.gnu.org/licenses/gpl.html>
    reason: Added the SPDX list id GPL-3.0-only.
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: dalicc:licenseVersion "3.0"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: added
    statement: dalicc:orLaterVersionOption "false"^^xsd:boolean
    reason: 'Review decision 6: the four GNU records model the ''-only'' reading, so the or-later
      option is recorded as false rather than left unsaid.'
    source: consolidation-decision 6
  - action: added
    statement: dalicc:reviewStatus dalicc:Reviewed
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:reviewedOn "2026-09-15"^^xsd:date
    reason: Every record records how far it has come in the editorial workflow and when it was last
      checked against the legal text.
    source: review-state
  - action: added
    statement: dalicc:variantKind "version"
    reason: The 2026-09-15 review made the relation between a jurisdiction port and the record it
      was adapted from explicit in the data.
    source: ports-metadata
  - action: changed
    statement: dct:source <https://www.gnu.org/licenses/gpl-3.0.html>
    previous: dct:source <https://www.gnu.org/licenses/gpl.html>
    reason: Added the SPDX list id GPL-3.0-only.
    source: review-finding 1/spdx:licenseId
  - action: added
    statement: permission dalicc:chargeDistributionFee
    reason: 'Section 4 states: "You may charge any price or no price for each copy that you convey,
      and you may offer support or warranty protection for a fee." Added the missing dalicc:chargeDistributionFee
      permission.'
    source: review-finding 3/odrl:permission
  - action: added
    statement: spdx:licenseId "GPL-3.0-only"
    reason: Added the SPDX list id GPL-3.0-only.
    source: review-finding 1/spdx:licenseId
  - action: changed
    statement: dalicc:LiabilityLimitation "IN NO EVENT UNLESS REQUIRED BY APPLICABLE LAW OR AGREED
      TO IN WRITING WILL ANY COPYRIGHT HOLDER, OR ANY OTHER PARTY WHO MODIFIES AND/OR CONVEYS THE
      PROGRAM AS PERMITTED ABOVE, BE LIABLE TO YOU FOR DAMAGES, INCLUDING ANY GENERAL, SPECIAL, INCIDENTAL
      OR CONSEQUENTIAL DAMAGES ARISING OUT OF THE USE OR INABILITY TO USE THE PROGRAM (INCLUDING BUT
      NOT LIMITED TO LOSS OF DATA OR DATA BEING RENDERED INACCURATE OR LOSSES SUSTAINED BY YOU OR
      THIRD PARTIES OR A FAILURE OF THE PROGRAM TO OPERATE WITH ANY OTHER PROGRAMS), EVEN IF SUCH
      HOLDER OR OTHER PARTY HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES."
    previous: dalicc:LiabilityLimitation "N NO EVENT UNLESS REQUIRED BY APPLICABLE LAW OR AGREED TO
      IN WRITING WILL ANY COPYRIGHT HOLDER, OR ANY OTHER PARTY WHO MODIFIES AND/OR CONVEYS THE PROGRAM
      AS PERMITTED ABOVE, BE LIABLE TO YOU FOR DAMAGES, INCLUDING ANY GENERAL, SPECIAL, INCIDENTAL
      OR CONSEQUENTIAL DAMAGES ARISING OUT OF THE USE OR INABILITY TO USE THE PROGRAM (INCLUDING BUT
      NOT LIMITED TO LOSS OF DATA OR DATA BEING RENDERED INACCURATE OR LOSSES SUSTAINED BY YOU OR
      THIRD PARTIES OR A FAILURE OF THE PROGRAM TO OPERATE WITH ANY OTHER PROGRAMS), EVEN IF SUCH
      HOLDER OR OTHER PARTY HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES."
    reason: 'The review''s finding on family consistency: the record did not carry section 4 of the
      text, ''You may charge any price or no price for each copy that you convey, and you may offer
      support or warranty protection for a fee''. The liability literal also began ''N NO EVENT''
      because its first letter had been lost.'
    source: manual
  - action: added
    statement: dalicc:WarrantyOrLiabilityAcceptance "You may charge any price or no price for each
      copy that you convey, and you may offer support or warranty protection for a fee."
    reason: 'The review''s finding on family consistency: the record did not carry section 4 of the
      text, ''You may charge any price or no price for each copy that you convey, and you may offer
      support or warranty protection for a fee''. The liability literal also began ''N NO EVENT''
      because its first letter had been lost.'
    source: manual
  - action: added
    statement: dalicc:curePeriod "30 days"
    reason: 'Three statements the text makes and the record did not. Section 8: "Any attempt otherwise
      to propagate or modify it is void, and will automatically terminate your rights under this License",
      and the licence is reinstated if "you cure the violation prior to 30 days after your receipt
      of the notice". Section 11: "Each contributor grants you a non-exclusive, worldwide, royalty-free
      patent license under the contributor''s essential patent claims", which is dalicc:patentGrant.'
    source: manual
  - action: added
    statement: dalicc:terminatesOnBreach "true"^^xsd:boolean
    reason: 'Three statements the text makes and the record did not. Section 8: "Any attempt otherwise
      to propagate or modify it is void, and will automatically terminate your rights under this License",
      and the licence is reinstated if "you cure the violation prior to 30 days after your receipt
      of the notice". Section 11: "Each contributor grants you a non-exclusive, worldwide, royalty-free
      patent license under the contributor''s essential patent claims", which is dalicc:patentGrant.'
    source: manual
  - action: added
    statement: permission dalicc:patentGrant
    reason: 'Three statements the text makes and the record did not. Section 8: "Any attempt otherwise
      to propagate or modify it is void, and will automatically terminate your rights under this License",
      and the licence is reinstated if "you cure the violation prior to 30 days after your receipt
      of the notice". Section 11: "Each contributor grants you a non-exclusive, worldwide, royalty-free
      patent license under the contributor''s essential patent claims", which is dalicc:patentGrant.'
    source: manual
  - action: removed
    statement: prohibition dalicc:promote
    reason: The endorsement prohibition rested on no sentence of the text; the default rule for endorsement
      now supplies it.
    source: manual
  - action: changed
    statement: permission dalicc:chargeDistributionFee
    previous: permission dalicc:chargeDistributionFee
    reason: 'The statement now quotes the sentence of the licence text it rests on: "You may charge
      any price or no price for each copy that you convey, and you may offer support or warranty protection
      for a fee."'
    source: manual
  - action: changed
    statement: dalicc:WarrantyOrLiabilityAcceptance "you may offer support or warranty protection
      for a fee"
    previous: dalicc:WarrantyOrLiabilityAcceptance "You may charge any price or no price for each
      copy that you convey, and you may offer support or warranty protection for a fee."
    reason: The first half of the Section 4 sentence, "You may charge any price or no price for each
      copy that you convey", is the permission to charge for a copy, not a warranty clause.
    source: manual
  - action: added
    statement: dct:license <https://creativecommons.org/licenses/by/4.0/>
    reason: Every record is published under CC BY 4.0. cc:license names the record DALICC keeps of
      that licence; dct:license now names it by the address Creative Commons publishes it at, so that
      a consumer matching the canonical IRI finds it.
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:AGPL-3.0
    reason: 'Section 13 reads: "Notwithstanding any other provision of this License, you have permission
      to link or combine any covered work with a work licensed under version 3 of the GNU Affero General
      Public License into a single combined work, and to convey the resulting work." A work under
      this licence can therefore go into a combined work released under AGPL-3.0; the AGPL text says
      the same the other way round.'
    source: manual
  - action: added
    statement: dalicc:compatibleWith dalicclib:AGPL-3.0-or-later
    reason: 'Section 13 reads: "Notwithstanding any other provision of this License, you have permission
      to link or combine any covered work with a work licensed under version 3 of the GNU Affero General
      Public License into a single combined work, and to convey the resulting work." A work under
      this licence can therefore go into a combined work released under AGPL-3.0; the AGPL text says
      the same the other way round.'
    source: manual
