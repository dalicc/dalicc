id: BSD-3-Clause-Open-MPI
title: BSD 3-Clause Open MPI variant
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/BSD-3-Clause-Open-MPI.txt
text_retrieved: true
verdict: created
summary: Models the Open MPI variant of the three-clause BSD licence. The three conditions are those of BSD-3-Clause;
  the added paragraph disclaims any reassurance about third-party intellectual property and is quoted verbatim.
  Nothing here is legal advice.
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: The grant is the three-clause BSD sentence, "Redistribution and use in source and binary forms, with
    or without modification, are permitted provided that the following conditions are met", so the permission set
    is that of BSD-3-Clause.
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: The third condition, "Neither the name of the copyright holders nor the names of its contributors
    may be used to endorse or promote products derived from this software without specific prior written permission",
    is a dalicc:promote prohibition.
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: The retention conditions are the whole content of the licence. cc:Attribution and cc:Notice hang
    off odrl:distribute, odrl:modify and odrl:derive, because the text requires the copyright notice, the list of
    conditions and the disclaimer to travel with every redistributed and every modified copy.
  action: applied
- rubric: 6
  severity: major
  field: dalicc:additionalClauses
  description: The paragraph "The copyright holders provide no reassurances that the source code provided does not
    infringe any patent, copyright, or any other intellectual property rights of third parties" is a third-party
    infringement disclaimer, not a patent refusal and not a liability limitation for the licensed work, so it is
    quoted in dalicc:additionalClauses rather than folded into dalicc:WarrantyDisclaimer.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and sets no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer with the dependency graph dg_default returned an empty
    conflict list.
  action: none
- rubric: 10
  severity: info
  field: record
  description: Follows licensedata/licenses/BSD-3-Clause.ttl. Its binary-form condition is slightly wider than the
    standard one ("the following disclaimer listed in this license"), which does not change the cc:Notice duty.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Family rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier pass wrote is removed. The text reads: "Redistribution and use in source and binary forms, with
    or without modification, are permitted provided that the following conditions are met: - Redistributions of
    source code must retain the above copyright notice, this list of conditions and the following disclaimer." The
    permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
    relicensing.'
  action: applied
family: BSD variants
port_of: null
variant_kind: null
notes: The second see-also URL SPDX lists for this identifier, the LAPACK licence file, carries the same wording;
  cc:legalcode points at the Open MPI community page.
