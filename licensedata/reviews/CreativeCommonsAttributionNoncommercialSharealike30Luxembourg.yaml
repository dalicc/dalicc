id: CreativeCommonsAttributionNoncommercialSharealike30Luxembourg
title: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Luxembourg
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://creativecommons.org/licenses/by-nc-sa/3.0/lu/legalcode
text_retrieved: true
verdict: corrected
summary: 'The record models the BY-NC-SA element set of the Creative Commons 3.0 port for Luxembourg and
  the grant and restriction sections support it: the attribution and notice duties hang on the acts that
  share the work with the public, and the prohibitions follow the restrictions clause. The legal text
  was read in French. Corrections applied: dct:source, dct:title, odrl:target. What remains are proposals
  that touch the whole Creative Commons family rather than this record, chiefly the express prohibition
  of sublicensing.'
findings:
- rubric: 1
  severity: minor
  field: dct:source
  description: The record carried cc:legalcode but no dct:source. The legal code page of this port states
    the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-sa/3.0/lu/, and the six
    4.0 International parents carry exactly that pair, legal code plus deed. Added.
  action: applied
  change: dct:source <https://creativecommons.org/licenses/by-nc-sa/3.0/lu/> ;
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: SPDX has no identifier for this port. The legal code URL implies CC-BY-NC-SA-3.0-LU, which
    the SPDX licence list does not define, so none was invented. Of the thirty five records in this batch
    only the six German ones take an SPDX identifier.
  action: none
- rubric: 1
  severity: minor
  field: dct:title
  description: The dct:title literal ended in a space, "Creative Commons Attribution-NonCommercial-ShareAlike
    3.0 Luxembourg ", which the library list and the search index carry through. Removed. The same defect
    sits in the NonCommercial-ShareAlike record of every Creative Commons port in the library.
  action: applied
  change: dct:title "Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Luxembourg"@en ;
- rubric: 2
  severity: minor
  field: odrl:target
  description: The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-SA-4.0
    targets dalicc:CreativeWork and dcmitype:Dataset. This port settles the sui generis database right
    expressly. Section 3 grants "Lorsque l'Oeuvre est une base de donnees, extraire et reutiliser des
    parties substantielles de l'Oeuvre" and closes with "Si le Donneur de Licence est le titulaire de
    droits de base de donnees sui generis suivant la transposition en droit national de la Directive Europeenne
    sur les Bases de Donnees, le Donneur de Licence renonce a ces droits". Section 4(f) adds that the
    restrictions of 4(a) and 4(b) do not apply to the parts of an Oeuvre that fall inside the definition
    only because they are governed by that sui generis right. Because the legal text names databases as
    licensed subject matter and disposes of the database maker's right in the grant itself, dcmitype:Dataset
    was added here rather than left as a proposal, which is how the same question was decided for the
    Portuguese, Czech and Azerbaijani ports. The ports in this batch whose text has no database clause
    at all, Ecuador and Brazil, keep the proposal.
  action: applied
  change: "odrl:target [ a odrl:AssetCollection ;\n        dct:type dalicc:CreativeWork,\n           \
    \ dcmitype:Dataset ] ;"
- rubric: 3
  severity: info
  field: odrl:permission
  description: The modelled permissions follow the grant. Section 3 (Octroi de la Licence) grants "une
    licence mondiale, gratuite, non exclusive et perpetuelle (pour la duree du droit d'auteur applicable)"
    covering reproduction and incorporation into Collections, the creation and reproduction of Adaptations
    with a duty to label the change, the distribution and public performance of the Work and of Adaptations,
    and, where the Work is a database, the extraction and reuse of substantial parts. The record models
    this as odrl:reproduce, odrl:distribute, odrl:display, odrl:present, odrl:modify, odrl:derive, cc:DerivativeWorks
    and dalicc:ModifiedWorks. cc:CommercialUse is prohibited rather than permitted, which is the NonCommercial
    element.
  action: none
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: The licence forbids sublicensing and the record does not say so. "Vous ne pouvez pas sous-licencier
    l'Oeuvre." Section 4(a). The vocabulary already has dalicc:sublicense, but no record in the library
    uses it and its skos:note says so, and the same sentence stands in every Creative Commons 2.0 and
    3.0 record, so adding it to the thirty five ports of this batch alone would split the compatibility
    behaviour of one family. Proposed as one library wide correction, together with an update of the vocabulary
    note. Batches 3 and 6 made the same recommendation.
  action: proposed
  change: "odrl:prohibition [ a odrl:Prohibition ;\n        odrl:action dalicc:sublicense ] ;"
- rubric: 4
  severity: info
  field: odrl:prohibition
  description: 'dalicc:ChangeLicense is prohibited, which the licence supports: the work may be shared
    only under the terms of this licence and the licensee may not offer or impose terms that alter or
    restrict it or the rights of downstream recipients. dalicc:promote is prohibited, which the 3.0 text
    supports better than the 2.0 text did, because the no endorsement rule sits in the licence body rather
    than in the Creative Commons notice printed around it. Section 4(d): the Licensee may not assert or
    imply any connection, sponsorship or endorsement by the Original Author, the Licensor or the attribution
    parties without their separate, express, prior written permission. cc:CommercialUse is prohibited.
    Section 4(c): the rights granted may not be exercised in a way "visant un avantage commercial ou une
    compensation financiere personnelle", with the file sharing carve out where no payment changes hands.'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: 'The attribution and notice duties are present and supported: the licence requires a copy
    of the licence or its URI with every copy shared, that the notices referring to the licence and to
    the warranty clause be kept intact, and that credit be given, and in this port credit is owed to the
    "Auteur Original", to the Licensor and to the "Parties Concernees par l''Attribution", and a translation
    must be labelled, for example "l''oeuvre originale a ete traduite de l''anglais vers l''espagnol".
    The duties hang on odrl:distribute, odrl:modify and odrl:derive, which matches the licence, since
    they are triggered by distributing or communicating the work to the public rather than by private
    use. dalicc:modificationNotice is supported by the duty to take reasonable steps to label a change.'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: 'cc:ShareAlike is a set level duty, which matches the licence: the share alike condition
    bites on derivative works rather than on a single permission. Section 4(b) accepts this licence, a
    later version of it with the same Licence Elements, or a Creative Commons jurisdiction or Unported
    licence with the same Elements. The model cannot express which other licences satisfy the duty, so
    the record cannot say that a differently ported licence of the same element set will do.'
  action: none
- rubric: 3
  severity: minor
  field: odrl:permission
  description: dalicc:chargeDistributionFee is permitted while cc:CommercialUse is prohibited. Under the
    test of this port, the rights granted may not be exercised in a way "visant un avantage commercial
    ou une compensation financiere personnelle", with the file sharing carve out where no payment changes
    hands, a pure cost recovery fee is arguable rather than plainly allowed. The statement also sits in
    the 4.0 International parent CC-BY-NC-SA-4.0 and in every NonCommercial record of the library, so
    this is one decision about the whole NonCommercial family rather than about this record. Not applied.
  action: proposed
  change: "remove:\n  odrl:permission [ a odrl:Permission ;\n        odrl:action dalicc:chargeDistributionFee\
    \ ] ;"
- rubric: 6
  severity: info
  field: dalicc:WarrantyDisclaimer
  description: dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation are quoted from the French text
    of this port and not from the English unported version, each holds its own clause and nothing of the
    other, and both were checked sentence by sentence against the legal code. Section 5 (Declarations,
    garanties et exonerations de responsabilite) is a plain disclaimer in capitals, "LE DONNEUR DE LICENCE
    PROPOSE L'OEUVRE EN L'ETAT ET NE FORMULE AUCUNE GARANTIE NI DECLARATION DE QUELQUE NATURE QUE CE SOIT",
    and Section 6 (Limitation de la responsabilite) is the liability clause. Each sits in its own field.
  action: none
- rubric: 6
  severity: info
  field: dalicc:additionalClauses
  description: 'The clauses the ODRL policy cannot carry are not visible in the record: the reservation
    of unnamed rights, the direct licence that every recipient receives from the licensor, the automatic
    termination on breach with the survival list, the severability, waiver and entire agreement paragraphs,
    and the royalty collection arrangements. The whole Creative Commons family is modelled this way, so
    this is a family observation rather than a defect of this record.'
  action: none
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: 'cc:jurisdiction is bpicounty:Luxembourg, which matches the country of the legal code URL
    https://creativecommons.org/licenses/by-nc-sa/3.0/lu/legalcode, and dalicc:validityType is dalicc:perpetual,
    which matches a grant for the duration of the applicable copyright. Note that the jurisdiction field
    records the legal home of the port, not a territorial limit: the grant itself is worldwide. The port
    names no governing law.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:prohibition
  description: 'The licence forbids technological protection measures and the vocabulary has no term for
    it. Section 4(a): the Licensee may not distribute or publicly perform the Work with "de mesures techniques
    de protection sur l''Oeuvre qui" restrict the recipient in exercising the rights granted. Proposed
    term: dalicc:applyTechnicalProtectionMeasures, an odrl:Action to be used as an odrl:Prohibition. Not
    modelled, because bending an existing term would be worse than the gap.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'Two clauses of the licence body have no vocabulary term. Section 7 (Fin de la Licence):
    automatic termination on breach, downstream licences survive, the named sections survive. Proposed
    term: dalicc:terminationOnBreach. Section 8: every distribution or public performance carries an offer
    of a licence from the Licensor to the recipient on the same terms. Proposed term: dalicc:downstreamOffer.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'Moral rights have no vocabulary term, in either direction. Section 4(g): "Les droits moraux,
    dans la mesure ou ils sont reconnus par le droit national applicable, de la personne physique qui
    est l''Auteur Original de l''Oeuvre ou des personnes physiques qui sont les Auteurs Originaux de l''Oeuvre,
    ne sont pas affectes par la presente Licence", the deferring formula, with a pointer to it already
    in the definitions section. Proposed terms: dalicc:moralRightsRestriction for a clause that binds
    the licensee and dalicc:moralRightsNonAssertion for one in which the licensor undertakes not to assert
    them.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The royalty collection arrangement has no vocabulary term. Section 4(e) splits royalty
    collection three ways, a non waivable statutory licence, a waivable statutory licence and voluntary
    collective management through "un organisme de gestion de droits qui gere les regimes de licence facultatifs",
    reserved for uses other than non commercial in the NonCommercial element sets. No society is named.
    Proposed term: dalicc:royaltyCollectionReserved, with a counterpart for the waiver. It is one of the
    few places where the ports of one version really differ from each other.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:duty
  description: 'The share alike duty that accepts a later version of the same licence, another jurisdiction
    port with the same licence elements or, in the German port, a licence declared compatible with Creative
    Commons, cannot be expressed. Proposed term: a property on the cc:ShareAlike duty, for example dalicc:shareAlikeAccepts.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the forty one axioms of licensedata/dependencygraph/dg_default.ttl
    reports no conflict, before and after the corrections, and the pre review baseline listed none for
    this record either.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'Port of CC-BY-NC-SA-4.0, the 4.0 International record of the same element set. The deontic
    model of this record is identical to the parent, statement for statement: the same permissions with
    the same duties, the same prohibitions and the same set level duties, and the same asset types too,
    now that the database clause of this port has brought dcmitype:Dataset into odrl:target. What differs
    is the jurisdiction, the language of the legal text, the clause texts and the version specific clauses
    of 3.0 that the model does not carry, chiefly the express prohibition of sublicensing, the technological
    measures clause, the royalty collection arrangement and the moral rights clause. The compatibility
    checker cannot tell this record from the other records of the BY-NC-SA element set, across all three
    versions and every jurisdiction the library holds.'
  action: none
family: 'Creative Commons 3.0 port: Luxembourg (LU)'
port_of: CC-BY-NC-SA-4.0
variant_kind: jurisdiction-port
notes: 'The parent is the 4.0 International record of the same element set, since the library holds no
  unported and no International 3.0 record; the version difference, 3.0 against 4.0, is therefore part
  of the port relation and not only the jurisdiction. The 3.0 text differs from 4.0 in substance as well:
  it prohibits sublicensing expressly, it forbids technological protection measures, it has no thirty
  day cure period for a breach, and it settles the royalty collection question and the moral rights question
  per jurisdiction. None of that is visible in the model. This port is a translation as well as a jurisdiction
  port, so dalicc:translationOf would fit it when the term exists. Nothing in this review is legal advice.'
