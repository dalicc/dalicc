id: EFL-2.0
title: Eiffel Forum License v2.0
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/EFL-2.0.txt
text_retrieved: true
verdict: created
summary: 'The record models version 2 of the Eiffel Forum License, the version most Eiffel packages use. Its first
  clause is version 1''s grant with the license text in place of the license file. Its second clause allows distributing
  dependent binary programs with no condition at all: releasing a modified package is only encouraged, so this record
  carries no cc:SourceCode duty and version 1 does.'
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: '"1. Permission is hereby granted to use, copy, modify and/or distribute this package, provided that:
    - copyright notices are retained unchanged, - any distribution of this package, whether modified or not, includes
    this license text." The record permits reproduce, distribute, modify, derive, display, present, commercial use,
    derivative works, modified works and the distribution fee.'
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: 'cc:Attribution and cc:Notice on distribute, modify and derive. No cc:SourceCode duty: clause 2 reads
    "If the binary program depends on a modified version of this package, you are encouraged to publicly release
    the modified version of this package", and an encouragement is not a duty.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'dalicc:ChangeLicense is prohibited because the text requires the license itself to travel with every
    copy, which is the reading IscLicense and BSD-3-Clause take of the same clause. The MIT record does not carry
    the prohibition although its text has the same requirement, so the library is not uniform here. (Corrected on
    2026-09-15 by the verification pass: see the rubric 3 finding on relicensing below.)'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: Clause 2 is quoted verbatim so that a reader can see that the obligation of version 1 became an encouragement
    here. Without the quote the two records would differ by an absent duty and nothing would say why.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: none
- rubric: 2
  severity: info
  field: odrl:target
  description: One odrl:AssetCollection of dct:type dcmitype:Software, following MIT. The text licenses a package
    of software.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the axioms of dg_default returned no conflicts.
  action: none
- rubric: 10
  severity: major
  field: record
  description: 'Read against EFL-1.0: version 2 says license text where version 1 says this file, numbers its clauses,
    and turns the obligation to release a modified package into an encouragement. Only the last of those changes
    the model, and it changes a compatibility answer, so the two records are justified as separate licenses.'
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Library convention 15: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier reading wrote is removed. The text reads: "Permission is hereby granted to use, copy, modify and/or
    distribute this package, provided that: copyright notices are retained unchanged, any distribution of this package,
    whether modified or not, includes this license text." The permission carries the dalicc:compliantLicense duty,
    as Apache-2.0 does, because the notice has to survive the relicensing.'
  action: applied
family: 'Permissive: MIT, ISC and BSD-like'
port_of: null
variant_kind: version
notes: Modelled from the SPDX plain text. The warranty and liability clauses are identical to version 1 word for
  word.
