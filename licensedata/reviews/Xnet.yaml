id: Xnet
title: X.Net License
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/Xnet.txt
text_retrieved: true
verdict: created
summary: 'The record models the X.Net license, which is the MIT license word for word with one sentence added: the
  agreement is governed by the laws of California and of the United States. The deontic model is therefore the MIT
  model, with dalicc:sublicense added because the grant names sublicensing, and the governing-law sentence quoted
  in dalicc:additionalClauses.'
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: The grant is the MIT grant, including sublicense and sell copies. The grant names sublicensing in
    as many words, so dalicc:sublicense is a permission, and the clause that lets the recipient of a copy do the
    same is odrl:grantUse, the term the MIT record already uses for it.
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: 'The condition is the MIT condition: "The above copyright notice and this permission notice shall
    be included in all copies or substantial portions of the Software." cc:Attribution and cc:Notice on distribute,
    modify and derive.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'dalicc:ChangeLicense is prohibited because the text requires the license itself to travel with every
    copy, which is the reading IscLicense and BSD-3-Clause take of the same clause. The MIT record does not carry
    the prohibition although its text has the same requirement, so the library is not uniform here. (Corrected on
    2026-09-15 by the verification pass: see the rubric 3 finding on relicensing below.)'
  action: applied
- rubric: 7
  severity: major
  field: cc:jurisdiction
  description: 'The text names a legal system: "This agreement shall be governed in all respects by the laws of
    the State of California and by the laws of the United States of America." cc:jurisdiction stays dalicc:worldwide,
    because the grant itself is not limited to a territory and only the applicable law is named, and the sentence
    is quoted verbatim in dalicc:additionalClauses. The alternative, bpicounty:United_States, would say that the
    license may only be used there, which the text does not say.'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:WarrantyDisclaimer
  description: The MIT disclaimer paragraph is split into the warranty sentence and the liability sentence, as on
    MIT-0 in this review group.
  action: applied
- rubric: 2
  severity: info
  field: odrl:target
  description: One odrl:AssetCollection of dct:type dcmitype:Software, following MIT. The text licenses software
    and its documentation.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the axioms of dg_default returned no conflicts.
  action: none
- rubric: 10
  severity: info
  field: record
  description: Xnet is MIT plus a governing-law sentence. The only reason for a separate record is that sentence
    and the SPDX id; every deontic statement is MIT's.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Library convention 15: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier reading wrote is removed. The text reads: "Permission is hereby granted, free of charge, to any person
    obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software
    without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute,
    sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do
    so, subject to the following conditions: The above copyright notice and this permission notice shall be included
    in all copies or substantial portions of the Software." The permission carries the dalicc:compliantLicense duty,
    as Apache-2.0 does, because the notice has to survive the relicensing.'
  action: applied
family: 'Permissive: MIT, ISC and BSD-like'
port_of: null
variant_kind: null
notes: Modelled from the SPDX plain text. dct:publisher names X.Net, Inc., the company in the copyright line of
  the license.
