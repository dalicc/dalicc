id: CeaCnrsInriaLogicielLibreLicenseVersion21
title: Cea Cnrs Inria Logiciel Libre License, version 2.1
reviewed_on: 2026-09-15
reviewer: Giray Havur
text_source: http://www.cecill.info/licences/Licence_CeCILL_V2.1-fr.html
text_retrieved: true
verdict: corrected
summary: The CeCILL agreement version 2.1 is a strong copyleft license drafted under French law and designed
  to be compatible with the GNU GPL. The record prohibited cc:ShareAlike, which reverses article 5.3.2,
  and had no SPDX identifier. Both were fixed. The governing law of article 13 is not reflected in cc:jurisdiction.
findings:
- rubric: 1
  severity: minor
  field: spdx:licenseId
  description: Added CECILL-2.1. The record already carried "CECILL-2.1" as dct:alternative and the Open
    Source Initiative page for that id as dct:source.
  action: applied
  change: 'spdx:licenseId "CECILL-2.1" ;

    '
- rubric: 5
  severity: major
  field: odrl:prohibition
  description: 'Article 5.3.2 states: "les conditions de distribution du Logiciel Modifie en resultant
    sont alors soumises a l''integralite des dispositions du Contrat" (the modified software must be distributed
    under the whole of this agreement). The record prohibited cc:ShareAlike. Removed.'
  action: applied
  change: "# removed\nodrl:prohibition [ a odrl:Prohibition ;\n        odrl:action cc:ShareAlike ] ;\n"
- rubric: 5
  severity: major
  field: odrl:duty
  description: Reciprocity belongs as a license-wide cc:ShareAlike duty, as in the GNU records. Held back
    because the record permits odrl:grantUse and the dependency graph treats share-alike and grant-use
    as contradictory.
  action: proposed
  change: "odrl:duty [ a odrl:Duty ;\n        odrl:action cc:ShareAlike ] ;\n"
- rubric: 7
  severity: minor
  field: cc:jurisdiction
  description: Article 13.1 states that the agreement is governed by French law and article 13.2 gives
    the courts of Paris jurisdiction. cc:jurisdiction is dalicc:worldwide. The territorial scope of the
    licence grant is indeed worldwide, so this is a question of whether the field means scope or governing
    law; docs/DATA.md does not say.
  action: none
- rubric: 1
  severity: minor
  field: cc:legalcode
  description: cc:legalcode points at the French text, Licence_CeCILL_V2.1-fr.html, while the record title
    and every literal in it are English. The SPDX entry links the English text. Adding the English URL
    alongside would make the record self-consistent.
  action: proposed
  change: 'cc:legalcode <http://www.cecill.info/licences/Licence_CeCILL_V2.1-en.html> ;

    '
- rubric: 8
  severity: gap
  field: vocabulary
  description: 'Article 5.3.4 makes the license explicitly compatible with the GNU GPL, the GNU Affero
    GPL and the European Union Public Licence, a compatibility statement the dependency graph could use
    directly but no term expresses. Article 10 carries a patent grant. Proposed: dalicc:compatibleWith,
    dalicc:patentGrant.'
  action: none
- rubric: 10
  severity: major
  field: record
  description: 'Standard-license addition of 2026-09-15, decision 9: the record was corrected against
    its new siblings and versioned. Batch 5 finding 7: dalicc:WarrantyDisclaimer held Article 8, the liability
    article, and Article 9, the warranty article, was absent; the record prohibited dalicc:promote although
    CeCILL 2.1 has no trademark clause and prohibited dalicc:addStatement although Article 5.3.4 requires
    a statement; and cc:attributionName and dct:publisher both began with a space. Article 9.3 is quoted
    from the French legal code the record cites, which is the version that was retrieved.'
  action: applied
family: Other OSI approved licenses (corporate, academic, weak copyleft)
port_of: null
variant_kind: null
notes: 'The legal text on file is the French version. This record uses the composer template shared by
  AAL, AFL-3.0, APL-1.0, APSL-2.0, CATOSL-1.1, CECILL-2.1, EPL-1.0 and PHP-3.0: bare odrl:derive and odrl:modify
  permissions with the real duties hung on cc:DerivativeWorks, plus a fixed block of three prohibitions
  (cc:ShareAlike, dalicc:addStatement, dalicc:promote). The template fits a permissive license and misdescribes
  every reciprocal one.'
