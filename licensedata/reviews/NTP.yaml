id: NTP
title: NTP License
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/NTP.txt
text_retrieved: true
verdict: created
summary: The record models the NTP license, an ISC-form permissive license with an advertising bar. Use, copying,
  modification and distribution are permitted for any purpose with or without fee, on the condition that the copyright
  notice and the permission notice travel with the work, and the licensor's name may not be used in advertising.
  The deontic model follows IscLicense, with dalicc:promote added as a prohibition.
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'The grant reads: "Permission to use, copy, modify, and distribute this software and its documentation
    for any purpose with or without fee is hereby granted". The record permits reproduce, distribute, modify, derive,
    display, present, commercial use, derivative works and modified works, and the words with or without fee support
    dalicc:chargeDistributionFee.'
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: The condition is that the copyright notice appears in all copies and that both the copyright notice
    and the permission notice appear in supporting documentation, so cc:Attribution and cc:Notice are duties on
    distribute, modify and derive.
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'The text bars advertising use of the name: "and that the name (TrademarkedName) not be used in advertising
    or publicity pertaining to distribution of the software without specific, written prior permission". That is
    dalicc:promote as a prohibition. dalicc:ChangeLicense is prohibited because the text requires the license itself
    to travel with every copy, which is the reading IscLicense and BSD-3-Clause take of the same clause. The MIT
    record does not carry the prohibition although its text has the same requirement, so the library is not uniform
    here. (Corrected on 2026-09-15 by the verification pass: see the rubric 3 finding on relicensing below.)'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:WarrantyDisclaimer
  description: The disclaimer is the last two sentences of the single paragraph, quoted verbatim including the missing
    preposition in the phrase about suitability, which is in the published text. The license has no liability clause,
    so dalicc:LiabilityLimitation is absent.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: none
- rubric: 2
  severity: info
  field: odrl:target
  description: One odrl:AssetCollection of dct:type dcmitype:Software, following IscLicense. The text licenses software
    and its documentation.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the axioms of dg_default returned no conflicts.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'NTP, HPND and curl share one wording and one deontic model in this review group: the ISC condition plus
    an advertising bar. HPND adds a warranty disclaimer in capitals and a liability clause; curl adds a liability
    clause and states the advertising bar as a separate paragraph.'
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Library convention 15: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier reading wrote is removed. The text reads: "Permission to use, copy, modify, and distribute this software
    and its documentation for any purpose with or without fee is hereby granted, provided that the above copyright
    notice appears in all copies and that both the copyright notice and this permission notice appear in supporting
    documentation, and that the name (TrademarkedName) not be used in advertising or publicity pertaining to distribution
    of the software without specific, written prior permission." The permission carries the dalicc:compliantLicense
    duty, as Apache-2.0 does, because the notice has to survive the relicensing.'
  action: applied
family: 'Permissive: MIT, ISC and BSD-like'
port_of: null
variant_kind: null
notes: Modelled from the SPDX plain text. The placeholders (CopyrightHoldersName) and (TrademarkedName) are part
  of the published template and are kept in the quoted clause.
