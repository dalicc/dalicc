id: ALGLIB-Documentation
title: ALGLIB Documentation License
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://spdx.org/licenses/ALGLIB-Documentation.html
text_retrieved: true
verdict: created
summary: 'The licence of the ALGLIB Reference Manual: two-clause BSD written for a document, with the retention
  of the copyright notice, the condition itself and the disclaimer as the first or last lines of the file as its
  only requirement. The record follows the BSD records of batch 3 and takes its asset types from GnuFreeDocumentationLicense.
  Nothing here is legal advice.'
findings:
- rubric: 1
  severity: minor
  field: cc:legalcode
  description: The SPDX entry for this licence carries no seeAlso URL, so cc:legalcode and dct:source both name
    the SPDX reference page. Every other record in this batch points cc:legalcode at the licensor's own copy.
  action: applied
- rubric: 2
  severity: info
  field: odrl:target
  description: The licensed work is a document, the ALGLIB Reference Manual, that documents a software library,
    so the record carries dalicc:CreativeWork and dcmitype:Software, the pair GnuFreeDocumentationLicense uses.
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'The grant reads: "Redistribution and use of this document (ALGLIB Reference Manual) with or without
    modification, are permitted provided that such redistributions will retain the above copyright notice, this
    condition and the following disclaimer as the first (or last) lines of this file." That is the permissive base
    set: reproduce, distribute, modify, derive, display, present, commercial use, derivative works, modified works
    and the distribution fee.'
  action: applied
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: Only dalicc:ChangeLicense, because the condition itself must travel with every redistribution, the
    reading BSD-1-Clause and the other BSD records carry. There is no trademark clause, no patent clause and no
    endorsement clause, so nothing else is prohibited.
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: 'One sentence carries all the duties: the copyright notice (cc:Attribution), the condition (cc:Notice)
    and the disclaimer (dalicc:noWarrantyNotice) must be retained as the first or last lines of the file. They hang
    on odrl:distribute, odrl:modify and odrl:derive, because the sentence covers redistribution "with or without
    modification".'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: The disclaimer paragraph is split at "IN NO EVENT SHALL" into dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation.
    dalicc:additionalClauses carries the copyright line and the redistribution condition, which is the whole of
    the operative text.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no governing law and no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 8
  severity: info
  field: vocabulary
  description: 'No gap: every clause of this licence has a term. The requirement that the notice sit in the first
    or last lines of the file is a placement rule, which no record in the library expresses and which the quoted
    clause carries.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer with the axioms of dg_default returned an empty list
    for this record.
  action: none
- rubric: 10
  severity: info
  field: family
  description: The only documentation licence of the batch. Its nearest relatives in the library are the BSD records
    rather than GnuFreeDocumentationLicense, which is a copyleft licence with invariant sections; only the asset
    types are taken from there.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Family rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier pass wrote is removed. The text reads: "Redistribution and use of this document (ALGLIB Reference
    Manual) with or without modification, are permitted provided that such redistributions will retain the above
    copyright notice, this condition and the following disclaimer as the first (or last) lines of this file." The
    permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
    relicensing.'
  action: applied
family: Fonts and documentation
port_of: null
variant_kind: null
notes: Modelled from the SPDX plain text. This is the one licence of the batch with no seeAlso URL on the SPDX list
  and no page of its own on the ALGLIB site, so cc:legalcode and dct:source both point at the SPDX reference page,
  which is the only stable published copy of the text.
