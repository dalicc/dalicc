id: BSD-2-Clause-Views
title: BSD 2-Clause with views sentence
reviewed_on: '2026-09-22'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/BSD-2-Clause-Views.txt
text_retrieved: true
verdict: created
summary: Models the two-clause BSD text with the sentence about the views of the authors that the FreeBSD project
  appended to it. The deontic model is the model of BSD-2-Clause, statement for statement. The views sentence binds
  nobody to anything, so it is quoted in dalicc:additionalClauses and nothing else changes.
findings:
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: File name, record identifier, SPDX identifier and IRI local name are all BSD-2-Clause-Views. The SPDX
    list deprecated BSD-2-Clause-FreeBSD in favour of this identifier, so the old spelling is carried as a dct:alternative.
  action: applied
- rubric: 2
  severity: info
  field: odrl:target
  description: One odrl:AssetCollection of dct:type dcmitype:Software, following BSD-2-Clause.
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'The grant reads "Redistribution and use in source and binary forms, with or without modification,
    are permitted provided that the following conditions are met". The record permits the same acts as BSD-2-Clause:
    reproduce, distribute, modify, derive, display, present, commercial use, derivative works, modified works and
    the distribution fee.'
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'dalicc:ChangeLicense is permitted with the dalicc:compliantLicense duty, as on BSD-2-Clause: the notice
    condition is a duty on the acts it governs, not a bar on relicensing.'
  action: applied
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: No prohibition. The text has no endorsement, trademark or advertising clause, so no dalicc:promote
    statement is made; the views sentence is a disclaimer of attribution, not a bar on using a name.
  action: none
- rubric: 5
  severity: major
  field: odrl:duty
  description: cc:Attribution and cc:Notice hang off odrl:distribute, odrl:modify and odrl:derive. Clause 1 asks that
    source redistributions retain the copyright notice, the list of conditions and the disclaimer, and clause 2 asks
    that binary redistributions reproduce them in the documentation, so the duty reaches both forms.
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:WarrantyDisclaimer
  description: 'The single disclaimer paragraph carries two clauses. The record splits it at the sentence boundary:
    the warranty sentence goes to dalicc:WarrantyDisclaimer and the liability sentence to dalicc:LiabilityLimitation,
    both verbatim. This follows BSD-1-Clause, which split the same paragraph on 2026-09-15.'
  action: applied
- rubric: 6
  severity: info
  field: dalicc:additionalClauses
  description: The views sentence is quoted in full. It states whose opinions the software and the documentation express
    and puts no obligation on anyone, so it is not modelled as a duty.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and sets no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 8
  severity: info
  field: dalicc:additionalClauses
  description: No clause of this text needs a term the vocabulary does not have.
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer against the dependency graph dg_default returned an
    empty conflict list.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'Read against licensedata/licenses/BSD-2-Clause.ttl, the only difference is the views sentence in dalicc:additionalClauses.
    The record sits on the same rung of the BSD ladder as BSD-2-Clause: notice and attribution, no endorsement bar,
    no advertising acknowledgement.'
  action: none
family: Permissive variants
port_of: null
variant_kind: null
variant_of: null
notes: 'dct:publisher is left out: the text is the generic two-clause BSD licence with one added sentence and names
  no publishing body.'
