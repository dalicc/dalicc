id: CreativeCommonsAttributionNoncommercialNoderivs30Australia
title: Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 Australia
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://creativecommons.org/licenses/by-nc-nd/3.0/au/legalcode
text_retrieved: true
verdict: corrected
summary: 'The record models the BY-NC-ND element set of the Creative Commons 3.0 port for Australia and
  the deontic model is correct: the NonCommercial element prohibits cc:CommercialUse, the NoDerivatives
  element prohibits odrl:derive, the attribution and notice duties hang on the acts that make the work
  public, and every permission follows from the grant section of the port. The legal text was read in
  English (Australian spelling), and the permissions, prohibitions and duties were checked against its
  grant and restriction sections and against the 4.0 International parent CC-BY-NC-ND-4.0. Corrections
  applied: dct:source. What remains are proposals that touch the whole Creative Commons family rather
  than this record, chiefly the express prohibition of sublicensing.'
findings:
- rubric: 1
  severity: minor
  field: dct:source
  description: The record carried cc:legalcode but no dct:source. The legal code page of the port states
    the canonical URL of the licence, https://creativecommons.org/licenses/by-nc-nd/3.0/au/, and the six
    4.0 International parents carry exactly that pair, legal code plus deed. Added.
  action: applied
  change: dct:source <https://creativecommons.org/licenses/by-nc-nd/3.0/au/> ;
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: 'The SPDX licence list defines no identifier for this port. The id that the legal code
    URL implies, CC-BY-NC-ND-3.0-AU, is not on the list, so none was invented. Only four records of this
    batch can take an SPDX identifier: CC-BY-3.0-AU, CC-BY-3.0-AT, CC-BY-3.0-US and CC-BY-SA-3.0-AT.'
  action: none
- rubric: 2
  severity: minor
  field: odrl:target
  description: The record targets dalicc:CreativeWork alone, while the 4.0 International parent CC-BY-NC-ND-4.0
    targets dalicc:CreativeWork and dcmitype:Dataset. This port has no database rights clause, so the
    case rests only on the media neutrality of the grant. Aligning the ports with the parents is one library
    wide decision covering every Creative Commons port, so it is left as a proposal.
  action: proposed
  change: "odrl:target [ a odrl:AssetCollection ;\n        dct:type dalicc:CreativeWork,\n           \
    \ dcmitype:Dataset ] ;"
- rubric: 3
  severity: info
  field: odrl:permission
  description: 'Every modelled permission is supported by the grant. Clause 3A: "the Licensor grants to
    You a worldwide, royalty-free, non-exclusive, perpetual (for the duration of the applicable copyright)
    licence to exercise the following rights". The grant covers reproduction of the work, its inclusion
    in a collection and its reproduction as part of that collection, and distribution and public communication
    or performance of the work alone or as part of a collection, together with the modifications that
    are technically necessary to exercise those rights in other media and formats. The adaptation right
    is not in the grant. The record models this as odrl:reproduce, odrl:distribute, odrl:display, odrl:present.
    The record also carries odrl:modify and dalicc:ModifiedWorks, which the next finding addresses.'
  action: none
- rubric: 3
  severity: minor
  field: odrl:permission
  description: 'The record permits dalicc:chargeDistributionFee while prohibiting cc:CommercialUse. Clause
    4C: "You may not exercise any of the rights granted to You by clause 3 above in any Commercial manner."
    "Commercial" is defined in clause 1 as "primarily intended for or directed towards commercial advantage
    or private monetary compensation", with digital file sharing without payment excluded. The vocabulary
    defines dalicc:chargeDistributionFee as a fee covering the act of providing the work to a third party,
    so a pure cost recovery fee is arguable under the commercial advantage test, but the statement sits
    uneasily next to the prohibition. The same statement is in the 4.0 International parent CC-BY-NC-ND-4.0
    and in all 145 NonCommercial records of the library, so removing it is one library wide decision,
    not a defect of this port.'
  action: proposed
  change: "remove:\n    odrl:permission [ a odrl:Permission ;\n            odrl:action dalicc:chargeDistributionFee\
    \ ]"
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'The record permits odrl:modify and dalicc:ModifiedWorks, but the 3.0 NoDerivatives text
    grants no right to adapt the work at all. Clause 3B: "Other than such technical modifications, You
    have no rights to make Derivative Works." The 4.0 International parent CC-BY-NC-ND-4.0 does permit
    producing adapted material and only forbids sharing it, which is where the modelling comes from, but
    3.0 is not 4.0 on this point. Removing the two statements changes the compatibility outcome and touches
    every 2.0 and 3.0 NoDerivatives record in the library, so it is proposed rather than applied.'
  action: proposed
  change: "remove:\n    odrl:permission [ a odrl:Permission ;\n            odrl:action odrl:modify ;\n\
    \            odrl:duty [ a odrl:Duty ; odrl:action cc:Attribution ],\n                [ a odrl:Duty\
    \ ; odrl:action cc:Notice ],\n                [ a odrl:Duty ; odrl:action dalicc:modificationNotice\
    \ ] ] ,\n        [ a odrl:Permission ;\n            odrl:action dalicc:ModifiedWorks ]"
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'The licence forbids sublicensing and the record does not say so. Clause 4A: "You are not
    granted the right to sublicense the Work." The vocabulary already has dalicc:sublicense, but no record
    in the library uses it and its skos:note says so, and the same sentence stands in every Creative Commons
    2.0 and 3.0 record, so adding it to this batch alone would split the compatibility behaviour of one
    family. Proposed as one library wide correction, together with an update of the vocabulary note.'
  action: proposed
  change: "odrl:prohibition [ a odrl:Prohibition ;\n        odrl:action dalicc:sublicense ] ;"
- rubric: 4
  severity: info
  field: odrl:prohibition
  description: 'cc:CommercialUse is prohibited, which the NonCommercial clause states directly. Clause
    4C: "You may not exercise any of the rights granted to You by clause 3 above in any Commercial manner."
    "Commercial" is defined in clause 1 as "primarily intended for or directed towards commercial advantage
    or private monetary compensation", with digital file sharing without payment excluded. dalicc:ChangeLicense
    is prohibited, which the licence supports: the licensee may offer the work only under the terms of
    this licence and may not offer or impose terms that alter or restrict it. dalicc:promote is prohibited,
    which rests on the reservation of all rights not expressly granted and on the trademark paragraph
    of the Creative Commons notice around the licence, not on a clause of the licence body. odrl:derive
    is prohibited, which the NoDerivatives clause states directly. Clause 3B: "Other than such technical
    modifications, You have no rights to make Derivative Works."'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: The attribution and notice duties are present and supported. Clause 4D requires all copyright
    notices to be kept intact and credit to the Original Author and any "Attribution Parties" the Original
    Author or Licensor designates, the title of the Work and the Uniform Resource Identifier the Licensor
    specifies, plus, for a Derivative Work, a credit identifying the use made of the Work. The duties
    hang on odrl:distribute and odrl:modify, which matches the licence, since they are triggered by making
    the work public rather than by private use.
  action: none
- rubric: 6
  severity: info
  field: dalicc:WarrantyDisclaimer
  description: dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation are quoted verbatim from the English
    (Australian spelling) text of this port and not from the English Unported version, and they match
    the disclaimer section and the limitation of liability section of the legal code. Each field holds
    its own clause, with no overlap between the two.
  action: none
- rubric: 6
  severity: info
  field: dalicc:additionalClauses
  description: The record has no dalicc:additionalClauses, so the clauses the ODRL policy cannot carry,
    the reservation of unnamed rights, the downstream offer to recipients, the severability, waiver and
    entire agreement paragraphs and the termination rule, are not visible in the record at all. The whole
    Creative Commons family is modelled this way.
  action: none
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: 'cc:jurisdiction is bpicounty:Australia, which matches the country of the legal code URL,
    and dalicc:validityType is dalicc:perpetual, which matches a grant for the duration of copyright.
    On the governing law: clause 13: "The construction, validity and performance of this Licence shall
    be governed by the laws in force in the Australian Capital Territory, Australia." The 2.0 Australian
    port named New South Wales, so the 3.0 port moved the forum. Note that the jurisdiction field records
    the legal home of the port, not a territorial limit on the grant: the grant itself is worldwide.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:prohibition
  description: 'The licence forbids technological protection measures and the vocabulary has no term for
    it. Clause 4A: "When You Distribute or publicly perform the Work, You must not impose any technological
    measures on it that restrict the ability of a recipient of the Work from You to exercise the rights
    granted to them by this Licence." Proposed term: dalicc:applyTechnicalProtectionMeasures, an odrl:Action
    to be used as an odrl:Prohibition. Not modelled, because bending an existing term would be worse than
    the gap.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The automatic termination of the licence on breach, and the survival of the definitions,
    the disclaimer, the limitation of liability and the miscellaneous sections, have no vocabulary term.
    Proposed term: dalicc:terminationOnBreach. The downstream offer, under which every recipient of the
    work or of an adaptation receives a licence directly from the licensor on the same terms, has none
    either. Proposed term: dalicc:downstreamOffer.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The moral rights clause of this port is not expressible. Clause 4E: "Moral rights remain
    unaffected to the extent they are recognised and nonwaivable at law." The clause names the right of
    integrity of authorship, the right of attribution of authorship and the right not to have authorship
    falsely attributed under Part IX of the Copyright Act 1968 (Cth). The restriction runs against the
    licensee. Proposed terms: dalicc:moralRightsRestriction and dalicc:moralRightsNonAssertion, so that
    the direction of the clause can be recorded.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The royalty collection arrangement is not expressible. Clause 3C reserves the royalty
    collection right, individually or through a licensing body such as a collecting society, for any Commercial
    use of the Work, and waives it for any exercise of the rights granted by the Licence. Proposed term:
    dalicc:royaltyCollectionReserved, with a value saying whether the claim is reserved or waived and
    for which kind of use. This matters to a user of the model, because a licence that reads as royalty
    free can still leave a collecting society claim standing.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the 41 axioms of licensedata/dependencygraph/dg_default.ttl
    reports no conflict, before and after the corrections, and the pre-review baseline listed none for
    this record either.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'Port of Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International. The
    deontic model of this record is identical to the parent CC-BY-NC-ND-4.0, statement for statement:
    the same permissions with the same duties, the same prohibitions and the same set level duties. The
    only structural difference left is odrl:target, which the parent extends with dcmitype:Dataset. What
    differs is the jurisdiction, the language of the legal text and the clause texts, and the version
    specific clauses of 3.0 that the model does not carry, chiefly the express prohibition of sublicensing,
    the technological measures clause, the moral rights clause and the royalty collection arrangements.
    The compatibility checker cannot tell this record from the other records of the BY-NC-ND element set,
    across all three versions and every jurisdiction the library holds.'
  action: none
family: 'Creative Commons 3.0 port: Australia (AU)'
port_of: CC-BY-NC-ND-4.0
variant_kind: jurisdiction-port
notes: 'The parent is the 4.0 International record of the same element set, since the library holds no
  Unported and no International 3.0 record; the version difference, 3.0 against 4.0, is therefore part
  of the port relation and not only the jurisdiction. The 3.0 text differs from 4.0 in substance as well:
  it prohibits sublicensing expressly, it forbids technological protection measures, it has no thirty
  day cure period for a breach, it settles the royalty collection question per jurisdiction, and its share-alike
  clause expressly accepts a later version, the Unported licence or another port with the same licence
  elements. None of that is visible in the model. Nothing in this review is legal advice.'
