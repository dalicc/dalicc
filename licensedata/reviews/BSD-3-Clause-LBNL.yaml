id: BSD-3-Clause-LBNL
title: Lawrence Berkeley National Labs BSD variant license
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/BSD-3-Clause-LBNL.txt
text_retrieved: true
verdict: created
summary: Models the Lawrence Berkeley National Laboratory variant of the three-clause BSD licence. The three conditions
  are those of BSD-3-Clause; the added paragraph is an optional grant back of Enhancements and imposes no obligation,
  so it is quoted rather than modelled. Nothing here is legal advice.
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: The grant is the standard three-clause BSD sentence, "Redistribution and use in source and binary
    forms, with or without modification, are permitted provided that the following conditions are met", so the permission
    set is that of BSD-3-Clause.
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: Condition (3), "Neither the name of the University of California, Lawrence Berkeley National Laboratory,
    U.S. Dept. of Energy nor the names of its contributors may be used to endorse or promote products derived from
    this software without specific prior written permission", is a dalicc:promote prohibition.
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: The retention conditions are the whole content of the licence. cc:Attribution and cc:Notice hang
    off odrl:distribute, odrl:modify and odrl:derive, because the text requires the copyright notice, the list of
    conditions and the disclaimer to travel with every redistributed and every modified copy.
  action: applied
- rubric: 6
  severity: major
  field: dalicc:additionalClauses
  description: The Enhancements paragraph opens "You are under no obligation whatsoever to provide any bug fixes,
    patches, or upgrades ... to anyone", and only then describes the licence that follows if the licensee chooses
    to publish them. Because it creates no duty it is quoted verbatim and no odrl:duty is written for it. The copyright
    notice also records that the grant is "subject to receipt of any required approvals from the U.S. Dept. of Energy".
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and sets no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer with the dependency graph dg_default returned an empty
    conflict list.
  action: none
- rubric: 10
  severity: info
  field: record
  description: Follows licensedata/licenses/BSD-3-Clause.ttl. cc:attributionName names the copyright holder the
    text names, which is how the library records a BSD variant tied to one institution.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Library convention 15: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier reading wrote is removed. The text reads: "Redistribution and use in source and binary forms, with
    or without modification, are permitted provided that the following conditions are met: (1) Redistributions of
    source code must retain the above copyright notice, this list of conditions and the following disclaimer." The
    permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive the
    relicensing.'
  action: applied
family: BSD variants
port_of: null
variant_kind: null
notes: The conditional grant back of Enhancements would be expressible only with a term for an optional reciprocal
  licence; none exists and none was invented.
