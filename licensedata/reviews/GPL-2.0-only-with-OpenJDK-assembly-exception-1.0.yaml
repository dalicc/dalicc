id: GPL-2.0-only-with-OpenJDK-assembly-exception-1.0
title: GNU General Public License, Version 2 with OpenJDK Assembly exception 1.0
reviewed_on: '2026-09-22'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-2.0-only.txt
text_retrieved: true
verdict: created
summary: The record models GNU General Public License, Version 2 with the exception the SPDX list calls
  OpenJDK-assembly-exception-1.0. It copies the model of GPL-2.0-only statement for statement and adds
  what the exception grants. The exception lets the covered code be linked with a named list of modules
  that the publisher could not release under the licence. The copyleft of the base licence still reaches
  the whole combination, which stays under GPL2, except the designated exception modules, and the exception
  text is quoted in full in dalicc:additionalClauses.
findings:
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: The file name, the identifier and the local name of the odrl:Set IRI are all GPL-2.0-only-with-OpenJDK-assembly-exception-1.0.
    spdx:licenseId carries the SPDX expression "GPL-2.0-only WITH OpenJDK-assembly-exception-1.0", with
    one space, an upper-case WITH and one more space, which is how the SPDX list writes a licence combined
    with an exception.
  action: applied
- rubric: 2
  severity: info
  field: odrl:target
  description: One odrl:AssetCollection of dct:type dcmitype:Software, copied from GPL-2.0-only. The exception
    speaks of code, modules and executables throughout.
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Section 1 reads: "You may copy and distribute verbatim copies of the Program''s source
    code as you receive it, in any medium, provided that you conspicuously and appropriately publish on
    each copy an appropriate copyright notice and disclaimer of warranty; keep intact all the notices
    that refer to this License and to the absence of any warranty; and give any other recipients of the
    Program a copy of this License along with the Program." Section 2 adds the right to modify and to
    distribute the modified work. The record therefore keeps every permission of GPL-2.0-only: reproduce,
    distribute, modify, derive, display, present, commercial use, derivative works, modified works and
    charging a distribution fee. The exception adds one more. It reads: "As a special exception, Oracle
    gives you permission to link this OpenJDK Code with certain code licensed by Oracle as indicated at
    http://openjdk.java.net/legal/exception-modules-2007-05-08.html ("Designated Exception Modules") to
    produce an executable, regardless of the license terms of the Designated Exception Modules, and to
    copy and distribute the resulting executable under GPL2, provided that the Designated Exception Modules
    continue to be governed by the licenses under which they were offered by Oracle." That is material
    the licence carves out of its own condition, so it is modelled as a permission dalicc:exceptedCombination.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: The prohibitions of GPL-2.0-only stay as they are. dalicc:ChangeLicense is still prohibited,
    because the exception narrows the reach of the reciprocity and does not let the covered work itself
    leave the licence. This exception is about assembling a distribution, not about letting the result
    leave the licence. The executable is copied and distributed "under GPL2", so the reciprocity still
    reaches the whole combination and only the designated exception modules keep their own terms.
  action: applied
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: dalicc:promote is prohibited because GPL-2.0-only prohibits it and an exception record
    keeps every statement of its base. Neither the base text nor the exception has a trademark or endorsement
    clause, so the prohibition is a library convention here and not text-supported. The review of GPL-2.0-only
    proposed removing it library-wide.
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: The licence-wide cc:ShareAlike duty of GPL-2.0-only stays on the odrl:Set, because the
    reciprocity of the base licence still covers the whole work. cc:Attribution, cc:Notice and cc:SourceCode
    stay on distribute, modify and derive, and dalicc:modificationNotice on modify and derive. The carve-out
    is conditional on the designated exception modules continuing "to be governed by the licenses under
    which they were offered by Oracle". That is a condition about the other modules' licences, which no
    duty action can hold, so it stays in the quoted clause.
  action: applied
- rubric: 5
  severity: minor
  field: dalicc:reciprocityScope
  description: 'dalicc:reciprocityScope says in words how far the copyleft reaches after the exception:
    "the whole combination, which stays under GPL2, except the designated exception modules". The base
    record carries no such annotation, because without the exception the reciprocity reaches the whole
    work.'
  action: applied
- rubric: 6
  severity: major
  field: dalicc:additionalClauses
  description: The exception text is quoted verbatim as one literal of dalicc:additionalClauses, from
    https://spdx.org/licenses/OpenJDK-assembly-exception-1.0.html. Line breaks and runs of spaces were
    collapsed to single spaces, the way every other clause literal in the library is written; no word
    was changed, added or dropped. The warranty disclaimer and the limitation of liability are the ones
    of GPL-2.0-only, quoted verbatim from the base text, because the exception changes neither.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The base text and the exception name no legal system, so cc:jurisdiction stays dalicc:worldwide,
    dalicc:validityType stays dalicc:perpetual and no dalicc:governingLaw is stated. The termination and
    cure terms of the base licence are untouched by the exception.
  action: applied
- rubric: 8
  severity: gap
  field: dalicc:exceptedCombination
  description: 'The exception carves the combination out of the condition of the licence, not out
    of its grant. dalicc:exemptedMaterial says the opposite and is prohibited on OGL-UK-1.0, OGL-UK-2.0 and
    NLOD-2.0, where it means material the licence never granted. The vocabulary defines
    dalicc:exceptedCombination for this side of it since 2026-09-23, and the record carries it as
    a permission.'
  action: applied
- rubric: 8
  severity: gap
  field: dalicc:additionalClauses
  description: 'The material the exception carves out is not described in the text. It is whatever is
    "licensed by Oracle as indicated at http://openjdk.java.net/legal/exception-modules-2007-05-08.html",
    an external list that may change. The vocabulary cannot hold a pointer to such a list, so the sentence
    is quoted and the URL travels with it. Proposed term: dalicc:exceptedCombinationList, an annotation carrying
    the address of the list.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check against dg_default returned no conflicts. The exempted permission
    is a new action for the checker, it is not prohibited anywhere and the dependency graph holds no relation
    for it, so it neither triggers nor hides a conflict. The share-alike rule is not triggered, because
    dalicc:ChangeLicense stays prohibited.
  action: none
- rubric: 10
  severity: info
  field: dalicc:variantOf
  description: 'The record is the base licence plus the exception, so it repeats GPL-2.0-only statement
    for statement and adds four things: the dalicc:exceptedCombination permission, the dalicc:reciprocityScope
    annotation, the exception text in dalicc:additionalClauses and the pair dalicc:variantKind "exception"
    with dalicc:variantOf dalicclib:GPL-2.0-only. Nothing the base states was removed.'
  action: applied
family: GNU copyleft family (GPL, LGPL, AGPL, FDL)
port_of: null
variant_kind: exception
variant_of: GPL-2.0-only
notes: 'The base licence text is the SPDX text of GPL-2.0-only, retrieved on 2026-09-22; the exception
  text is the SPDX text of OpenJDK-assembly-exception-1.0, from https://spdx.org/licenses/OpenJDK-assembly-exception-1.0.html.
  Nothing here is legal advice: the record says what the two texts say and quotes them. An exception record
  never removes a statement its base carries, so anything that looks wrong in this record and is also
  in GPL-2.0-only belongs to the base record and is written up as a proposal instead.'
