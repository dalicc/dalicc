id: CreativeCommonsAttributionNoncommercialSharealike20Netherlands
title: Creative Commons Attribution-NonCommercial-ShareAlike 2.0 Netherlands
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://creativecommons.org/licenses/by-nc-sa/2.0/nl/legalcode
text_retrieved: true
verdict: corrected
summary: 'The record models the BY-NC-SA element set of the Creative Commons 2.0 port for Netherlands
  and it does so correctly: the NonCommercial element prohibits cc:CommercialUse, the ShareAlike element
  carries a cc:ShareAlike duty, the attribution and notice duties hang on the acts that make the work
  public, and the permissions, prohibitions and duties all follow from the grant and the restrictions
  sections of the port. The legal text was read in Dutch. Corrections applied: dct:source, odrl:target
  dcmitype:Dataset. What remains are proposals that touch the whole Creative Commons family rather than
  this record, chiefly the express prohibition of sublicensing.'
findings:
- rubric: 1
  severity: minor
  field: dct:source
  description: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
    URL of the licence, https://creativecommons.org/licenses/by-nc-sa/2.0/nl/, and the six 4.0 International
    parents carry exactly that pair, legal code plus deed. Added.
  action: applied
  change: dct:source <https://creativecommons.org/licenses/by-nc-sa/2.0/nl/> ;
- rubric: 2
  severity: minor
  field: odrl:target
  description: 'The record targeted dalicc:CreativeWork only, while the 4.0 International parent CC-BY-NC-SA-4.0
    targets dalicc:CreativeWork and dcmitype:Dataset. This port licenses database rights in its own words,
    so the asset type is text supported rather than merely plausible. Article 1 brings a database inside
    the licensed work: "Voor de toepassing van deze Licentie wordt onder het Werk mede verstaan de geluidsopname
    in de zin van de Wet op de naburige rechten en de databank in de zin van de Databankenwet", the Dutch
    statute that implements the sui generis database right of directive 96/9/EC. The grant in article
    3 then carries "het opvragen en hergebruiken van het Werk", the extraction and re-utilisation right
    itself, and the preamble names "het databankenrecht" among the rights protecting the work. Added dcmitype:Dataset.'
  action: applied
  change: |-
    odrl:target [ a odrl:AssetCollection ;
            dct:type dalicc:CreativeWork,
                dcmitype:Dataset ] ;
- rubric: 3
  severity: info
  field: odrl:permission
  description: 'Every modelled permission is supported by the grant. Article 3 grants "een wereldwijde,
    niet-exclusieve licentie om de navolgende rechten met betrekking tot het Werk vrij van royalty''s
    uit te oefenen voor de duur van de toepasselijke intellectuele eigendomsrechten", a worldwide non
    exclusive royalty free licence for the term of the applicable rights. It covers reproduction, incorporation
    into collections, distribution of copies or sound recordings, public display, performance and digital
    performance of the work, and the making and reproduction of derivative works and their distribution,
    display, performance and digital performance (article 3.b and 3.d). The record models this as odrl:reproduce,
    odrl:distribute, odrl:display, odrl:present, odrl:derive and cc:DerivativeWorks, plus odrl:modify
    and dalicc:ModifiedWorks, which rest on the technical modification sentence of the grant: Article
    3: "De Gebruiker is tevens gerechtigd om technische wijzigingen aan te brengen die noodzakelijk zijn
    om de rechten met behulp van andere media, dragers en formats uit te oefenen."'
  action: none
- rubric: 3
  severity: minor
  field: odrl:permission
  description: 'The record permits dalicc:chargeDistributionFee while prohibiting cc:CommercialUse. Article
    4(c): "Het is de Gebruiker niet toegestaan om de krachtens artikel 3 aan de Gebruiker verleende rechten
    uit te oefenen op een wijze die in de eerste plaats is bedoeld voor of is gericht op zakelijk of persoonlijk
    financieel gewin", with the file sharing carve out that follows it. The vocabulary defines dalicc:chargeDistributionFee
    as a fee covering the act of providing the work to a third party, so a pure cost recovery fee is arguable
    under the primary purpose test, but the statement sits uneasily next to the prohibition. The same
    statement is in the 4.0 International parent CC-BY-NC-SA-4.0 and in every NonCommercial record of
    the library, so removing it is one library wide decision, not a defect of this port.'
  action: proposed
  change: |-
    remove:
        odrl:permission [ a odrl:Permission ;
                odrl:action dalicc:chargeDistributionFee ]
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'The licence forbids sublicensing and the record does not say so. Article 4(a): "Het is
    de Gebruiker niet toegestaan om het Werk in sublicentie te geven." The vocabulary already has dalicc:sublicense,
    but no record in the library uses it and its skos:note says so, and the same sentence stands in every
    Creative Commons 2.0 and 3.0 record, so adding it to this batch alone would split the compatibility
    behaviour of one family. Proposed as one library wide correction, together with an update of the vocabulary
    note.'
  action: proposed
  change: |-
    odrl:prohibition [ a odrl:Prohibition ;
            odrl:action dalicc:sublicense ] ;
- rubric: 4
  severity: info
  field: odrl:prohibition
  description: 'dalicc:ChangeLicense is prohibited, which the licence supports: Article 4(a): "Het is
    de Gebruiker niet toegestaan om het Werk onder enige afwijkende voorwaarden aan te bieden waardoor
    de voorwaarden van deze Licentie dan wel de uitoefening van de rechten van de ontvangers krachtens
    deze Licentie worden gewijzigd of beperkt." dalicc:promote is prohibited, which rests on the reservation
    of all rights not expressly granted ("Alle niet uitdrukkelijk verleende rechten zijn hierbij voorbehouden
    aan de Licentiegever") and the Creative Commons trademark paragraph of the notice around the licence
    body, not a clause of the licence itself cc:CommercialUse is prohibited, which the NonCommercial element
    of this set states directly.'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: The attribution and notice duties are present and supported. Article 4(a) requires a copy
    of the licence or its Uniform Resource Identifier with every copy or sound recording distributed,
    displayed, performed or digitally performed, and that every reference to the licence and to the exclusion
    of warranty be left standing. Credit is owed to the "Maker", the natural or legal person who made
    the original work, by name or pseudonym, with the title of the work and, where reasonably applicable,
    the URI the licensor associates with it; a derivative work must refer to the use made of the work,
    for example "De Franse vertaling van het Werk van de Maker". The parties are named "Licentiegever"
    and "Gebruiker" rather than licensor and licensee.. Article 4(d) requires a derivative work to refer
    to the use made of the work ("door te verwijzen naar het gebruik van het Werk in het Afgeleide werk").
    The duties hang on odrl:distribute, odrl:modify and odrl:derive, which matches the licence, since
    they are triggered by making the work public rather than by private use. The cc:ShareAlike duty is
    carried at the level of the odrl:Set, as in the parent CC-BY-NC-SA-4.0.
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: 'The share alike clause of this port is wider than a flat prohibition of relicensing. Article
    4(b): "De Gebruiker mag het Afgeleide werk uitsluitend verspreiden, in het openbaar tonen, op- of
    uitvoeren of digitaal uitvoeren met inachtneming van de voorwaarden van deze Licentie, een latere
    versie van deze Licentie met overeenkomstige Licentiebepalingen, of een Creative Commons iCommons
    Licentie met overeenkomstige Licentiebepalingen." The record expresses it as a cc:ShareAlike duty
    plus a dalicc:ChangeLicense prohibition, which cannot say that a later version of the same licence,
    or another jurisdiction port with the same licence elements, is an acceptable outgoing licence. The
    4.0 International parent CC-BY-NC-SA-4.0 has the same limitation, and the consistency check would
    report a conflict if dalicc:ChangeLicense were permitted next to cc:ShareAlike, so the present modelling
    is the only one the checker allows.'
  action: none
- rubric: 6
  severity: info
  field: dalicc:WarrantyDisclaimer
  description: 'dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation are quoted from the Dutch text
    of this port and not from the English unported version, and each field holds its own clause. Article
    5 (Garantie en vrijwaring) and article 6 (Beperking van de aansprakelijkheid) are separate articles
    and the record keeps them apart: dalicc:WarrantyDisclaimer holds article 5 and dalicc:LiabilityLimitation
    holds article 6, both quoted verbatim in Dutch and in the upper case of the original.'
  action: none
- rubric: 6
  severity: minor
  field: dalicc:LiabilityLimitation
  description: dalicc:LiabilityLimitation begins with a space, because the legal code page prints the
    article number and the sentence in two blocks ("6. Beperking van de aansprakelijkheid" then ". DE
    LICENTIEGEVER ..."). The quote is otherwise verbatim, and it was left untouched rather than silently
    edited.
  action: none
- rubric: 6
  severity: info
  field: dalicc:additionalClauses
  description: 'The record has no dalicc:additionalClauses, so the clauses the ODRL policy cannot carry
    stay invisible: the reservation of unnamed rights, the downstream offer to recipients, the severability,
    waiver and entire agreement paragraphs and the termination rule. Article 7 ends the licence automatically
    when the user acts contrary to it, keeps the licences of downstream recipients of collections alive
    and lets articles 1, 2, 5, 6, 7 and 8 survive; article 8 makes the licensor offer every recipient
    a licence on the same terms. The whole Creative Commons family is modelled this way.'
  action: none
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: 'cc:jurisdiction is bpicounty:Netherlands, which matches the country of the legal code
    URL https://creativecommons.org/licenses/by-nc-sa/2.0/nl/legalcode, and dalicc:validityType is dalicc:perpetual,
    which matches a grant made for the duration of copyright. The Dutch 2.0 port has no choice of law
    clause: article 8 ends with the severability, waiver and entire agreement paragraphs and names no
    applicable law or forum. cc:jurisdiction bpicounty:Netherlands therefore records the port, not a forum
    chosen by the text.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:prohibition
  description: 'The licence forbids technological protection measures and the vocabulary has no term for
    it. Article 4(a): "Het is de Gebruiker niet toegestaan om het Werk te verspreiden, in het openbaar
    te tonen, op of uit te voeren of digitaal uit te voeren met behulp van technologische voorzieningen
    die de toegang tot of het gebruik van het Werk beperken op een wijze die niet in overeenstemming is
    met de voorwaarden van deze Licentie-overeenkomst." Proposed term: dalicc:applyTechnicalProtectionMeasures,
    an odrl:Action to be used as an odrl:Prohibition. Not modelled, because bending an existing term would
    be worse than the gap.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The automatic termination of the licence on breach, the survival of the named sections
    and the licence the licensor offers to every downstream recipient have no vocabulary terms. Article
    7 ends the licence automatically when the user acts contrary to it, keeps the licences of downstream
    recipients of collections alive and lets articles 1, 2, 5, 6, 7 and 8 survive; article 8 makes the
    licensor offer every recipient a licence on the same terms. Proposed terms: dalicc:terminationOnBreach
    and dalicc:downstreamOffer.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'Article 4 closes with a moral rights limit on the licensee, and it is the only port in
    this batch that cites the statute by article: "De in artikel 3 verleende rechten mogen worden uitgeoefend
    met inachtneming van het niet voor afstand vatbare morele recht van de maker (en/of de uitvoerende
    kunstenaar) krachtens artikel 25 lid 1 sub d van de Auteurswet 1912 (en/of artikel 5 lid 1 sub d van
    de Wet op de naburige rechten) om zich te verzetten tegen elke misvorming, verminking of andere aantasting
    van het werk, welke nadeel zou kunnen toebrengen aan de eer of de naam van de maker." Not expressible
    with the present vocabulary. Proposed terms: dalicc:moralRightsRestriction for the ports that bind
    the licensee and dalicc:moralRightsNonAssertion for the ports that bind the licensor.'
  action: none
- rubric: 8
  severity: info
  field: record
  description: 'The Dutch 2.0 port carries no collecting society clause at all: no royalty is reserved
    or waived anywhere in the six legal texts, and no collecting society is named. The French, Chilean,
    Australian, South African and Polish 2.0 ports all say something on the point, so the silence is a
    divergence inside one version rather than a property of version 2.0.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the forty one axioms of licensedata/dependencygraph/dg_default.ttl
    reports no conflict, before and after the corrections, and the pre review baseline listed none for
    this record either.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'Port of Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International. The deontic
    model of this record is identical to the parent, statement for statement: the same permissions with
    the same duties, the same prohibitions and the same set level duties, and after the correction above
    the same odrl:target as well. What differs is the jurisdiction, the language of the legal text, the
    clause texts, and the version specific clauses of 2.0 that the model does not carry, chiefly the express
    prohibition of sublicensing, the technological measures clause and the royalty collection arrangements.
    The compatibility checker cannot tell this record from any other record of the BY-NC-SA element set,
    across all three versions and every jurisdiction the library holds.'
  action: none
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: dalicc:promote was prohibited and no sentence of this text supports it. The statement was
    the library's reading of a legal default, that a copyright licence which says nothing about endorsement
    grants no right to it, and it sat in 519 of 581 records as a house convention. That reading is now
    an adopted dalicc:DefaultRule of the core dependency graph, which supplies it to every licence that
    is silent about the action, so a compatibility check reaches the same answer and the record states
    only what the text states. Removed on 2026-09-23; see section 13 of docs/LICENSE_REVIEW.md.
  action: applied
  change: "# removed\nodrl:prohibition [ a odrl:Prohibition ;\n        odrl:action dalicc:promote ] ;\n"
family: 'Creative Commons 2.0 port: Netherlands (NL)'
port_of: CC-BY-NC-SA-4.0
variant_kind: jurisdiction-port
notes: The parent is the 4.0 International record of the same element set, since the library holds no
  unported and no International 2.0 record; the version difference, 2.0 against 4.0, is therefore part
  of the port relation and not only the jurisdiction. The SPDX licence list defines no identifier for
  this port, so the record carries no spdx:licenseId and none was invented. Nothing in this review is
  legal advice.
