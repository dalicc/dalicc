id: APL-1.0
title: Adaptive Public License 1.0
reviewed_on: 2026-09-15
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/APL-1.0.txt
text_retrieved: true
verdict: corrected
summary: 'The Adaptive Public License is a reciprocal license: executable distributions must be made under
  section 2 of the same license and must be accompanied by source code or a written offer for it. The
  record prohibited cc:ShareAlike, the exact opposite of what the text requires. That prohibition was
  removed; turning it into a duty needs a decision on the dependency graph first.'
findings:
- rubric: 5
  severity: major
  field: odrl:prohibition
  description: Section 3.2 states that an Executable Distribution may be made "under the terms of Section
    2 of this License, provided the Executable Distribution is made available under and accompanied by
    a copy of this License". The record prohibited cc:ShareAlike, which reverses the license. Removed.
  action: applied
  change: "# removed\nodrl:prohibition [ a odrl:Prohibition ;\n        odrl:action cc:ShareAlike ] ;\n"
- rubric: 5
  severity: major
  field: odrl:duty
  description: 'The positive half of the same finding: reciprocity should appear as a license-wide cc:ShareAlike
    duty, the way the GNU and Mozilla records model it. It was not applied because the record also permits
    odrl:grantUse, and the dependency graph axiom "cc:ShareAlike dalicc:contradicts odrl:grantUse" would
    then report a direct conflict. Sections 2.1(d) and 2.2(d) do grant sublicensing, so the axiom, not
    the record, is what has to move. See the batch report.'
  action: proposed
  change: "odrl:duty [ a odrl:Duty ;\n        odrl:action cc:ShareAlike ] ;\n"
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: dalicc:addStatement is prohibited. Section 3.5 lets a distributor offer warranty, support
    or indemnity on its own behalf, so the prohibition is too broad, though section 3.1 does forbid terms
    that alter the license.
  action: none
- rubric: 8
  severity: gap
  field: vocabulary
  description: 'Sections 2.1(b) and 2.2(b) grant patent licenses and section 8.2 terminates them on patent
    action. The Supplement File mechanism, which lets each licensor name its own jurisdiction and trademark
    terms in Parts 1 to 3, has no term either. Proposed: dalicc:patentGrant, dalicc:patentRetaliationTermination,
    dalicc:licenseSupplement.'
  action: none
- rubric: 7
  severity: minor
  field: cc:jurisdiction
  description: cc:jurisdiction is dalicc:worldwide, but Part 1 of the Supplement File names the governing
    jurisdiction, so the answer is licensor-specific rather than worldwide.
  action: none
- rubric: 10
  severity: minor
  field: record
  description: 'Standard-license addition of 2026-09-15, decision 9 and 10: the record was corrected against
    its new siblings and versioned. Family rule 14 of scripts/review/family_rules.py: the warranty and
    liability literals carried a padding space inside their quotation marks.'
  action: applied
- rubric: 4
  severity: minor
  field: odrl:prohibition
  description: dalicc:promote was prohibited and no sentence of this text supports it. The statement was
    the library's reading of a legal default, that a copyright licence which says nothing about endorsement
    grants no right to it, and it sat in 519 of 581 records as a house convention. That reading is now
    an adopted dalicc:DefaultRule of the core dependency graph, which supplies it to every licence that
    is silent about the action, so a compatibility check reaches the same answer and the record states
    only what the text states. Removed on 2026-09-23; see section 13 of docs/LICENSE_REVIEW.md.
  action: applied
  change: "# removed\nodrl:prohibition [ a odrl:Prohibition ;\n        odrl:action dalicc:promote ] ;\n"
family: Other OSI approved licenses (corporate, academic, weak copyleft)
port_of: null
variant_kind: null
notes: 'This record uses the composer template shared by AAL, AFL-3.0, APL-1.0, APSL-2.0, CATOSL-1.1,
  CECILL-2.1, EPL-1.0 and PHP-3.0: bare odrl:derive and odrl:modify permissions with the real duties hung
  on cc:DerivativeWorks, plus a fixed block of three prohibitions (cc:ShareAlike, dalicc:addStatement,
  dalicc:promote). The template fits a permissive license and misdescribes every reciprocal one.'
