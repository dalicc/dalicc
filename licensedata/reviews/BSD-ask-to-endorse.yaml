id: BSD-ask-to-endorse
title: BSD - ask to endorse
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/BSD-ask-to-endorse.txt
text_retrieved: true
verdict: created
summary: Models the shortest member of the BSD family, in which the no-endorsement clause is the only condition
  of the grant. Unlike every other BSD record in the library this one carries no attribution or notice duty at all,
  because the text imposes none. Nothing here is legal advice.
findings:
- rubric: 3
  severity: major
  field: odrl:permission
  description: The grant reads "Redistribution and use in source and binary forms, with or without modification,
    are permitted provided that neither the name of Emin Martinian nor the names of any contributors are be used
    to endorse or promote products derived from this software without specific prior written permission". Redistribution
    and use are permitted, so the record carries the usual BSD permission set.
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'The single condition is the no-endorsement clause quoted above, modelled as a dalicc:promote prohibition.
    dalicc:ChangeLicense is prohibited as in the rest of the family. (Corrected on 2026-09-15 by the verification
    of this batch: see the rubric 3 finding on relicensing below.)'
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: 'No cc:Attribution and no cc:Notice duty is written. The text has no retention condition: it does
    not require the copyright notice, the list of conditions or the disclaimer to be reproduced. This is the one
    real difference from every other BSD record and it changes the compatibility answers, so it is recorded as a
    major finding.'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: The grant sentence is quoted verbatim because its structure, a permission whose only proviso is a
    prohibition, is unusual enough that a reader should be able to check it. The warranty and liability sentences
    are split as elsewhere in this batch.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no legal system and sets no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer with the dependency graph dg_default returned an empty
    conflict list.
  action: none
- rubric: 10
  severity: info
  field: record
  description: Follows licensedata/licenses/BSD-3-Clause.ttl for the prohibition set and BSD-2-Clause for the permission
    set, but carries none of the duties either of them carries.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Family rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier pass wrote is removed. The text reads: "Redistribution and use in source and binary forms, with
    or without modification, are permitted provided that neither the name of Emin Martinian nor the names of any
    contributors are be used to endorse or promote products derived from this software without specific prior written
    permission." The permission carries no duty, as on the public-domain dedications, because nothing has to travel
    with the copy.'
  action: applied
family: BSD variants
port_of: null
variant_kind: null
notes: The grammar of the condition ("are be used") is reproduced verbatim from the source text. cc:legalcode points
  at the sudo source file SPDX names as the canonical location.
