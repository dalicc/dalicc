id: Naumen
title: Naumen Public License
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://opensource.org/license/Naumen
text_retrieved: true
verdict: created
summary: 'The Naumen Public License is a five-condition BSD text: the two redistribution conditions, a no-endorsement
  clause, an express statement that no trademark or service mark rights come with the licence, and a requirement
  to mark changed files with the date of the change. The record follows BSD-3-Clause. Nothing here is legal advice.'
findings:
- rubric: 2
  severity: info
  field: odrl:target
  description: dcmitype:Software alone, following BSD-3-Clause, whose text this licence follows sentence for sentence.
    The licence speaks of software in source and binary forms and of nothing else.
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: '"Redistribution and use in source and binary forms, with or without modification, are permitted
    provided that the following conditions are met" gives the permissive base set. The text says nothing about patents
    or about sublicensing, so neither is written.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'Condition 3 bars the use of the name NAUMEN to endorse or promote products and condition 4 says
    "The right to distribute this software or to use it for any purpose does not give you the right to use Servicemarks
    (sm) or Trademarks (tm) of NAUMEN", which together are dalicc:promote. dalicc:ChangeLicense is prohibited because
    conditions 1 and 2 require the list of conditions to travel with every copy. (Corrected on 2026-09-15 by the
    verification of this batch: see the rubric 3 finding on relicensing below.)'
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: Conditions 1 and 2 give cc:Attribution and cc:Notice on the three acts. Condition 5, "If any files
    originating from NAUMEN or Contributors are modified, you must cause the modified files to carry prominent notices
    stating that you changed the files and the date of any change", is dalicc:modificationNotice on odrl:modify
    and odrl:derive.
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: The disclaimer is split at "IN NO EVENT SHALL" into the warranty and liability fields. dalicc:additionalClauses
    carries conditions 3 and 4 and the closing sentence about the credits file.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: The text names no governing law and no term, so cc:jurisdiction is dalicc:worldwide and dalicc:validityType
    is dalicc:perpetual.
  action: applied
- rubric: 8
  severity: info
  field: vocabulary
  description: 'No gap: the accompanying credits file named in the closing sentence is a statement of fact, not
    an obligation, and every operative clause has a term.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer with the axioms of dg_default returned an empty list
    for this record.
  action: none
- rubric: 10
  severity: info
  field: family
  description: Naumen is Entessa without the prescribed acknowledgment and the product-naming bar, and with a modification
    notice added. The two records differ in exactly those duties.
  action: none
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Family rule 15 of scripts/review/family_rules.py: a licence that asks for no reciprocity and no
    source code asks only that the notice travels with the copy, which is a duty on the acts it governs and not
    a bar on putting the copy under other terms. dalicc:ChangeLicense is therefore a permission here, and the prohibition
    the earlier pass wrote is removed. The text reads: "Redistribution and use in source and binary forms, with
    or without modification, are permitted provided that the following conditions are met: 1. Redistributions in
    source code must retain the above copyright notice, this list of conditions, and the following disclaimer."
    The permission carries the dalicc:compliantLicense duty, as Apache-2.0 does, because the notice has to survive
    the relicensing.'
  action: applied
family: Eclipse, Common Public and Lucent
port_of: null
variant_kind: null
notes: Modelled from the SPDX plain text of Naumen and checked against the URL in cc:legalcode.
