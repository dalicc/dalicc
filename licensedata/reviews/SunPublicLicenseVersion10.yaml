id: SunPublicLicenseVersion10
title: SUN PUBLIC LICENSE Version 1.0
reviewed_on: 2026-09-15
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/SPL-1.0.txt
text_retrieved: true
verdict: corrected
summary: 'The Sun Public License is the Mozilla Public License 1.1 with a Sun-specific jurisdiction clause.
  It is reciprocal and it grants sublicensing. The record had both backwards: share-alike as an optional
  permission and sublicensing prohibited. Both were corrected and the SPDX id was added.'
findings:
- rubric: 5
  severity: major
  field: odrl:permission
  description: Section 3.1 states that "The Modifications which You create or to which You contribute
    are governed by the terms of this License, including without limitation Section 2.2." That is a duty.
    Removed the cc:ShareAlike permission and added a license-wide cc:ShareAlike duty.
  action: applied
  change: |
    # removed the cc:ShareAlike permission; added
    odrl:duty [ a odrl:Duty ;
            odrl:action cc:ShareAlike ] ;
- rubric: 3
  severity: major
  field: odrl:prohibition
  description: Sections 2.1(b) and 2.2(b) grant the right to "use, reproduce, modify, display, perform,
    sublicense and distribute the Original Code (or portions thereof) with or without Modifications".
    The record prohibited odrl:grantUse. Removed the prohibition; the matching permission is held back
    by the same dependency-graph axiom as in OSL-3.0.
  action: applied
  change: |
    # removed
    odrl:prohibition [ a odrl:Prohibition ;
            odrl:action odrl:grantUse ] ;
- rubric: 3
  severity: major
  field: odrl:permission
  description: The permission that belongs with the finding above, pending the dependency-graph decision.
  action: proposed
  change: |
    odrl:permission [ a odrl:Permission ;
            odrl:action odrl:grantUse ] ;
- rubric: 1
  severity: minor
  field: spdx:licenseId
  description: 'Added SPL-1.0. Verified rather than assumed: cc:legalcode and dct:source already point
    at the Open Source Initiative page for SPL-1.0 and the fetched text is the Sun Public License version
    1.0.'
  action: applied
  change: |
    spdx:licenseId "SPL-1.0" ;
- rubric: 6
  severity: minor
  field: dalicc:WarrantyDisclaimer
  description: The stored disclaimer contains the artefact "../AS IS''" where the text reads "AS IS".
    It comes from the source the record was built from. Correcting a published literal is left open for the association's decision.
  action: proposed
  change: |
    dalicc:WarrantyDisclaimer "COVERED CODE IS PROVIDED UNDER THIS LICENSE ON AN \"AS IS\" BASIS, WITHOUT WARRANTY OF ANY KIND ..." ;
- rubric: 8
  severity: gap
  field: vocabulary
  description: 'Patent grant, patent retaliation and the Sun-specific jurisdiction clause (section 11
    names California law and, for Sun, the courts of Santa Clara County) have no terms. Proposed: dalicc:patentGrant,
    dalicc:patentRetaliationTermination.'
  action: none
- rubric: 10
  severity: info
  field: family
  description: This record, CommonDevelopmentAndDistributionLicense10 and CommonPublicAttributionLicenseVersion10
    are all derived from the Mozilla Public License 1.1 and should model reciprocity identically. After the review this one and the Common Public Attribution record agree; the Common Development and Distribution
    record still permits dalicc:ChangeLicense instead.
  action: none
family: Other OSI approved licenses (corporate, academic, weak copyleft)
port_of: null
variant_kind: null
notes: Historic license, superseded by the Common Development and Distribution License.
