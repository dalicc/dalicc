id: CC-BY-NC-SA-3.0
title: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported
reviewed_on: '2026-09-22'
reviewer: Giray Havur
text_source: https://raw.githubusercontent.com/spdx/license-list-data/main/text/CC-BY-NC-SA-3.0.txt
text_retrieved: true
verdict: created
summary: The record models the BY-NC-SA element set of the Creative Commons 3.0 unported legal code,
  the text the library's 3.0 jurisdiction ports were adapted from. The deontic model is the one the
  4.0 record of the same element set and all of its ports use, so a compatibility answer for this record
  matches theirs; what the text adds over 4.0, and what it lacks, is quoted in dalicc:additionalClauses
  and set out in the findings. Nothing here is legal advice.
findings:
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: The file name, the local name of the odrl:Set IRI, the SPDX identifier and the id of
    this review record are all CC-BY-NC-SA-3.0. The text modelled is the plain text the SPDX license
    list publishes for that identifier. cc:legalcode points at the legal code page of the licence and
    dct:source at its deed, which is the pair every Creative Commons record in the library carries.
  action: applied
- rubric: 2
  severity: minor
  field: odrl:target
  description: 'odrl:target carries dalicc:CreativeWork and dcmitype:Dataset. The 3.0 text is the first
    of the unported line to name data in the definition of the Work: Section 1(f) includes "a compilation
    of data to the extent it is protected as a copyrightable work". There is no sui generis database
    right clause in this text, so the dataset type rests on that sentence alone and not on a database
    right the licence licenses or waives. The 3.0 jurisdiction ports in the library carry the same pair.'
  action: applied
- rubric: 3
  severity: major
  field: odrl:permission
  description: 'Section 3 grants "to Reproduce the Work, to incorporate the Work into one or more Collections,
    and to Reproduce the Work as incorporated in the Collections" and "to Distribute and Publicly Perform
    the Work including as incorporated in Collections", which are odrl:reproduce, odrl:distribute, odrl:display
    and odrl:present. It also grants "to create and Reproduce Adaptations provided that any such Adaptation,
    including any translation in any medium, takes reasonable steps to clearly label, demarcate or otherwise
    identify that changes were made to the original Work", which is odrl:modify, odrl:derive, cc:DerivativeWorks
    and dalicc:ModifiedWorks. cc:CommercialUse is not permitted, because the NonCommercial element bars
    it; see the prohibitions. dalicc:chargeDistributionFee is permitted: the licence says nothing about
    a fee for handing a copy over, and every Creative Commons record in the library reads that silence
    the same way.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'dalicc:sublicense, from "You may not sublicense the Work.", which this text states in
    as many words; this is consolidation decision 1 of the 2026-09-15 review and the validator enforces
    it. dalicc:ChangeLicense, from "You may Distribute or Publicly Perform the Work only under the terms
    of this License". dalicc:promote. The endorsement bar sits in the licence body of the 3.0 text:
    "by exercising Your rights under this License, You may not implicitly or explicitly assert or imply
    any connection with, sponsorship or endorsement by the Original Author, Licensor and/or Attribution
    Parties, as appropriate, of You or Your use of the Work, without the separate, express prior written
    permission of the Original Author, Licensor and/or Attribution Parties". cc:CommercialUse is prohibited,
    from "You may not exercise any of the rights granted to You in Section 3 above in any manner that
    is primarily intended for or directed toward commercial advantage or private monetary compensation."'
  action: applied
- rubric: 5
  severity: major
  field: odrl:duty
  description: cc:Notice and cc:Attribution hang on odrl:distribute, from "You must include a copy of,
    or the Uniform Resource Identifier (URI) for, this License with every copy of the Work You Distribute
    or Publicly Perform" and "You must, unless a request has been made pursuant to Section 4(a), keep
    intact all copyright notices for the Work and provide, reasonable to the medium or means You are
    utilizing". The same two, plus dalicc:modificationNotice, hang on odrl:modify and odrl:derive. dalicc:modificationNotice
    rests on "takes reasonable steps to clearly label, demarcate or otherwise identify that changes
    were made to the original Work". cc:ShareAlike is a licence-wide duty, as on the 4.0 record of this
    element set. dalicc:reciprocityScope says how far it reaches, because the licence puts the condition
    on the Adaptation and expressly leaves the Collection out of it, and dalicc:shareAlikeVersionQualifier
    names the licences the condition accepts. Both literals are a first in the library; no record used
    either term before. The duties hang on the acts that share the work with the public rather than
    on the licence as a whole, which is how the whole Creative Commons family is modelled.
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: 'dalicc:WarrantyDisclaimer and dalicc:LiabilityLimitation are quoted verbatim and each
    holds its own clause: the disclaimer is Section 5 and the limitation is Section 6, and the wording
    of both moves a little from version to version, so neither is copied from the 4.0 record. dalicc:additionalClauses
    carries the clauses the ODRL policy cannot express, in the order the licence states them. They are
    the share-alike clause, the non-commercial test with its file-sharing proviso, the royalty and collecting-society
    clause, the moral rights clause, the termination clause, the direct licence every recipient receives
    from the licensor. The 4.0 records and the 287 jurisdiction ports carry no dalicc:additionalClauses
    at all, so this record shows more of its text than its siblings do.'
  action: applied
- rubric: 6
  severity: minor
  field: dalicc:additionalClauses
  description: The SPDX plain text of this licence breaks the word connection across a line as "con-nection"
    inside the non-commercial clause. The quoted literal carries "connection", without the line-break
    hyphen, which is the only change made to any quoted sentence in this record.
  action: applied
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: 'cc:jurisdiction is dalicc:worldwide. This is the unported text, not a jurisdiction port:
    it names no country and no governing law, and the grant itself is "worldwide, royalty-free, non-exclusive,
    perpetual (for the duration of the applicable copyright)", so dalicc:validityType is dalicc:perpetual.
    dalicc:terminatesOnBreach is true, from "This License and the rights granted hereunder will terminate
    automatically upon any breach by You of the terms of this License." There is no cure period and
    no reinstatement, which is where this text differs from 4.0; dalicc:curePeriod is therefore absent.'
  action: applied
- rubric: 8
  severity: gap
  field: dalicc:additionalClauses
  description: 'The licence makes the licensee take the credit down again on request: "If You create
    a Collection, upon notice from any Licensor You must, to the extent practicable, remove from the
    Collection any credit as required by Section 4(d), as requested". No vocabulary term can say that.
    Proposed term: dalicc:creditRemovalOnRequest, a duty action on the acts that carry cc:Attribution.
    The clause is quoted instead.'
  action: none
- rubric: 8
  severity: info
  field: odrl:prohibition
  description: 'Three clauses of this text have a vocabulary term that no Creative Commons record uses:
    the technological measures bar (dalicc:applyTechnicalProtectionMeasures, used on two records in
    the library), the bar on offering or imposing further terms (dalicc:addLimitation) and the direct
    licence the recipient receives (dalicc:downstreamOffer, used nowhere). Adding them to the records
    of this set alone would split the compatibility behaviour of a family of 305 records, so they are
    quoted or left to the prohibition of dalicc:ChangeLicense, and proposed as one library-wide change.
    The royalty clause and the moral rights clause are different: they have a term of their own and this
    record states them, dalicc:royaltyCollectionReserved where the text reserves royalties and
    dalicc:moralRightsRestriction on every record of version 3.0.'
  action: proposed
- rubric: 9
  severity: info
  field: record
  description: The consistency check of app.services.composer against the axioms of licensedata/dependencygraph/dg_default.ttl
    returns an empty list for this record.
  action: none
- rubric: 10
  severity: info
  field: family
  description: 'The nearest sibling is CC-BY-NC-SA-4.0, the 4.0 International record of the same element
    set, and the deontic model here is identical to it, statement for statement, as it is on every jurisdiction
    port of this element set. What differs: the 3.0 text has no sui generis database rights section,
    no cure period and no automatic reinstatement after a breach; the share-alike condition names the
    licences it accepts, which 4.0 states differently. dalicc:variantKind is "version" and dalicc:licenseVersion
    is "3.0", the two predicates the library already uses to say that a record models an earlier text
    of a licence it also holds. There is no dalicc:jurisdictionPortOf and no country: this is the unported
    original the ports were adapted from, not a port.'
  action: none
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'Section 4 of every 3.0 unported text binds the licensee to the author''s honour and
    reputation: "You must not distort, mutilate, modify or take other derogatory action in relation
    to the Work which would be prejudicial to the Original Author''s honor or reputation." The record
    states it as a prohibition of dalicc:moralRightsRestriction, which the vocabulary defines for
    exactly that. Every 3.0 record of this addition states it and no 1.0, 2.0 or 2.5 record does,
    because the clause arrived with version 3.0.'
  action: applied
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'Section 4(e) reserves the royalties the licence does not give away: "In those
    jurisdictions in which the right to collect royalties through any statutory or compulsory
    licensing scheme cannot be waived, the Licensor reserves the exclusive right to collect such
    royalties for any exercise by You of the rights granted under this License", and the waivable
    schemes are reserved as well for a use "which is otherwise than noncommercial".
    dalicc:royaltyCollectionReserved carries it as a prohibition, because it is the licensee who may
    not exercise the reserved right. Every NonCommercial record of versions 2.0, 2.5 and 3.0 states
    it; the 1.0 texts have no royalty clause and their records state nothing.'
  action: applied
- rubric: 10
  severity: minor
  field: dalicc:additionalClauses
  description: The six records of this version quote the same passages of the version's text, each
    literal a single verbatim run of this record's own legal code, in the order the text states them.
    A passage the element set does not have is absent, which is a difference between the texts and
    not between two readings.
  action: applied
- rubric: 10
  severity: major
  field: dalicc:compatibleWith
  description: The share-alike clause lets an adaptation be released under "this license, a later version
    with the same license elements, or a Creative Commons jurisdiction license with the same license elements".
    CC-BY-NC-SA-4.0 is that later version of the same License Elements, so the record links it. dalicc:compatibleWith
    names CC-BY-NC-SA-4.0.
  action: applied
family: Creative Commons 3.0 Unported
port_of: null
variant_kind: version
variant_of: null
notes: Modelled from the SPDX plain text of CC-BY-NC-SA-3.0, checked sentence by sentence against the
  legal code at https://creativecommons.org/licenses/by-nc-sa/3.0/legalcode. Every quoted clause was
  verified to occur in that text. No quoted clause carries a long dash.
