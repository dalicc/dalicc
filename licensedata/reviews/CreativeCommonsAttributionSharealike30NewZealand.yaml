id: CreativeCommonsAttributionSharealike30NewZealand
title: Creative Commons Attribution-ShareAlike 3.0 New Zealand
reviewed_on: '2026-09-15'
reviewer: Giray Havur
text_source: https://creativecommons.org/licenses/by-sa/3.0/nz/legalcode
text_retrieved: true
verdict: corrected
summary: 'The record models the BY-SA element set of the Creative Commons 3.0 port for New Zealand and
  the grant and restriction sections support it: the attribution and notice duties hang on the acts that
  share the work with the public, and the prohibitions follow the restrictions clause. The legal text
  was read in English. Corrections applied: dct:source, dalicc:WarrantyDisclaimer. What remains are proposals
  that touch the whole Creative Commons family rather than this record, chiefly the express prohibition
  of sublicensing.'
findings:
- rubric: 1
  severity: minor
  field: dct:source
  description: The record carried cc:legalcode but no dct:source. The legal code page states the canonical
    URL of the licence, https://creativecommons.org/licenses/by-sa/3.0/nz/, and the six 4.0 International
    parents carry exactly that pair (legal code plus deed). Added.
  action: applied
  change: dct:source <https://creativecommons.org/licenses/by-sa/3.0/nz/> ;
- rubric: 1
  severity: info
  field: spdx:licenseId
  description: SPDX has no identifier for this port. The legal code URL implies CC-BY-SA-3.0-NZ, which
    the SPDX licence list does not define, so no identifier was invented. None of the forty two records
    in this batch has an SPDX identifier.
  action: none
- rubric: 2
  severity: minor
  field: odrl:target
  description: The record targets dalicc:CreativeWork only, while the 4.0 International parent CC-BY-SA-4.0
    targets dalicc:CreativeWork and dcmitype:Dataset. Creative Commons licences are media neutral and
    this port grants the rights in all media and formats now known or later devised, but its legal text
    carries no database rights clause, unlike the Portuguese, Czech and Azerbaijani ports of this batch.
    Aligning the ports with the parents is a single library wide decision covering every Creative Commons
    port, so it is left as a proposal here.
  action: proposed
  change: "odrl:target [ a odrl:AssetCollection ;\n        dct:type dalicc:CreativeWork,\n           \
    \ dcmitype:Dataset ] ;"
- rubric: 3
  severity: info
  field: odrl:permission
  description: The modelled permissions follow the grant. Clause 2.1 grants "a worldwide, royalty-free,
    non-exclusive, Licence for use and for the duration of copyright in the Work", covering copying the
    Work, creating Adaptations with a duty to identify the changes, incorporating the Work into Collections,
    copying Adaptations or the Work as incorporated, and publishing, distributing, archiving, performing
    or otherwise disseminating the Work, the Adaptation or the Work in a Collection to the public, in
    any material form in any media. The record models this as odrl:reproduce, odrl:distribute, odrl:display,
    odrl:present, odrl:modify, odrl:derive, cc:DerivativeWorks and dalicc:ModifiedWorks. cc:CommercialUse
    is permitted, which follows from the grant carrying no commercial restriction in this element set.
  action: none
- rubric: 4
  severity: major
  field: odrl:prohibition
  description: 'The licence forbids sublicensing and the record does not say so. Clause 2.1, under "You
    must not": "sublicense the Work" The vocabulary already has dalicc:sublicense, but no record in the
    library uses it and its skos:note says so, and the same sentence stands in every Creative Commons
    2.0 and 3.0 record, so adding it to the forty two ports of this batch alone would split the compatibility
    behaviour of one family. Proposed as one library wide correction, together with an update of the vocabulary
    note.'
  action: proposed
  change: "odrl:prohibition [ a odrl:Prohibition ;\n        odrl:action dalicc:sublicense ] ;"
- rubric: 4
  severity: info
  field: odrl:prohibition
  description: 'dalicc:ChangeLicense is prohibited, which the licence supports: the work may be shared
    only under the terms of this licence and the licensee may not offer or impose terms that alter or
    restrict it. dalicc:promote is prohibited, which the 3.0 text supports better than the 2.0 text did,
    because the no endorsement rule sits in the licence body rather than in the Creative Commons notice
    around it. Clause 2.1, under "You must": "not assert or imply any connection with sponsorship or endorsement
    by the Original Author or Licensor of You or Your use of the Work".'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: 'The attribution and notice duties are present and supported: the licence requires a copy
    of, or the URI for, the licence with every copy shared, that the notices referring to the licence
    and to the warranty clause be kept intact, and that credit be given to the author and to any attribution
    parties. dalicc:modificationNotice is supported by the duty to take reasonable steps to label a change.
    The duties hang on odrl:distribute, odrl:modify and odrl:derive, which matches the licence, since
    they are triggered by distributing or communicating the work to the public rather than by private
    use. In this port the port is a rewrite rather than a translation: six clauses instead of eight, the
    duties and prohibitions gathered under "You must not" and "You must" inside the grant clause, a duty
    to remove the credit if the Licensor asks, and Clause 7 on the role of Creative Commons inside the
    licence body.'
  action: none
- rubric: 5
  severity: info
  field: odrl:duty
  description: 'cc:ShareAlike is a set level duty, which matches the licence: the share alike condition
    bites on derivative works rather than on a single permission. The clause accepts a licence on the
    same terms and conditions, a later version of it with the same Licence Elements, or any other Creative
    Commons licence, Unported or jurisdiction, with the same Licence Elements, which the model cannot
    express, so the record cannot say that a differently ported licence of the same element set satisfies
    the duty.'
  action: none
- rubric: 6
  severity: minor
  field: dalicc:WarrantyDisclaimer
  description: The record quoted the warranty clause of the Attribution element set of this port, which
    reads "the Work or any Adaptation is licensed by the Licensor". Clause 3 of this element set reads
    "the Work is licensed by the Licensor on an 'as is' and 'as available' basis and without any warranty
    of any kind, either express or implied". The clause was requoted from this legal code, and the trailing
    space of the literal was dropped.
  action: applied
  change: 'dalicc:WarrantyDisclaimer """Except as required by law or as otherwise agreed in writing between
    the parties, the Work is licensed by the Licensor on an "as is" and "as available" basis and without
    any warranty of any kind, either express or implied.

    """ ;'
- rubric: 6
  severity: info
  field: dalicc:LiabilityLimitation
  description: dalicc:LiabilityLimitation is Clause 4 of this port, quoted verbatim, and it is the same
    sentence in all six element sets.
  action: none
- rubric: 6
  severity: info
  field: dalicc:additionalClauses
  description: 'The clauses the ODRL policy cannot carry are not visible in the record: the reservation
    of unnamed rights, the direct licence that every recipient receives from the licensor, the automatic
    termination on breach with the survival list, the severability, waiver and entire agreement paragraphs,
    and the royalty collection arrangements. The whole Creative Commons family is modelled this way.'
  action: none
- rubric: 7
  severity: info
  field: cc:jurisdiction
  description: 'cc:jurisdiction is bpicounty:NewZealand, which matches the country of the legal code URL
    https://creativecommons.org/licenses/by-sa/3.0/nz/legalcode, and dalicc:validityType is dalicc:perpetual,
    which matches a grant for the duration of the applicable copyright. The port chooses no governing
    law but is written on New Zealand statute, naming the Copyright Act 1994, and Clause 6.3 excludes
    third party rights: a person who is not a party to the Licence has no rights under it. Note that the
    jurisdiction field records the legal home of the port, not a territorial limit: the grant itself is
    worldwide.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:prohibition
  description: 'The licence forbids technological protection measures and the vocabulary has no term for
    it. Clause 2.1, under "You must not": "impose any digital rights management technology on the Work,
    the Adaptation or the Work as incorporated in a Collection that alters or restricts the terms of this
    Licence". Proposed term: dalicc:applyTechnicalProtectionMeasures, an odrl:Action to be used as an
    odrl:Prohibition. Not modelled, because bending an existing term would be worse than the gap.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The automatic termination of the licence on breach, with the survival of the definitions,
    the warranty and liability clauses and the miscellaneous provisions, has no vocabulary term. Proposed
    term: dalicc:terminationOnBreach. The direct licence that the licensor offers to every recipient of
    the work has none either. Proposed term: dalicc:downstreamOffer.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'Moral rights have no vocabulary term. Clause 2.1 forbids the licensee to "falsely Attribute
    the Work to someone other than the Original Author" and to "subject the Work to any derogatory treatment
    as defined in the Copyright Act 1994", and Clause 2.7 has the Licensor, where it is the Original Author,
    waive the right to object to derogatory treatment so far as adaptation requires. Proposed terms: dalicc:moralRightsRestriction
    for a clause that binds the licensee and dalicc:moralRightsNonAssertion for one in which the licensor
    undertakes not to assert them.'
  action: none
- rubric: 8
  severity: gap
  field: record
  description: 'The royalty collection arrangement has no vocabulary term. Clause 2.5 reserves the exclusive
    right to collect royalties, individually or through a collecting society, for any use of the Work
    which results in commercial advantage or private monetary compensation, and Clause 2.6 waives it for
    any use which does not. Proposed term: dalicc:royaltyCollectionReserved, with a counterpart for the
    waiver. Not expressible today, and it is one of the few places where the ports of one version really
    differ from each other.'
  action: none
- rubric: 8
  severity: gap
  field: odrl:duty
  description: 'The share alike duty that accepts a later version of the same licence or another jurisdiction
    port with the same licence elements cannot be expressed. Proposed term: a property on the cc:ShareAlike
    duty, for example dalicc:shareAlikeAccepts.'
  action: none
- rubric: 9
  severity: info
  field: record
  description: The consistency check with the forty one axioms of licensedata/dependencygraph/dg_default.ttl
    reports no conflict, before and after the corrections, and the pre-review baseline listed none for
    this record either.
  action: none
- rubric: 10
  severity: info
  field: record
  description: 'Port of CC-BY-SA-4.0, the 4.0 International record of the same element set. The deontic
    model of this record is identical to the parent, statement for statement: the same permissions with
    the same duties, the same prohibitions, the same set level duties, and only odrl:target still differs,
    because the parent also carries dcmitype:Dataset. What differs is the jurisdiction, the language of
    the legal text, the clause texts and the version specific clauses of 3.0 that the model does not carry,
    chiefly the express prohibition of sublicensing, the technological measures clause, the royalty collection
    arrangement and the moral rights clause. The compatibility checker cannot tell this record from the
    other records of the BY-SA element set, across all three versions and every jurisdiction the library
    holds.'
  action: none
family: 'Creative Commons 3.0 port: New Zealand (NZ)'
port_of: CC-BY-SA-4.0
variant_kind: jurisdiction-port
notes: 'The parent is the 4.0 International record of the same element set, since the library holds no
  unported and no International 3.0 record; the version difference, 3.0 against 4.0, is therefore part
  of the port relation and not only the jurisdiction. The 3.0 text differs from 4.0 in substance as well:
  it prohibits sublicensing expressly, it forbids technological protection measures, it has no thirty
  day cure period for a breach, and it settles the royalty collection question and the moral rights question
  per jurisdiction. None of that is visible in the model. Nothing in this review is legal advice.'
